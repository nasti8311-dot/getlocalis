<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiiViu – Auszahlung</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#222}
    h1{margin-bottom:8px}.hint{color:#666;margin-bottom:24px}
    label{display:block;margin:16px 0 6px;font-weight:600}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
    button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:8px;font-size:16px;cursor:pointer}
    #result{margin-top:20px;padding:14px;border-radius:8px;white-space:pre-wrap}
    .ok{background:#e9f7ee}.error{background:#fdecec}
  </style>
</head>
<body>
  <h1>FiiViu Auszahlung</h1>
  <div class="hint">Interne Auszahlungserfassung. Diese Seite verändert den öffentlichen Partnerbereich nicht.</div>

  <label for="token">Admin-Schlüssel</label>
  <input id="token" type="password" autocomplete="off" placeholder="Cloudflare Admin-Schlüssel">

  <label for="partnerRef">Partner-Code</label>
  <input id="partnerRef" placeholder="z. B. TEST001">

  <label for="amount">Auszahlungsbetrag (€)</label>
  <input id="amount" type="number" min="0.01" step="0.01" placeholder="z. B. 1.74">

  <label for="date">Auszahlungsdatum</label>
  <input id="date" type="date">

  <label for="reference">Referenz (optional)</label>
  <input id="reference" placeholder="z. B. Überweisung 15.10.2026">

  <button id="submit">Auszahlung speichern</button>
  <div id="result"></div>

  <script>
    const dateInput = document.getElementById('date');
    dateInput.value = new Date().toISOString().slice(0,10);

    document.getElementById('submit').addEventListener('click', async () => {
      const result = document.getElementById('result');
      result.className = '';
      result.textContent = 'Speichere...';

      const token = document.getElementById('token').value.trim();
      const partnerRef = document.getElementById('partnerRef').value.trim();
      const amount = Number(document.getElementById('amount').value);
      const payoutDate = dateInput.value;
      const reference = document.getElementById('reference').value.trim();

      if (!token || !partnerRef || !Number.isFinite(amount) || amount <= 0 || !payoutDate) {
        result.className = 'error';
        result.textContent = 'Bitte alle Pflichtfelder korrekt ausfüllen.';
        return;
      }

      try {
        const response = await fetch('/api/admin/partner-payout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            partnerRef,
            amountCents: Math.round(amount * 100),
            payoutDate,
            reference
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Auszahlung konnte nicht gespeichert werden.');
        }

        result.className = 'ok';
        result.textContent =
          'Auszahlung gespeichert.\n' +
          'Partner: ' + data.partnerRef + '\n' +
          'Betrag: ' + Number(data.amount).toFixed(2) + ' €\n' +
          'Datum: ' + data.payoutDate + '\n' +
          'ID: ' + data.payoutId;
      } catch (error) {
        result.className = 'error';
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
