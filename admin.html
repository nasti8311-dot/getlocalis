<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiiViu – Admin</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:32px auto;padding:0 20px;color:#222;background:#fafafa}
    h1{margin-bottom:6px}.hint{color:#666;margin-bottom:24px}
    section{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;margin:18px 0}
    label{display:block;margin:14px 0 6px;font-weight:600}
    input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:#fff}
    button{margin-top:16px;padding:12px 16px;border:0;border-radius:8px;font-size:15px;cursor:pointer;background:#222;color:#fff}
    button.secondary{background:#eee;color:#222;margin-left:8px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .result{margin-top:16px;padding:12px;border-radius:8px;white-space:pre-wrap}.ok{background:#e9f7ee}.error{background:#fdecec}
    .partner{border-top:1px solid #eee;padding:20px 0;display:grid;grid-template-columns:1fr 150px;gap:20px;align-items:center}
    .partner:first-child{border-top:0}.meta{color:#666;font-size:14px;line-height:1.6}
    .code{font-family:monospace;font-size:18px;font-weight:700}.qr{width:150px;height:150px;object-fit:contain;border:1px solid #eee;border-radius:8px;background:#fff}
    a{color:inherit}.link{font-size:13px;word-break:break-all;color:#555}
    @media(max-width:650px){.grid,.partner{grid-template-columns:1fr}.qr{width:180px;height:180px}.secondary{margin-left:0}}
  </style>
</head>
<body>
  <h1>FiiViu Admin</h1>
  <div class="hint">Partner anlegen, individuelle Links erzeugen und QR-Codes verwalten.</div>

  <section>
    <h2>Admin-Zugang</h2>
    <label for="token">Admin-Schlüssel</label>
    <input id="token" type="password" autocomplete="off" placeholder="Cloudflare Admin-Schlüssel">
    <div class="hint" style="margin-top:8px;margin-bottom:0">Der Schlüssel wird nicht gespeichert.</div>
  </section>

  <section>
    <h2>Neuen Partner anlegen</h2>
    <div class="grid">
      <div>
        <label for="name">Hotel / Apartment</label>
        <input id="name" placeholder="z. B. Hotel Bucharest Central">
      </div>
      <div>
        <label for="type">Typ</label>
        <select id="type"><option>Hotel</option><option>Apartment</option><option>Hostel</option><option>Sonstiges</option></select>
      </div>
      <div>
        <label for="contactName">Kontaktperson (optional)</label>
        <input id="contactName" placeholder="Name">
      </div>
      <div>
        <label for="contactEmail">E-Mail (optional)</label>
        <input id="contactEmail" type="email" placeholder="partner@example.com">
      </div>
      <div>
        <label for="partnerRef">Partner-Code (optional)</label>
        <input id="partnerRef" placeholder="Leer lassen = automatisch">
      </div>
    </div>
    <button id="create">Partner anlegen</button>
    <div id="createResult"></div>
  </section>

  <section>
    <h2>Partner & QR-Codes</h2>
    <button id="reload" class="secondary">Liste aktualisieren</button>
    <div id="partners" style="margin-top:12px">Noch keine Liste geladen.</div>
  </section>

  <section>
    <h2>Auszahlung erfassen</h2>
    <div class="grid">
      <div><label for="payoutRef">Partner-Code</label><input id="payoutRef" placeholder="z. B. HOTEL001"></div>
      <div><label for="amount">Auszahlungsbetrag (€)</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="z. B. 1.74"></div>
      <div><label for="date">Auszahlungsdatum</label><input id="date" type="date"></div>
      <div><label for="reference">Referenz (optional)</label><input id="reference" placeholder="z. B. Überweisung 15.10.2026"></div>
    </div>
    <button id="payout">Auszahlung speichern</button>
    <div id="payoutResult"></div>
  </section>

<script>
const WORKER = 'https://getlocalis.nasti8311.workers.dev';
const PUBLIC_SITE = 'https://getlocalis.pages.dev';
const tokenInput = document.getElementById('token');
document.getElementById('date').value = new Date().toISOString().slice(0,10);

function headers(){
  return {'Content-Type':'application/json','Authorization':'Bearer '+tokenInput.value.trim()};
}
function show(id, text, ok=false){
  const el=document.getElementById(id); el.className='result '+(ok?'ok':'error'); el.textContent=text;
}

async function loadPartners(){
  const box=document.getElementById('partners');
  box.textContent='Lade...';
  try{
    const r=await fetch(WORKER+'/api/admin/partners',{headers:headers()});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Partner konnten nicht geladen werden.');
    if(!data.partners.length){box.textContent='Noch keine Partner angelegt.';return;}
    box.innerHTML=data.partners.map(p=>{
      const link=PUBLIC_SITE+'/?ref='+encodeURIComponent(p.partner_ref);
      const qr='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(link);
      return `<div class="partner">
        <div><div class="code">${escapeHtml(p.partner_ref)}</div><h3 style="margin:6px 0">${escapeHtml(p.name)}</h3>
        <div class="meta">${escapeHtml(p.type)}${p.contact_name?' · '+escapeHtml(p.contact_name):''}${p.contact_email?' · '+escapeHtml(p.contact_email):''}</div>
        <div class="link">${escapeHtml(link)}</div>
        <button onclick="openQr('${qr.replace(/'/g,"\\'")}')">QR-Code öffnen</button>
        <button class="secondary" onclick="printQr('${qr.replace(/'/g,"\\'")}','${escapeJs(p.name)}','${escapeJs(p.partner_ref)}')">Druckansicht</button></div>
        <img class="qr" src="${qr}" alt="QR-Code für ${escapeHtml(p.name)}">
      </div>`;
    }).join('');
  }catch(e){box.innerHTML='<div class="result error">'+escapeHtml(e.message)+'</div>';}
}

function openQr(url){window.open(url,'_blank','noopener');}
function printQr(url,name,ref){
  const w=window.open('','_blank');
  w.document.write('<!doctype html><html lang="de"><head><title>FiiViu QR-Code</title><style>body{font-family:Arial;text-align:center;padding:40px}img{width:420px;max-width:90%}</style></head><body><h1>FiiViu</h1><h2>'+escapeHtml(name)+'</h2><p>Erlebnisse in Bukarest entdecken</p><img src="'+url+'"><p>Partner-Code: '+escapeHtml(ref)+'</p><script>window.onload=()=>window.print()<\/script></body></html>');
  w.document.close();
}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function escapeJs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

document.getElementById('create').onclick=async()=>{
  const body={name:document.getElementById('name').value.trim(),type:document.getElementById('type').value,contactName:document.getElementById('contactName').value.trim(),contactEmail:document.getElementById('contactEmail').value.trim(),partnerRef:document.getElementById('partnerRef').value.trim()};
  if(!body.name){show('createResult','Bitte einen Hotel-/Apartment-Namen eingeben.');return;}
  try{
    const r=await fetch(WORKER+'/api/admin/partners',{method:'POST',headers:headers(),body:JSON.stringify(body)});
    const data=await r.json(); if(!r.ok) throw new Error(data.error||'Partner konnte nicht angelegt werden.');
    show('createResult','Partner angelegt.\nCode: '+data.partner.partnerRef+'\nLink: '+data.partner.link,true);
    document.getElementById('name').value='';document.getElementById('partnerRef').value='';document.getElementById('contactName').value='';document.getElementById('contactEmail').value='';
    loadPartners();
  }catch(e){show('createResult',e.message);}
};

document.getElementById('reload').onclick=loadPartners;

document.getElementById('payout').onclick=async()=>{
  const result=document.getElementById('payoutResult');result.className='result';result.textContent='Speichere...';
  const amount=Number(document.getElementById('amount').value);
  const body={partnerRef:document.getElementById('payoutRef').value.trim(),amountCents:Math.round(amount*100),payoutDate:document.getElementById('date').value,reference:document.getElementById('reference').value.trim()};
  if(!body.partnerRef||!Number.isFinite(amount)||amount<=0||!body.payoutDate){show('payoutResult','Bitte alle Pflichtfelder korrekt ausfüllen.');return;}
  try{const r=await fetch(WORKER+'/api/admin/partner-payout',{method:'POST',headers:headers(),body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Auszahlung konnte nicht gespeichert werden.');show('payoutResult','Auszahlung gespeichert.\nPartner: '+data.partnerRef+'\nBetrag: '+Number(data.amount).toFixed(2)+' €\nDatum: '+data.payoutDate+'\nID: '+data.payoutId,true);}catch(e){show('payoutResult',e.message);}
};
</script>
</body>
</html>
