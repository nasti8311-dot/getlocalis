<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>FiiViu – Booking</title><style>body{font-family:Arial,sans-serif;background:#fafafa;color:#222;max-width:820px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;margin:16px 0}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#777;margin-top:16px}.value{font-weight:700;margin-top:4px}.map{display:inline-block;margin-top:14px;padding:10px 14px;border-radius:8px;background:#222;color:#fff;text-decoration:none}.ok{color:#278a4b;font-weight:700}.error{color:#b42318}.muted{color:#666}.notice{background:#f6f6f6;border-radius:10px;padding:12px;margin-top:18px}</style></head><body><div id="app" class="card">Loading booking…</div><script>
const params=new URLSearchParams(location.search),id=params.get('id'),token=params.get('token'),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function maps(b){if(b.meeting_latitude&&b.meeting_longitude)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b.meeting_latitude+','+b.meeting_longitude);const q=[b.meeting_point_name,b.meeting_address,b.meeting_city,b.meeting_country].filter(Boolean).join(', ');return q?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q):'';}
const texts={de:{title:'Buchung bestätigt',number:'Buchungsnummer',date:'Datum & Uhrzeit',guests:'Teilnehmer',meeting:'Treffpunkt',instructions:'Hinweise',arrival:'Ankunft',status:'Status',maps:'Auf Google Maps öffnen',early:'Bitte %s Minuten vor Beginn da sein.',missingId:'Buchungsnummer fehlt.',missingToken:'Sicherer Buchungszugang fehlt.',missing:'Dieser persönliche Buchungslink ist nicht vollständig.',denied:'Der Buchungslink ist ungültig oder nicht mehr gültig.',notfound:'Buchung nicht gefunden.',generic:'Buchung konnte nicht geladen werden.'},en:{title:'Booking confirmed',number:'Booking number',date:'Date & time',guests:'Guests',meeting:'Meeting point',instructions:'Instructions',arrival:'Arrival',status:'Status',maps:'Open in Google Maps',early:'Please arrive %s minutes before the start.',missingId:'Booking number is missing.',missingToken:'Secure booking access token is missing.',missing:'This personal booking link is incomplete.',denied:'This booking link is invalid or no longer valid.',notfound:'Booking not found.',generic:'Booking could not be loaded.'},ro:{title:'Rezervare confirmată',number:'Numărul rezervării',date:'Data și ora',guests:'Participanți',meeting:'Punct de întâlnire',instructions:'Instrucțiuni',arrival:'Sosire',status:'Status',maps:'Deschide în Google Maps',early:'Te rugăm să ajungi cu %s minute înainte de începere.',missingId:'Lipsește numărul rezervării.',missingToken:'Lipsește tokenul securizat de acces la rezervare.',missing:'Linkul personal al rezervării este incomplet.',denied:'Linkul rezervării este invalid sau nu mai este valabil.',notfound:'Rezervarea nu a fost găsită.',generic:'Rezervarea nu a putut fi încărcată.'}};
function t(lang){return texts[lang]||texts.en}function detectLang(){const raw=(navigator.language||'en').slice(0,2);return texts[raw]?raw:'en'}
async function load(){const initialLang=detectLang(),initial=t(initialLang);if(!id||!token){app.innerHTML='<div class="error">'+esc(!id?initial.missingId:initial.missingToken)+'</div>';return}try{const r=await fetch('/api/booking?id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token),{credentials:'omit'}),d=await r.json();if(!r.ok){const lang=String(d?.booking?.customer_language||initialLang).slice(0,2),l=t(lang);throw Error(r.status===403?l.denied:(r.status===404?l.notfound:(d.error||l.generic)))}const b=d.booking||d,lang=String(b.customer_language||initialLang).slice(0,2),l=t(lang);document.documentElement.lang=lang;document.title='FiiViu – '+l.title;const address=[b.meeting_address,b.meeting_city,b.meeting_country].filter(Boolean).join(', '),map=maps(b),arrival=b.arrival_minutes_before!=null?l.early.replace('%s',esc(b.arrival_minutes_before)):'';app.innerHTML='<div class="ok">✓ '+l.title+'</div><h1>'+esc(b.experience_name)+'</h1><div class="label">'+l.number+'</div><div class="value">'+esc(b.booking_id)+'</div><div class="label">'+l.date+'</div><div class="value">'+esc(b.booking_date||'')+(b.booking_time?' · '+esc(b.booking_time):'')+'</div><div class="label">'+l.guests+'</div><div class="value">'+esc(b.guests)+'</div><div class="label">'+l.meeting+'</div><div class="value">'+esc(b.meeting_point_name||address||'')+'</div>'+(address?'<div class="muted">'+esc(address)+'</div>':'')+(b.meeting_instructions?'<div class="label">'+l.instructions+'</div><div>'+esc(b.meeting_instructions)+'</div>':'')+(arrival?'<div class="label">'+l.arrival+'</div><div>'+arrival+'</div>':'')+(map?'<a class="map" target="_blank" rel="noopener noreferrer" href="'+map+'">'+l.maps+'</a>':'')+'<div class="label">'+l.status+'</div><div class="value">'+esc(b.status)+'</div><div class="notice muted">Keep this booking link private. It provides access to your booking details.</div>'}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}load();
</script></body></html>
