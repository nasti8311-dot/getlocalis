<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiiViu – Booking</title><style>body{font-family:Arial,sans-serif;background:#fafafa;color:#222;max-width:820px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;margin:16px 0}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#777;margin-top:16px}.value{font-weight:700;margin-top:4px}.map{display:inline-block;margin-top:14px;padding:10px 14px;border-radius:8px;background:#222;color:#fff;text-decoration:none}.ok{color:#278a4b;font-weight:700}.error{color:#b42318}</style></head><body><div id="app" class="card">Loading booking…</div><script>
const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function maps(b){if(b.meeting_latitude&&b.meeting_longitude)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b.meeting_latitude+','+b.meeting_longitude);const q=[b.meeting_point_name,b.meeting_address,b.meeting_city,b.meeting_country].filter(Boolean).join(', ');return q?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q):'';}
async function load(){if(!id){app.innerHTML='<div class="error">Missing booking number.</div>';return}try{const r=await fetch('/api/booking?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Booking not found');const b=d.booking||d;const address=[b.meeting_address,b.meeting_city,b.meeting_country].filter(Boolean).join(', ');const map=maps(b);app.innerHTML='<div class="ok">✓ Booking confirmed</div><h1>'+esc(b.experience_name)+'</h1><div class="label">Booking number</div><div class="value">'+esc(b.booking_id)+'</div><div class="label">Date & time</div><div class="value">'+esc(b.booking_date||'')+(b.booking_time?' · '+esc(b.booking_time):'')+'</div><div class="label">Guests</div><div class="value">'+esc(b.guests)+'</div><div class="label">Meeting point</div><div class="value">'+esc(b.meeting_point_name||'')+'</div><div>'+esc(address)+'</div>'+(b.meeting_instructions?'<div class="label">Instructions</div><div>'+esc(b.meeting_instructions)+'</div>':'')+(b.arrival_minutes_before!=null?'<div class="label">Arrival</div><div>Please arrive '+esc(b.arrival_minutes_before)+' minutes before the start.</div>':'')+(map?'<a class="map" target="_blank" rel="noopener" href="'+map+'">Open in Google Maps</a>':'')+'<div class="label">Status</div><div class="value">'+esc(b.status)+'</div>';}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}load();
</script></body></html>
