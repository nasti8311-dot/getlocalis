<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiiViu – Bedingungen für Anbieter</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:950px;margin:0 auto;padding:32px 20px;line-height:1.65;color:#171717;background:#F8F6F1}main{background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 45px rgba(21,21,21,.08)}h1,h2{line-height:1.2}h2{margin-top:30px}a{color:#c9581d}.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:24px}.lang button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:700}.lang button.active{background:#151515;color:#fff}.back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:700}.notice{padding:14px 16px;background:#f5efe8;border-radius:12px}</style></head><body><div class="lang"><button data-lang="de" onclick="setLanguage('de')">DE</button><button data-lang="en" onclick="setLanguage('en')">EN</button><button data-lang="ro" onclick="setLanguage('ro')">RO</button></div><main id="content"></main><p style="max-width:950px;margin:14px auto;padding:12px 16px;border:1px solid #d8b98d;border-radius:12px;background:#fff8e8;color:#6d4815;font-size:14px"><strong>Entwurfsstand v1.1:</strong> Diese Bedingungen sind ein Arbeitsentwurf und müssen vor öffentlicher Freischaltung rechtlich geprüft und mit den vollständigen Unternehmensangaben ergänzt werden.</p><script>
const c={
de:{title:"Bedingungen für Erlebnisanbieter",back:"← Zurück zu FiiViu",intro:"Diese Bedingungen regeln das Verhältnis zwischen FiiViu als Betreiber einer Online-Vermittlungsplattform und gewerblichen Anbietern, die Erlebnisse oder Dienstleistungen über FiiViu anbieten.",notice:"Anbieter müssen Unternehmerangaben, Kontaktdaten, Leistungsinformationen und gegebenenfalls Identitäts-/Registerdaten vollständig und wahrheitsgemäß bereitstellen. Die Freischaltung setzt die erforderliche Prüfung voraus.",s:[
["1. Gegenstand","FiiViu vermittelt Kunden an Anbieter und stellt Buchungs-, Zahlungs- und Kommunikationsfunktionen bereit. Der Dienstleistungsvertrag kommt direkt zwischen Kunde und Anbieter zustande. Im 20/80-Modell zahlt der Kunde 20 % des Gesamtpreises online an FiiViu; die verbleibenden 80 % zahlt er direkt vor Ort an den Anbieter. Der Anbieter bleibt für die rechtmäßige, sichere und vertragsgemäße Durchführung seiner Leistung verantwortlich."],
["2. Anbieterangaben und Nachverfolgbarkeit","Der Anbieter stellt Name, Anschrift, Telefon, E-Mail, Registerdaten, Zahlungsinformationen und weitere gesetzlich erforderliche Nachweise bereit. FiiViu kann Angebote erst freischalten, wenn die erforderlichen Angaben vorliegen."],
["3. Angebotsqualität und Rechtmäßigkeit","Der Anbieter darf nur Leistungen anbieten, deren Durchführung rechtmäßig ist und für die er alle erforderlichen Genehmigungen, Versicherungen und Qualifikationen besitzt. Angaben zu Preis, Verfügbarkeit, Treffpunkt, Teilnahmebedingungen, Sicherheit und Stornierung müssen aktuell und zutreffend sein."],
["4. Provision und Zahlungen","Im 20/80-Modell wird die Online-Anzahlung von 20 % über Stripe direkt an FiiViu gezahlt und deckt die vereinbarte Vermittlungsprovision vollständig ab. Der Anbieter zieht die verbleibenden 80 % direkt vor Ort ein, bar und/oder per Kartenterminal entsprechend den im Angebot angegebenen Zahlungsarten. Für andere, ausdrücklich vereinbarte Programme können abweichende Provisions- und Zahlungsbedingungen gelten. Prüf- und gesetzliche Pflichten bleiben unberührt."],
["5. Ranking und Sichtbarkeit","Die Platzierung von Angeboten kann insbesondere von Kategorie, Verfügbarkeit, Relevanz zur Suchanfrage, Aktualität, Preis, Nachfrage, Qualität und technischer Vollständigkeit der Angebotsdaten abhängen. FiiViu kann zusätzliche kommerzielle Hervorhebungen anbieten, die als solche kenntlich gemacht werden. Eine bestimmte Platzierung wird nicht garantiert."],
["6. Änderungen, Sperrung und Kündigung","FiiViu kann Angebote vorübergehend sperren oder entfernen, wenn gesetzliche Pflichten, Sicherheitsrisiken, fehlende Nachweise, erhebliche Vertragsverletzungen oder unrichtige Angaben dies erfordern. Soweit gesetzlich erforderlich, werden die Gründe auf einem dauerhaften Datenträger mitgeteilt. Ordentliche Beendigungen erfolgen nach den vereinbarten Fristen; zwingende gesetzliche Rechte bleiben unberührt."],
["7. Beschwerden von Anbietern","Anbieter können Beschwerden zu technischen Problemen, Maßnahmen oder der Anwendung dieser Bedingungen kostenlos an <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a> richten. FiiViu prüft Beschwerden zeitnah und teilt das Ergebnis individuell und verständlich mit. Soweit FiiViu als kleines Unternehmen im Sinne der EU-Verordnung 2019/1150 qualifiziert, gelten die gesetzlichen Ausnahmen für bestimmte P2B-Pflichten; der Status wird intern überprüft."],
["8. Datenschutz","Personenbezogene Daten von Anbietern werden nach der einschlägigen Datenschutzerklärung und den gesetzlichen Vorgaben verarbeitet. Anbieter müssen selbst sicherstellen, dass sie personenbezogene Daten ihrer Kunden nur im zulässigen Umfang verwenden."],
["9. Geistiges Eigentum und Inhalte","Der Anbieter gewährleistet, dass Bilder, Texte, Marken und sonstige Inhalte, die er FiiViu zur Veröffentlichung überlässt, frei von Rechten Dritter sind oder rechtmäßig genutzt werden dürfen. FiiViu erhält für die Plattformdarstellung ein einfaches, für die Vertragslaufzeit erforderliches Nutzungsrecht."],
["10. Haftung und Freistellung","Der Anbieter haftet für seine Leistung und für von ihm bereitgestellte rechtswidrige oder unrichtige Inhalte nach den gesetzlichen Vorschriften. Eine Freistellung von FiiViu kann nur verlangt werden, soweit dies gesetzlich zulässig und durch einen vom Anbieter zu vertretenden Verstoß verursacht ist."],
["11. Änderungen der Bedingungen","Änderungen werden mit angemessener Vorankündigung mitgeteilt, soweit gesetzlich erforderlich. Wesentliche Änderungen werden nicht rückwirkend auf bereits geschlossene Buchungen angewandt, sofern dies nicht gesetzlich zulässig ist."],
["12. Anwendbares Recht","Es gilt rumänisches Recht unter Beachtung zwingender EU- und Verbraucherschutzvorschriften. Zuständigkeiten richten sich nach den anwendbaren gesetzlichen Regeln."],
["13. Unternehmensangaben","FiiViu S.R.L. veröffentlicht seine vollständigen Unternehmensdaten vor dem öffentlichen Launch auf der Seite „Impressum“." ]],updated:"Stand: 29. Oktober 2026 – Vertragsfassung v1.1."},
["14. Buchungen, Durchführung und Ausfälle","Der Anbieter hält bestätigte Buchungen, angezeigte Preise und die vor der Buchung beschriebenen Leistungen ein. Er informiert FiiViu unverzüglich, wenn er eine Buchung nicht durchführen kann, sich Treffpunkt oder wesentliche Leistungsmerkmale ändern oder ein Sicherheitsrisiko besteht. Bei Absage durch den Anbieter unterstützt er die Rückabwicklung; online an FiiViu gezahlte Beträge werden nach den Kundenbedingungen und zwingendem Recht erstattet."],
["15. Zahlung vor Ort und Belege","Der Anbieter muss die je Angebot ausgewählten Zahlungsarten Bar und/oder Karte tatsächlich akzeptieren. Bei Kartenzahlung stellt er selbst ein geeignetes Terminal bzw. einen Zahlungsdienst bereit. Er ist für ordnungsgemäße Rechnungen/Quittungen, Kassenführung, Steuern und sonstige Pflichten bei Zahlungen vor Ort verantwortlich. FiiViu zieht den verbleibenden Betrag von 80 % nicht ein."],
["16. Provision, Rückerstattungen und Abrechnung","Sofern nicht schriftlich ausdrücklich anders vereinbart, ist die online an FiiViu gezahlte Anzahlung von 20 % die vollständige Vermittlungsprovision für eine Buchung; auf den vor Ort gezahlten Restbetrag fällt keine zusätzliche FiiViu-Provision an. Die Behandlung der Onlinezahlung bei Kundenstornierung oder Anbieterabsage richtet sich nach den bei der Buchung angezeigten Kundenbedingungen und zwingendem Recht. Der Anbieter darf keine abweichenden Rückerstattungsversprechen im Namen von FiiViu abgeben und meldet Zahlungsbeschwerden, Rückbuchungen oder Betrugsverdacht unverzüglich."],
["17. Versicherung, Sicherheit und Vorfälle","Der Anbieter erfüllt alle für seine Tätigkeit geltenden Zulassungs-, Qualifikations-, Sicherheits- und Versicherungspflichten. Er informiert Teilnehmer vorab über wesentliche Risiken und Teilnahmevoraussetzungen und führt erforderliche Schutzmaßnahmen durch. Unfälle, erhebliche Beschwerden oder sonstige sicherheitsrelevante Vorfälle meldet er FiiViu unverzüglich, ohne Notfall- oder gesetzliche Meldepflichten zu verzögern."],
["18. Dauer, Kündigung und Folgen","Der Vertrag gilt ab Registrierung und Annahme. Jede Partei kann die Zusammenarbeit mit angemessener Frist beenden; bereits bestätigte Buchungen, laufende Rückerstattungen, gesetzliche Aufbewahrungspflichten und Ansprüche aus früheren Vorgängen bleiben davon unberührt. FiiViu kann Angebote oder Konten vorübergehend einschränken, wenn dies zum Schutz von Kunden, zur Untersuchung konkreter Risiken oder zur Erfüllung gesetzlicher Pflichten erforderlich ist."],
["19. Änderungen und Mitteilungen","FiiViu teilt wesentliche Änderungen dieser Bedingungen auf einem geeigneten dauerhaften Datenträger oder per E-Mail mit, soweit gesetzlich erforderlich. Änderungen gelten nicht rückwirkend für bereits bestätigte Buchungen, soweit dies nicht gesetzlich zulässig ist. Der Anbieter hält seine Kontaktangaben aktuell und prüft Mitteilungen an die hinterlegte geschäftliche E-Mail-Adresse."],
["20. Vertragsfassung und Nachweis","Die bei der Registrierung akzeptierte Fassung wird mit Versionsnummer, Zeitstempel und Prüfsumme dokumentiert. Der Anbieter erhält eine Kopie per E-Mail. Für spätere Änderungen kann eine erneute ausdrückliche Zustimmung erforderlich sein; das richtet sich nach Art und rechtlicher Wirkung der Änderung."]
en:{title:"Terms for Experience Providers",back:"← Back to FiiViu",intro:"These terms govern the relationship between FiiViu as an online intermediation platform and business providers offering experiences or services through FiiViu.",notice:"Providers must submit complete and accurate trader, contact, service and, where applicable, identity/register information. Listing is subject to the required checks.",s:[],updated:"As of: 29 October 2026 – Contract version v1.1."},
ro:{title:"Condiții pentru furnizorii de experiențe",back:"← Înapoi la FiiViu",intro:"Aceste condiții reglementează relația dintre FiiViu, ca platformă online de intermediere, și furnizorii profesioniști care oferă experiențe sau servicii prin FiiViu.",notice:"Furnizorii trebuie să transmită date complete și corecte despre comerciant, contact, servicii și, dacă este cazul, date de identificare/registru. Listarea este condiționată de verificările necesare.",s:[],updated:"Data: 29 octombrie 2026 – versiunea contractului v1.1."}};
c.en.s=[
["1. Subject","FiiViu connects customers with providers and supplies booking, payment and communication functions. The service contract is concluded directly between the customer and the provider. Under the 20/80 model, the customer pays 20% of the total price online to FiiViu; the remaining 80% is paid directly to the provider in person. The provider remains responsible for lawful, safe and contract-compliant performance."],
["2. Provider identity and traceability","Providers must submit name, address, phone, email, register details, payment information and other legally required evidence. FiiViu may withhold listing until required information is available."],
["3. Quality and legality","Providers may only offer lawful services for which they hold required permits, insurance and qualifications. Price, availability, meeting point, participation, safety and cancellation information must be accurate and current."],
["4. Commission and payments","Under the 20/80 model, the 20% online deposit is paid via Stripe directly to FiiViu and fully covers the agreed intermediation commission. The provider collects the remaining 80% directly in person, in cash and/or by card terminal according to the payment methods listed in the offer. Different commission and payment terms may apply only to other expressly agreed programmes. Verification and legal requirements remain applicable."],
["5. Ranking and visibility","Listing position may depend on category, availability, search relevance, freshness, price, demand, quality and technical completeness. Additional paid prominence, if offered, will be identified as commercial. No position is guaranteed."],
["6. Suspension and termination","FiiViu may suspend or remove listings where required by law, security concerns, missing evidence, material breaches or inaccurate information. Reasons will be provided on a durable medium where legally required. Ordinary termination follows agreed notice periods, subject to mandatory rights."],
["7. Provider complaints","Providers may submit free complaints about technical issues, measures or these terms to <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. FiiViu will process complaints within a reasonable time and communicate the outcome individually and clearly. If FiiViu qualifies as a small enterprise under Regulation (EU) 2019/1150, the statutory exemptions for certain P2B obligations apply; this status is checked internally."],
["8. Data protection","Provider personal data is processed under the applicable privacy policy and law. Providers must ensure that they use customer personal data only as lawfully permitted."],
["9. Intellectual property","Providers warrant that images, texts, trademarks and other content supplied to FiiViu are lawfully usable and do not infringe third-party rights. FiiViu receives a non-exclusive platform-use licence for the duration and purposes of the relationship."],
["10. Liability","Providers are liable under law for their services and unlawful or inaccurate content they provide. Any indemnification of FiiViu applies only to the extent lawful and where caused by a provider-attributable breach."],
["11. Changes","Changes are communicated with reasonable notice where legally required. Material changes do not apply retroactively to concluded bookings unless legally permitted."],
["12. Governing law","Romanian law applies subject to mandatory EU and consumer-protection rules. Jurisdiction follows applicable mandatory law."],
["13. Company information","FiiViu S.R.L. will publish its complete company information before public launch on the Legal Notice page."]];
["14. Bookings, performance and disruption","The provider must honour confirmed bookings, displayed prices and the service described before booking. It must promptly notify FiiViu if it cannot perform a booking, if the meeting point or a material service feature changes, or if a safety risk arises. If the provider cancels, it cooperates with reversal; amounts paid online to FiiViu are refunded under the customer terms and mandatory law."],
["15. On-site payment and receipts","For each listing, the provider must accurately select cash, card or both and actually accept every selected method. For card payments, the provider supplies its own suitable terminal or payment service. The provider is responsible for lawful invoices/receipts, cash records, taxes and other obligations relating to on-site payments. FiiViu does not collect the remaining 80%."],
["16. Commission, refunds and reconciliation","Unless expressly agreed otherwise in writing, the 20% online payment to FiiViu is the full intermediation commission for a booking; no additional FiiViu commission applies to the balance paid in person. Treatment of the online payment in case of customer cancellation or provider cancellation follows the customer terms shown at booking and mandatory law. The provider may not make conflicting refund promises on behalf of FiiViu and must promptly report chargebacks, suspected fraud and payment complaints."],
["17. Insurance, safety and incidents","The provider must meet all permits, qualification, safety and insurance requirements applicable to its activity. It must inform participants in advance of material risks and participation requirements and implement necessary protective measures. Accidents, serious complaints or other safety incidents related to a FiiViu booking must be reported promptly to FiiViu, without delaying emergency response or legally required reporting."],
["18. Term, termination and effects","The agreement starts upon registration and acceptance. Either party may end the relationship on reasonable notice; confirmed bookings, pending refunds, statutory retention duties and claims arising from earlier events remain unaffected. FiiViu may temporarily restrict listings or accounts where necessary to protect customers, investigate concrete risks or meet legal obligations."],
["19. Changes and notices","FiiViu will notify providers of material changes by an appropriate durable medium or email where required by law. Changes do not apply retroactively to confirmed bookings unless legally permitted. Providers must keep contact details current and monitor the business email address on file."],
["20. Contract version and evidence","The version accepted at registration is recorded with a version number, timestamp and checksum. A copy is sent to the provider by email. Later changes may require renewed express acceptance depending on their nature and legal effect."]
c.ro.s=[
["1. Obiect","FiiViu conectează clienții cu furnizorii și pune la dispoziție funcții de rezervare, plată și comunicare. Contractul de prestare a serviciului se încheie direct între client și furnizor. În modelul 20/80, clientul plătește online către FiiViu 20% din prețul total; restul de 80% se plătește direct furnizorului, la fața locului. Furnizorul rămâne responsabil pentru executarea legală, sigură și conformă cu contractul."],
["2. Identificarea și trasabilitatea furnizorului","Furnizorii trebuie să transmită numele, adresa, telefonul, e-mailul, datele registrului, informațiile de plată și celelalte dovezi cerute de lege. FiiViu poate refuza listarea până la primirea datelor obligatorii."],
["3. Calitate și legalitate","Furnizorii pot oferi numai servicii legale pentru care dețin autorizațiile, asigurările și calificările necesare. Informațiile privind prețul, disponibilitatea, locul întâlnirii, participarea, siguranța și anularea trebuie să fie corecte și actuale."],
["4. Comision și plăți","În modelul 20/80, avansul online de 20% este plătit prin Stripe direct către FiiViu și acoperă integral comisionul de intermediere convenit. Furnizorul încasează restul de 80% direct la fața locului, în numerar și/sau prin terminal de card, conform metodelor indicate în ofertă. Alte condiții de comision și plată se pot aplica numai programelor diferite convenite în mod expres. Se aplică în continuare obligațiile legale și de verificare."],
["5. Ordonare și vizibilitate","Poziția ofertelor poate depinde de categorie, disponibilitate, relevanță pentru căutare, actualitate, preț, cerere, calitate și completitudinea tehnică a datelor. Evidențierile comerciale plătite, dacă există, vor fi marcate ca atare. Nu este garantată o anumită poziție."],
["6. Suspendare și încetare","FiiViu poate suspenda sau elimina oferte dacă legea, riscurile de securitate, lipsa documentelor, încălcările contractuale semnificative sau informațiile incorecte o impun. Motivele vor fi comunicate pe un suport durabil atunci când legea o cere. Încetarea obișnuită respectă termenele convenite și drepturile imperative."],
["7. Reclamații ale furnizorilor","Furnizorii pot depune gratuit reclamații privind probleme tehnice, măsuri sau acești termeni la <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. FiiViu va analiza reclamațiile într-un termen rezonabil și va comunica individual rezultatul. Dacă FiiViu se califică drept întreprindere mică în sensul Regulamentului (UE) 2019/1150, se aplică excepțiile legale pentru anumite obligații P2B; acest statut este verificat intern."],
["8. Protecția datelor","Datele personale ale furnizorilor sunt prelucrate conform politicii de confidențialitate și legislației aplicabile. Furnizorii trebuie să utilizeze datele personale ale clienților numai în limitele permise de lege."],
["9. Proprietate intelectuală","Furnizorii garantează că imaginile, textele, mărcile și celelalte materiale furnizate FiiViu pot fi utilizate legal și nu încalcă drepturile terților. FiiViu primește un drept neexclusiv de utilizare pentru platformă pe durata și în scopul relației."],
["10. Răspundere","Furnizorii răspund potrivit legii pentru serviciile și conținutul ilegal sau inexact furnizat. Orice despăgubire către FiiViu se aplică numai în măsura permisă de lege și dacă prejudiciul rezultă dintr-o încălcare imputabilă furnizorului."],
["11. Modificări","Modificările sunt comunicate cu un termen rezonabil atunci când legea o cere. Modificările importante nu se aplică retroactiv rezervărilor încheiate, cu excepția cazurilor permise de lege."],
["12. Legea aplicabilă","Se aplică dreptul român, cu respectarea normelor imperative ale UE și a protecției consumatorilor. Competența se stabilește potrivit normelor imperative aplicabile."],
["13. Datele societății","FiiViu S.R.L. va publica datele complete ale societății înainte de lansarea publică pe pagina de informații juridice."]];
["14. Rezervări, executare și întreruperi","Furnizorul respectă rezervările confirmate, prețurile afișate și serviciul descris înainte de rezervare. Acesta informează prompt FiiViu dacă nu poate executa o rezervare, dacă se schimbă locul întâlnirii ori un element esențial al serviciului sau dacă apare un risc de siguranță. În caz de anulare de către furnizor, acesta cooperează la remediere; sumele plătite online către FiiViu se rambursează conform termenilor pentru clienți și legii imperative."],
["15. Plăți la fața locului și documente","Pentru fiecare ofertă, furnizorul selectează corect numerar, card sau ambele și trebuie să accepte efectiv fiecare metodă selectată. Pentru plățile cu cardul, furnizorul asigură propriul terminal sau serviciu de plată adecvat. Furnizorul răspunde pentru facturi/bonuri legale, evidența numerarului, taxe și celelalte obligații privind plățile la fața locului. FiiViu nu încasează restul de 80%."],
["16. Comision, rambursări și reconciliere","Dacă nu s-a convenit expres altfel în scris, plata online de 20% către FiiViu reprezintă comisionul integral de intermediere; nu se aplică un comision FiiViu suplimentar pentru restul plătit la fața locului. Tratamentul plății online în cazul anulării de către client sau furnizor urmează termenii pentru clienți afișați la rezervare și legea imperativă. Furnizorul nu poate face promisiuni de rambursare contrare acelor termeni și raportează prompt chargeback-urile, suspiciunile de fraudă și reclamațiile privind plățile."],
["17. Asigurare, siguranță și incidente","Furnizorul îndeplinește toate cerințele aplicabile privind autorizațiile, calificările, siguranța și asigurarea. Acesta informează participanții în avans despre riscurile importante și condițiile de participare și aplică măsurile de protecție necesare. Accidentele, reclamațiile grave sau alte incidente de siguranță legate de o rezervare FiiViu trebuie raportate prompt, fără a întârzia intervențiile de urgență sau raportările impuse de lege."],
["18. Durată, încetare și efecte","Acordul intră în vigoare la înregistrare și acceptare. Oricare parte poate înceta colaborarea cu un preaviz rezonabil; rezervările confirmate, rambursările în curs, obligațiile legale de păstrare și pretențiile anterioare rămân neafectate. FiiViu poate restricționa temporar ofertele sau conturile pentru protejarea clienților, investigarea riscurilor concrete ori respectarea obligațiilor legale."],
["19. Modificări și notificări","FiiViu notifică furnizorii despre modificările importante printr-un suport durabil adecvat sau prin e-mail atunci când legea o cere. Modificările nu se aplică retroactiv rezervărilor confirmate, cu excepția cazurilor permise de lege. Furnizorii mențin datele de contact actualizate."],
["20. Versiunea contractului și dovada","Versiunea acceptată la înregistrare este înregistrată cu număr de versiune, marcaj temporal și sumă de verificare. O copie este trimisă furnizorului prin e-mail. Modificările ulterioare pot necesita o nouă acceptare expresă, în funcție de natura și efectul lor juridic."]
function setLanguage(lang){const x=c[lang]||c.de;document.documentElement.lang=lang;document.title=x.title+" – FiiViu";document.getElementById("content").innerHTML="<a class='back' href='/provider.html'>"+x.back+"</a><h1>"+x.title+"</h1><p>"+x.intro+"</p><div class='notice'>"+x.notice+"</div>"+x.s.map(s=>"<h2>"+s[0]+"</h2><p>"+s[1]+"</p>").join("")+"<p><small>"+x.updated+"</small></p>";document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));}const p=new URLSearchParams(location.search);setLanguage(p.get("lang")||"de");</script></body></html>
