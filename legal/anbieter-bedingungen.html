de:{title:"Bedingungen für Erlebnisanbieter",back:"← Zurück zu FiiViu",intro:"Diese Bedingungen regeln das Verhältnis zwischen FiiViu als Betreiber einer Online-Vermittlungsplattform und gewerblichen Anbietern, die Erlebnisse oder Dienstleistungen über FiiViu anbieten.",notice:"Anbieter müssen Unternehmerangaben, Kontaktdaten, Leistungsinformationen und gegebenenfalls Identitäts-/Registerdaten vollständig und wahrheitsgemäß bereitstellen. Die Freischaltung setzt die erforderliche Prüfung voraus.",s:[
["1. Gegenstand","FiiViu vermittelt Kunden an Anbieter und stellt Buchungs-, Zahlungs- und Kommunikationsfunktionen bereit. Der Dienstleistungsvertrag kommt direkt zwischen Kunde und Anbieter zustande. Im 20/80-Modell zahlt der Kunde 20 % des Gesamtpreises online an FiiViu; die verbleibenden 80 % zahlt er direkt vor Ort an den Anbieter. Der Anbieter bleibt für die rechtmäßige, sichere und vertragsgemäße Durchführung seiner Leistung verantwortlich."],
["2. Anbieterangaben und Nachverfolgbarkeit","Der Anbieter stellt Name, Anschrift, Telefon, E-Mail, Registerdaten, Zahlungsinformationen und weitere gesetzlich erforderliche Nachweise bereit. FiiViu kann Angebote erst freischalten, wenn die erforderlichen Angaben vorliegen."],
["3. Angebotsqualität und Rechtmäßigkeit","Der Anbieter darf nur Leistungen anbieten, deren Durchführung rechtmäßig ist und für die er alle erforderlichen Genehmigungen, Versicherungen und Qualifikationen besitzt. Angaben zu Preis, Verfügbarkeit, Treffpunkt, Teilnahmebedingungen, Sicherheit und Stornierung müssen aktuell und zutreffend sein."],
["4. Provision und Zahlungen","Im aktuellen 20/80-Modell zahlt der Kunde 20 % des Gesamtpreises online über Stripe direkt an FiiViu. Dieser Betrag ist die vollständige Vermittlungsprovision von FiiViu; der Anbieter erhält die verbleibenden 80 % direkt vom Kunden vor Ort, bar und/oder per Karte, entsprechend den im Angebot aktivierten Zahlungsarten. FiiViu zieht die 80 % nicht ein und zahlt sie auch nicht an den Anbieter aus. Für Anbieter fallen im aktuellen Programm keine Registrierungs-, Einrichtungs-, Angebots-, Monats- oder Abonnementgebühren und keine zusätzliche separate Provision an. Die 20%-Provision entsteht mit einer bestätigten Buchung nach erfolgreicher Onlinezahlung. Bei Stornierungen gelten die Regeln in Abschnitt 16; insbesondere kann die Onlinegebühr bei einer Kundenstornierung innerhalb von 24 Stunden vor Beginn einbehalten werden."],
["5. Ranking und Sichtbarkeit","Die Platzierung von Angeboten kann insbesondere von Kategorie, Verfügbarkeit, Relevanz zur Suchanfrage, Aktualität, Preis, Nachfrage, Qualität und technischer Vollständigkeit der Angebotsdaten abhängen. FiiViu kann zusätzliche kommerzielle Hervorhebungen anbieten, die als solche kenntlich gemacht werden. Eine bestimmte Platzierung wird nicht garantiert."],
["6. Änderungen, Sperrung und Kündigung","FiiViu kann Angebote vorübergehend sperren oder entfernen, wenn gesetzliche Pflichten, Sicherheitsrisiken, fehlende Nachweise, erhebliche Vertragsverletzungen oder unrichtige Angaben dies erfordern. Soweit gesetzlich erforderlich, werden die Gründe auf einem dauerhaften Datenträger mitgeteilt. Ordentliche Beendigungen erfolgen nach den vereinbarten Fristen; zwingende gesetzliche Rechte bleiben unberührt."],
["7. Beschwerden von Anbietern","Anbieter können Beschwerden zu technischen Problemen, Maßnahmen oder der Anwendung dieser Bedingungen kostenlos an <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a> richten. FiiViu prüft Beschwerden zeitnah und teilt das Ergebnis individuell und verständlich mit. Soweit FiiViu als kleines Unternehmen im Sinne der EU-Verordnung 2019/1150 qualifiziert, gelten die gesetzlichen Ausnahmen für bestimmte P2B-Pflichten; der Status wird intern überprüft."],
["8. Datenschutz","Personenbezogene Daten von Anbietern werden nach der einschlägigen Datenschutzerklärung und den gesetzlichen Vorgaben verarbeitet. Anbieter müssen selbst sicherstellen, dass sie personenbezogene Daten ihrer Kunden nur im zulässigen Umfang verwenden."],
["9. Geistiges Eigentum und Inhalte","Der Anbieter gewährleistet, dass Bilder, Texte, Marken und sonstige Inhalte, die er FiiViu zur Veröffentlichung überlässt, frei von Rechten Dritter sind oder rechtmäßig genutzt werden dürfen. FiiViu erhält für die Plattformdarstellung ein einfaches, für die Vertragslaufzeit erforderliches Nutzungsrecht."],
["10. Haftung und Freistellung","Der Anbieter haftet für seine Leistung und für von ihm bereitgestellte rechtswidrige oder unrichtige Inhalte nach den gesetzlichen Vorschriften. Eine Freistellung von FiiViu kann nur verlangt werden, soweit dies gesetzlich zulässig und durch einen vom Anbieter zu vertretenden Verstoß verursacht ist."],
["11. Änderungen der Bedingungen","Änderungen werden mit angemessener Vorankündigung mitgeteilt, soweit gesetzlich erforderlich. Wesentliche Änderungen werden nicht rückwirkend auf bereits geschlossene Buchungen angewandt, sofern dies nicht gesetzlich zulässig ist."],
["12. Anwendbares Recht","Es gilt rumänisches Recht unter Beachtung zwingender EU- und Verbraucherschutzvorschriften. Zuständigkeiten richten sich nach den anwendbaren gesetzlichen Regeln."],
["13. Unternehmensangaben","Betreiber der Plattform FiiViu:<br>Vollständiger Firmenname: ____________________<br>CUI: ____________________<br>Handelsregisternummer: ____________________<br>Vollständige Geschäftsadresse: ____________________<br>USt-ID (falls vorhanden): ____________________<br>Diese Angaben werden anhand der offiziellen Unternehmensunterlagen ergänzt." ]],updated:"Stand: 7. November 2026."},
en:{title:"Terms for Experience Providers",back:"← Back to FiiViu",intro:"These terms govern the relationship between FiiViu as an online intermediation platform and business providers offering experiences or services through FiiViu.",notice:"Providers must submit complete and accurate trader, contact, service and, where applicable, identity/register information. Listing is subject to the required checks.",s:[],updated:"As of: 7 November 2026."},
ro:{title:"Condiții pentru furnizorii de experiențe",back:"← Înapoi la FiiViu",intro:"Aceste condiții reglementează relația dintre FiiViu, ca platformă online de intermediere, și furnizorii profesioniști care oferă experiențe sau servicii prin FiiViu.",notice:"Furnizorii trebuie să transmită date complete și corecte despre comerciant, contact, servicii și, dacă este cazul, date de identificare/registru. Listarea este condiționată de verificările necesare.",s:[],updated:"Data: 7 noiembrie 2026."}};
c.en.s=[
["1. Subject","FiiViu connects customers with providers and supplies booking, payment and communication functions. The service contract is concluded directly between the customer and the provider. Under the 20/80 model, the customer pays 20% of the total price online to FiiViu; the remaining 80% is paid directly to the provider in person. The provider remains responsible for lawful, safe and contract-compliant performance."],
["2. Provider identity and traceability","Providers must submit name, address, phone, email, register details, payment information and other legally required evidence. FiiViu may withhold listing until required information is available."],
["3. Quality and legality","Providers may only offer lawful services for which they hold required permits, insurance and qualifications. Price, availability, meeting point, participation, safety and cancellation information must be accurate and current."],
["4. Commission and payments","Under the current 20/80 model, the customer pays 20% of the total price online through Stripe directly to FiiViu. This amount is FiiViu's full intermediation commission; the provider collects the remaining 80% directly from the customer in person, in cash and/or by card, according to the payment methods enabled in the offer. FiiViu does not collect or pay out the 80% balance. The current provider programme has no registration, setup, listing, monthly or subscription fees and no additional separate provider commission. The 20% commission arises when a booking is confirmed after successful online payment. Cancellations are governed by section 16; in particular, the online fee may be retained for customer cancellations made less than 24 hours before the experience."],
["5. Ranking and visibility","Listing position may depend on category, availability, search relevance, freshness, price, demand, quality and technical completeness. Additional paid prominence, if offered, will be identified as commercial. No position is guaranteed."],
["6. Suspension and termination","FiiViu may suspend or remove listings where required by law, security concerns, missing evidence, material breaches or inaccurate information. Reasons will be provided on a durable medium where legally required. Ordinary termination follows agreed notice periods, subject to mandatory rights."],
["7. Provider complaints","Providers may submit free complaints about technical issues, measures or these terms to <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. FiiViu will process complaints within a reasonable time and communicate the outcome individually and clearly. If FiiViu qualifies as a small enterprise under Regulation (EU) 2019/1150, the statutory exemptions for certain P2B obligations apply; this status is checked internally."],
["8. Data protection","Provider personal data is processed under the applicable privacy policy and law. Providers must ensure that they use customer personal data only as lawfully permitted."],
["9. Intellectual property","Providers warrant that images, texts, trademarks and other content supplied to FiiViu are lawfully usable and do not infringe third-party rights. FiiViu receives a non-exclusive platform-use licence for the duration and purposes of the relationship."],
["10. Liability","Providers are liable under law for their services and unlawful or inaccurate content they provide. Any indemnification of FiiViu applies only to the extent lawful and where caused by a provider-attributable breach."],
["11. Changes","Changes are communicated with reasonable notice where legally required. Material changes do not apply retroactively to concluded bookings unless legally permitted."],
["12. Governing law","Romanian law applies subject to mandatory EU and consumer-protection rules. Jurisdiction follows applicable mandatory law."],
["13. Company information","FiiViu platform operator:<br>Full legal company name: ____________________<br>CUI: ____________________<br>Trade Register number: ____________________<br>Full registered business address: ____________________<br>VAT ID (if applicable): ____________________<br>These details will be completed from the official company documents."]];
c.ro.s=[
["1. Obiect","FiiViu conectează clienții cu furnizorii și pune la dispoziție funcții de rezervare, plată și comunicare. Contractul de prestare a serviciului se încheie direct între client și furnizor. În modelul 20/80, clientul plătește online către FiiViu 20% din prețul total; restul de 80% se plătește direct furnizorului, la fața locului. Furnizorul rămâne responsabil pentru executarea legală, sigură și conformă cu contractul."],
["2. Identificarea și trasabilitatea furnizorului","Furnizorii trebuie să transmită numele, adresa, telefonul, e-mailul, datele registrului, informațiile de plată și celelalte dovezi cerute de lege. FiiViu poate refuza listarea până la primirea datelor obligatorii."],
["3. Calitate și legalitate","Furnizorii pot oferi numai servicii legale pentru care dețin autorizațiile, asigurările și calificările necesare. Informațiile privind prețul, disponibilitatea, locul întâlnirii, participarea, siguranța și anularea trebuie să fie corecte și actuale."],
["4. Comision și plăți","În modelul actual 20/80, clientul plătește online către FiiViu, prin Stripe, 20% din prețul total. Această sumă reprezintă comisionul integral de intermediere al FiiViu; furnizorul încasează restul de 80% direct de la client, la fața locului, în numerar și/sau cu cardul, conform metodelor activate în ofertă. FiiViu nu încasează și nu virează furnizorului suma de 80%. În programul actual nu se percep taxe de înregistrare, configurare, listare, lunare sau abonament și niciun comision separat suplimentar de la furnizor. Comisionul de 20% se aplică unei rezervări confirmate după plata online reușită. Anulările sunt reglementate la secțiunea 16; în special, avansul online poate fi reținut dacă clientul anulează cu mai puțin de 24 de ore înainte de începerea experienței."],
["5. Ordonare și vizibilitate","Poziția ofertelor poate depinde de categorie, disponibilitate, relevanță pentru căutare, actualitate, preț, cerere, calitate și completitudinea tehnică a datelor. Evidențierile comerciale plătite, dacă există, vor fi marcate ca atare. Nu este garantată o anumită poziție."],
["6. Suspendare și încetare","FiiViu poate suspenda sau elimina oferte dacă legea, riscurile de securitate, lipsa documentelor, încălcările contractuale semnificative sau informațiile incorecte o impun. Motivele vor fi comunicate pe un suport durabil atunci când legea o cere. Încetarea obișnuită respectă termenele convenite și drepturile imperative."],
["7. Reclamații ale furnizorilor","Furnizorii pot depune gratuit reclamații privind probleme tehnice, măsuri sau acești termeni la <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. FiiViu va analiza reclamațiile într-un termen rezonabil și va comunica individual rezultatul. Dacă FiiViu se califică drept întreprindere mică în sensul Regulamentului (UE) 2019/1150, se aplică excepțiile legale pentru anumite obligații P2B; acest statut este verificat intern."],
["8. Protecția datelor","Datele personale ale furnizorilor sunt prelucrate conform politicii de confidențialitate și legislației aplicabile. Furnizorii trebuie să utilizeze datele personale ale clienților numai în limitele permise de lege."],
["9. Proprietate intelectuală","Furnizorii garantează că imaginile, textele, mărcile și celelalte materiale furnizate FiiViu pot fi utilizate legal și nu încalcă drepturile terților. FiiViu primește un drept neexclusiv de utilizare pentru platformă pe durata și în scopul relației."],
["10. Răspundere","Furnizorii răspund potrivit legii pentru serviciile și conținutul ilegal sau inexact furnizat. Orice despăgubire către FiiViu se aplică numai în măsura permisă de lege și dacă prejudiciul rezultă dintr-o încălcare imputabilă furnizorului."],
["11. Modificări","Modificările sunt comunicate cu un termen rezonabil atunci când legea o cere. Modificările importante nu se aplică retroactiv rezervărilor încheiate, cu excepția cazurilor permise de lege."],
["12. Legea aplicabilă","Se aplică dreptul român, cu respectarea normelor imperative ale UE și a protecției consumatorilor. Competența se stabilește potrivit normelor imperative aplicabile."],
["13. Datele societății","Operatorul platformei FiiViu:<br>Denumirea completă a societății: ____________________<br>CUI: ____________________<br>Numărul de înregistrare la Registrul Comerțului: ____________________<br>Adresa completă a sediului social: ____________________<br>Cod de TVA (dacă există): ____________________<br>Aceste date vor fi completate pe baza documentelor oficiale ale societății."]];
c.de.s.push(["14. Anbieterzugang und Angebote","Nach erfolgreicher Registrierung erhält der Anbieter einen persönlichen Anbieterzugang. Dort kann er seine Angebote einstellen und – soweit die jeweilige Funktion freigeschaltet ist – bearbeiten sowie die zu seinem Konto gehörenden Buchungen und Buchungsdetails einsehen. Angebote können vor ihrer öffentlichen Veröffentlichung einer Prüfung oder Freigabe durch FiiViu unterliegen. Zugangsdaten sind vertraulich zu behandeln und dürfen nicht an unbefugte Personen weitergegeben werden."]);
c.de.s.push(["15. Buchungen und Leistungserbringung","Der Anbieter hält Preise, Termine, verfügbare Kapazitäten, Treffpunkt, Leistungsbeschreibung und aktivierte Vor-Ort-Zahlungsarten aktuell. Eine über FiiViu bestätigte und online bezahlte Buchung ist vom Anbieter entsprechend den angezeigten Angaben zu erfüllen. Der Anbieter ist für Personal, Genehmigungen, Sicherheit, Qualität, Kundeninformation sowie die gesetzlich erforderlichen Belege und Steuern seiner Leistung verantwortlich. Zusätzliche oder abweichende Entgelte dürfen dem Kunden nicht unangekündigt berechnet werden."]);
c.de.s.push(["16. Stornierungen und Nichterscheinen","Bei einer Kundenstornierung mindestens 24 Stunden vor Beginn wird die online gezahlte 20%-Gebühr vollständig über die ursprüngliche Zahlungsmethode erstattet. Bei einer Kundenstornierung weniger als 24 Stunden vor Beginn wird die Onlinegebühr grundsätzlich nicht erstattet. Nach Beginn der Erfahrung ist eine Online-Stornierung nicht mehr möglich. Storniert der Anbieter eine bestätigte Buchung, wird die online gezahlte 20%-Gebühr vollständig erstattet; der Anbieter darf die nicht über FiiViu eingezogenen 80% nicht als von FiiViu ausgezahlten Betrag behandeln. Der Anbieter muss eine notwendige Stornierung unverzüglich über den vorgesehenen Anbieterzugang oder gegenüber FiiViu melden und den Kunden informieren. Bei Nichterscheinen des Kunden wird die Onlinegebühr von 20 % grundsätzlich nicht erstattet, soweit die vor der Buchung angezeigten Bedingungen und zwingendes Recht nichts anderes vorsehen. FiiViu zieht den Vor-Ort-Restbetrag nicht ein."]);
c.de.s.push(["17. Sichtbarkeit und Marketing","FiiViu kann Angebote über die Website, digitale Marketingmaßnahmen, soziale Medien sowie Werbematerialien und QR-Aufsteller in Unterkünften wie Ferienwohnungen/Airbnb und anderen touristischen Partnerorten bekannt machen. Diese Maßnahmen können sich ändern; eine bestimmte Reichweite, Anzahl von Anfragen oder Buchungen wird nicht garantiert. Es besteht kein Anspruch auf eine bestimmte Platzierung."]);
c.de.s.push(["18. Kundenkommunikation","Der Anbieter verwendet Buchungs- und Kontaktdaten ausschließlich zur Durchführung und Betreuung der jeweiligen Buchung sowie im gesetzlich zulässigen Umfang. Kunden dürfen nicht unter Umgehung der Plattform zu nicht ausgewiesenen Zahlungen oder Buchungen gedrängt werden."]);
c.en.s.push(["14. Provider account and listings","After successful registration, the provider receives an individual provider account. From that account the provider can create offers and, where the relevant feature is enabled, edit them and view bookings and booking details associated with the account. Offers may be subject to review or approval by FiiViu before public listing. Login credentials must be kept confidential and must not be shared with unauthorised persons."]);
c.en.s.push(["15. Bookings and service delivery","The provider must keep prices, dates, available capacity, meeting point, service description and enabled on-site payment methods accurate and up to date. A booking confirmed through FiiViu after online payment must be honoured as described in the listing. The provider is responsible for staff, permits, safety, quality, customer information, and legally required receipts and taxes relating to its service. Customers must not be charged undisclosed or unannounced additional fees."]);
c.en.s.push(["16. Cancellations and no-shows","If the customer cancels at least 24 hours before the experience starts, the 20% online fee is fully refunded through the original payment method. If the customer cancels less than 24 hours before the start, the online fee is generally not refunded. Online cancellation is unavailable after the experience has started. If the provider cancels a confirmed booking, the 20% online fee paid is fully refunded; the provider must not treat the 80% balance, which FiiViu has not collected, as a payout from FiiViu. The provider must promptly report a necessary cancellation through the provider account or to FiiViu and inform the customer. For customer no-shows, the 20% online fee is generally not refunded unless the conditions shown before booking or mandatory law provide otherwise. FiiViu does not collect the on-site balance."]);
c.en.s.push(["17. Visibility and marketing","FiiViu may promote offers through its website, digital marketing, social media and promotional materials or QR displays at accommodation venues such as holiday rentals/Airbnb and other tourism partner locations. These activities may change; no particular reach, number of enquiries or bookings is guaranteed. No specific ranking is guaranteed."]);
c.en.s.push(["18. Customer communications","The provider may use booking and contact details only to perform and support the relevant booking and as otherwise permitted by law. Customers must not be pressured into undisclosed payments or bookings that bypass the platform."]);
c.ro.s.push(["14. Contul furnizorului și oferte","După înregistrarea reușită, furnizorul primește acces la propriul cont de furnizor. Din acest cont își poate crea ofertele și, în măsura în care funcția este disponibilă, le poate modifica și poate consulta rezervările și detaliile aferente contului său. Ofertele pot fi supuse verificării sau aprobării FiiViu înainte de publicare. Datele de autentificare trebuie păstrate confidențial și nu pot fi comunicate persoanelor neautorizate."]);
c.ro.s.push(["15. Rezervări și prestarea serviciilor","Furnizorul trebuie să mențină corecte și actuale prețurile, datele, capacitatea disponibilă, punctul de întâlnire, descrierea serviciului și metodele de plată la fața locului activate. O rezervare confirmată prin FiiViu după plata online trebuie onorată conform informațiilor afișate în ofertă. Furnizorul răspunde pentru personal, autorizații, siguranță, calitate, informarea clienților, precum și pentru documentele fiscale și taxele impuse de lege pentru serviciul său. Clientului nu i se pot solicita taxe suplimentare care nu au fost prezentate în prealabil."]);
c.ro.s.push(["16. Anulări și neprezentare","Dacă clientul anulează cu cel puțin 24 de ore înainte de începerea experienței, avansul online de 20% este rambursat integral prin metoda inițială de plată. Dacă clientul anulează cu mai puțin de 24 de ore înainte de începere, avansul online nu se rambursează, în principiu. După începerea experienței, anularea online nu mai este disponibilă. Dacă furnizorul anulează o rezervare confirmată, avansul online de 20% este rambursat integral; furnizorul nu poate considera restul de 80%, care nu a fost încasat de FiiViu, drept o sumă plătită de FiiViu. Furnizorul trebuie să raporteze fără întârziere anularea necesară prin contul de furnizor sau către FiiViu și să informeze clientul. În caz de neprezentare a clientului, avansul online de 20% nu se rambursează, în principiu, dacă condițiile afișate înainte de rezervare sau legea aplicabilă nu prevăd altfel. FiiViu nu încasează restul de plată de la fața locului."]);
c.ro.s.push(["17. Vizibilitate și promovare","FiiViu poate promova ofertele prin website, campanii digitale, rețele sociale, materiale publicitare și suporturi cu cod QR amplasate în unități de cazare precum apartamente de vacanță/Airbnb și alte locații partenere din turism. Aceste activități se pot modifica; nu se garantează un anumit nivel de vizibilitate, un număr de solicitări sau de rezervări. Nu se garantează o anumită poziție în listări."]);
c.ro.s.push(["18. Comunicarea cu clienții","Furnizorul poate utiliza datele de rezervare și de contact numai pentru executarea și gestionarea rezervării respective și în alte scopuri permise de lege. Clienții nu pot fi determinați să efectueze plăți nedeclarate sau rezervări în afara platformei."]);
function setLanguage(lang){const x=c[lang]||c.de;document.documentElement.lang=lang;document.title=x.title+" – FiiViu";document.getElementById("content").innerHTML="<a class='back' href='/provider.html'>"+x.back+"</a><h1>"+x.title+"</h1><p>"+x.intro+"</p><div class='notice'>"+x.notice+"</div>"+x.s.map(s=>"<h2>"+s[0]+"</h2><p>"+s[1]+"</p>").join("")+"<p><small>"+x.updated+"</small></p>";document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));}const p=new URLSearchParams(location.search);setLanguage("ro");</script></body></html>
