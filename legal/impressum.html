<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiiViu – Impressum</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:900px;margin:0 auto;padding:32px 20px;line-height:1.65;color:#171717;background:#F8F6F1}main{background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 45px rgba(21,21,21,.08)}h1,h2{line-height:1.2}h2{margin-top:32px}a{color:#c9581d}.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:24px}.lang button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:700}.lang button.active{background:#151515;color:#fff}.back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:700}.warn{padding:14px 16px;border-radius:12px;background:#fff3cd}</style></head><body><div class="lang"><button data-lang="de" onclick="setLanguage('de')">DE</button><button data-lang="en" onclick="setLanguage('en')">EN</button><button data-lang="ro" onclick="setLanguage('ro')">RO</button></div><main id="legal-content"></main><script>
const content={
de:{title:"Impressum / Anbieterkennzeichnung",back:"← Zurück zu FiiViu",h:"Betreiber und Anbieter des Dienstes",body:"FiiViu ist eine Online-Vermittlungsplattform für einzelne Erlebnisse und Dienstleistungen unabhängiger Anbieter. Der konkrete Leistungserbringer wird bei der jeweiligen Buchung angegeben.",data:"FiiViu S.R.L.<br>Sitz: București, Rumänien<br>E-Mail: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>",missing:"Vor der öffentlichen Nutzung müssen die gesetzlich erforderlichen Unternehmensangaben aus den offiziellen Unterlagen ergänzt werden: CUI, vollständige juristische Anschrift, Handelsregisternummer und – soweit anwendbar – TVA-/USt.-Identifikationsnummer sowie weitere gesetzlich erforderliche Kontaktdaten. Keine dieser Angaben darf geschätzt werden.",contact:"Kontakt und rechtliche Hinweise",contactBody:"Die Plattform ist für Kunden in Rumänien und der EU bestimmt. Rechtlich verbindliche Mitteilungen können an die oben genannte E-Mail-Adresse gesendet werden.",update:"Stand: 26. September 2026."},
en:{title:"Legal Notice / Provider Information",back:"← Back to FiiViu",h:"Operator and service provider",body:"FiiViu is an online intermediation platform for individual experiences and services provided by independent providers. The concrete service provider is identified for each booking.",data:"FiiViu S.R.L.<br>Registered seat: Bucharest, Romania<br>Email: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>",missing:"Before public operation, the legally required company details must be completed from the official corporate documents: CUI, full legal address, Trade Register number and, where applicable, VAT identification and other legally required contact details. No such details may be guessed.",contact:"Contact and legal notices",contactBody:"The platform is intended for customers in Romania and the EU. Legally relevant notices may be sent to the email address above.",update:"As of: 26 September 2026."},
ro:{title:"Informații juridice / Datele furnizorului",back:"← Înapoi la FiiViu",h:"Operatorul și furnizorul serviciului",body:"FiiViu este o platformă online de intermediere pentru experiențe și servicii individuale oferite de furnizori independenți. Furnizorul concret al serviciului este identificat pentru fiecare rezervare.",data:"FiiViu S.R.L.<br>Sediu: București, România<br>E-mail: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>",missing:"Înainte de utilizarea publică trebuie completate, pe baza documentelor oficiale ale societății, toate datele obligatorii: CUI, adresa juridică completă, numărul de ordine din Registrul Comerțului și, dacă este cazul, codul de TVA și celelalte date de contact impuse de lege. Nicio astfel de informație nu trebuie presupusă.",contact:"Contact și notificări juridice",contactBody:"Platforma este destinată clienților din România și din UE. Notificările cu relevanță juridică pot fi transmise la adresa de e-mail de mai sus.",update:"Data: 26 septembrie 2026."}};
function setLanguage(lang){const c=content[lang]||content.de;document.documentElement.lang=lang;document.title=c.title+" – FiiViu";document.getElementById("legal-content").innerHTML="<a class='back' href='/?lang="+encodeURIComponent(lang)+"'>"+c.back+"</a><h1>"+c.title+"</h1><h2>"+c.h+"</h2><p>"+c.data+"</p><p>"+c.body+"</p><div class='warn'><strong>"+(lang==="ro"?"Important":lang==="de"?"Wichtig":"Important")+"</strong><p>"+c.missing+"</p></div><h2>"+c.contact+"</h2><p>"+c.contactBody+"</p><p><small>"+c.update+"</small></p>";document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));localStorage.setItem("fiiviu_language",lang)}const p=new URLSearchParams(location.search);setLanguage(p.get("lang")||localStorage.getItem("fiiviu_language")||"de");</script></body></html>
