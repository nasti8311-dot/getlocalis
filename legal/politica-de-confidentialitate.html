const content={
de:{title:"Datenschutzerklärung",back:"← Zurück zu FiiViu",intro:"FiiViu S.R.L. verarbeitet personenbezogene Daten im Zusammenhang mit der Plattform, soweit FiiViu die Zwecke und Mittel der jeweiligen Verarbeitung bestimmt. Bei bestimmten Verarbeitungen können externe Anbieter oder Erlebnisanbieter eigenständige Verantwortliche sein.",sections:[
["1. Verantwortlicher","FiiViu S.R.L., București, Rumänien, E-Mail: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. Die vollständige juristische Anschrift, CUI und Handelsregisternummer werden vor dem öffentlichen Launch anhand der offiziellen Unternehmensunterlagen ergänzt."],
["2. Welche Daten verarbeitet werden","Je nach Nutzung können Name, E-Mail-Adresse, Telefonnummer, Teilnehmerzahl, Buchungsdatum und -zeit, Erlebnis, Anbieter, Buchungs-ID, Treffpunkt, Nachrichten/Anmerkungen, technische Sicherheitsdaten, Zahlungs-/Erstattungsinformationen und ein Partner-/Empfehlungscode verarbeitet werden. Bei Partneranfragen können zusätzlich Firmenname, Kontaktperson, Kontaktdaten, gewünschte Materialien/QR-Codes und Lieferangaben verarbeitet werden. Bei Affiliate-Anträgen dokumentiert FiiViu außerdem die akzeptierte Vertragsversion und Sprache, den Zeitpunkt der Zustimmung, die IP-Adresse und den Browser-User-Agent als Nachweis der Annahme und zur Geltendmachung oder Verteidigung rechtlicher Ansprüche. Vollständige Kartennummern und CVC werden nicht von FiiViu gespeichert."],
["3. Zwecke und Rechtsgrundlagen","Daten werden insbesondere für vorvertragliche Maßnahmen und Vertragsdurchführung, Buchungs- und Zahlungsabwicklung, Kommunikation, Erstattungen, Betrugs- und Missbrauchsprävention, IT-Sicherheit, gesetzliche Aufbewahrungs- und Nachweispflichten sowie die Bearbeitung von Beschwerden verarbeitet. Rechtsgrundlagen sind je nach Vorgang Art. 6 Abs. 1 lit. b DSGVO (Buchung und Vertrag), lit. c (konkrete gesetzliche Pflichten), lit. f (berechtigte Interessen) oder lit. a (Einwilligung). Zu den berechtigten Interessen gehören der sichere und stabile Plattformbetrieb, die Abwehr von Betrug und Missbrauch, die Bearbeitung von Anfragen und Beschwerden sowie die Geltendmachung oder Abwehr rechtlicher Ansprüche. Bei lit. f wird eine Interessenabwägung vorgenommen; du kannst aus Gründen deiner besonderen Situation widersprechen."],
["4. Erlebnisanbieter","Für die Durchführung einer Buchung werden die dafür erforderlichen Daten an den konkreten Anbieter übermittelt, etwa Name, Teilnehmerzahl, Datum/Uhrzeit und relevante Hinweise. Der Anbieter kann für eigene Zwecke eigenständiger Verantwortlicher sein und muss seine eigenen Datenschutzpflichten erfüllen."],
["5. Stripe","Zahlungen werden über Stripe verarbeitet. Stripe kann Zahlungs-, Transaktions-, Geräte- und Betrugspräventionsdaten nach seinen eigenen Bedingungen verarbeiten. FiiViu speichert keine vollständigen Kartendaten. Weitere Informationen sind in den jeweils geltenden Stripe-Datenschutzinformationen enthalten."],
["6. Cloudflare und Infrastruktur","Die Plattform verwendet Cloudflare Workers und Cloudflare D1 für Hosting/Anwendungslogik, Datenbank und Sicherheitsfunktionen. Für den Betrieb können technische Daten und Buchungsdaten verarbeitet und gespeichert werden."],
["7. E-Mail-Dienstleister","Für operative E-Mails können Resend und/oder EmailJS eingesetzt werden. Nur für den Versand erforderliche Daten, insbesondere E-Mail-Adresse und Nachrichtendaten, werden an den jeweils aktiv eingesetzten Dienst übermittelt. Die Anbieterbedingungen und Auftragsverarbeitungs-/Transferunterlagen sind für die tatsächlich aktivierten Dienste zu prüfen und intern zu dokumentieren."],
["8. Partner-Attribution","Ein Partnercode kann zur Zuordnung einer Buchung zu einem Partner verarbeitet werden. Der Referral-Code wird aktuell nur temporär aus der URL übernommen und nicht dauerhaft im Browser gespeichert. Die Zuordnung dient der Abrechnung der Partnerprovision und wird nicht für verhaltensbezogene Werbung verwendet."],
["9. Externe Browser-Ressourcen","Die Website verwendet unter anderem Frontend-Ressourcen von Tailwind CDN, cdnjs, jsDelivr und npmcdn sowie Bilder von Pexels und Unsplash; Stripe.js wird erst beim Start des Buchungs-/Zahlungsvorgangs geladen. Beim Abruf externer Ressourcen können technische Verbindungsdaten wie IP-Adresse und Browserinformationen an den jeweiligen Anbieter übermittelt werden. Die Cookie-Richtlinie beschreibt diese Ressourcen näher. Nicht notwendige Speicher- oder Tracking-Technologien werden ohne vorherige Einwilligung nicht aktiviert."],
["10. Speicherdauer","Buchungs- und Zahlungsdaten werden nur so lange gespeichert, wie sie für die Buchung, Abwicklung, Rückerstattung, Streitbeilegung und gesetzliche Pflichten benötigt werden. Buchführungsregister und Belege, die unter Art. 25 des rumänischen Gesetzes Nr. 82/1991 fallen, werden grundsätzlich fünf Jahre ab dem 1. Juli des auf das betreffende Geschäftsjahr folgenden Jahres aufbewahrt. Nachweise über die Annahme eines Partnervertrags werden während der Vertragsbeziehung und anschließend nur so lange aufbewahrt, wie dies zur Geltendmachung, Ausübung oder Verteidigung rechtlicher Ansprüche oder zur Erfüllung gesetzlicher Pflichten erforderlich ist. Andere Daten werden gelöscht oder anonymisiert, sobald ihr Zweck entfällt und keine gesetzliche Pflicht oder erforderliche Anspruchssicherung entgegensteht. Für einzelne technische Protokolle und Supportanfragen gelten zweckbezogene, intern festzulegende Fristen; es wird keine pauschale Fünfjahresfrist auf sämtliche personenbezogenen Daten angewendet."],
["11. Rechte betroffener Personen","Betroffene Personen können nach den gesetzlichen Voraussetzungen Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch verlangen sowie eine Einwilligung jederzeit mit Wirkung für die Zukunft widerrufen. Anfragen: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>."],
["12. Beschwerden","Eine Beschwerde kann bei der zuständigen Datenschutzaufsichtsbehörde, in Rumänien insbesondere bei der ANSPDCP, eingereicht werden."],
["13. Internationale Übermittlungen","Einige eingesetzte Infrastruktur-, Zahlungs- und Kommunikationsanbieter können Daten je nach Dienst und Konfiguration außerhalb des EWR verarbeiten oder darauf zugreifen. Eine solche Übermittlung darf nur erfolgen, wenn die Voraussetzungen aus Kapitel V DSGVO erfüllt sind, etwa durch einen Angemessenheitsbeschluss oder geeignete Garantien wie Standardvertragsklauseln und gegebenenfalls ergänzende Maßnahmen. Die konkreten Verarbeitungsorte und Transfergarantien müssen anhand der jeweils geltenden Anbieter-Verträge und Einstellungen geprüft werden."],
["14. Sicherheit","FiiViu verwendet angemessene technische und organisatorische Maßnahmen, darunter verschlüsselte Übertragung, Zugriffskontrollen, Sitzungs- und Authentifizierungsschutz sowie Beschränkung des Datenzugriffs auf erforderliche Funktionen."],
["15. Änderungen","Diese Datenschutzerklärung wird angepasst, wenn sich Verarbeitungsvorgänge, Dienstleister oder gesetzliche Anforderungen wesentlich ändern. Die jeweils aktuelle Fassung wird auf der Website veröffentlicht."]],updated:"Letzte Aktualisierung: 7. November 2026."},
en:{title:"Privacy Policy",back:"← Back to FiiViu",intro:"FiiViu S.R.L. processes personal data in connection with the platform where FiiViu determines the purposes and means of the relevant processing. Certain processing may be carried out by independent controllers such as experience providers.",sections:[],updated:"Last updated: 7 November 2026."},
ro:{title:"Politica de confidențialitate",back:"← Înapoi la FiiViu",intro:"FiiViu S.R.L. prelucrează date cu caracter personal în legătură cu platforma în măsura în care stabilește scopurile și mijloacele prelucrării respective. Unele prelucrări pot fi efectuate de operatori independenți, precum furnizorii experiențelor.",sections:[],updated:"Ultima actualizare: 7 noiembrie 2026."}};
content.en.sections=[
["1. Controller","FiiViu S.R.L., Bucharest, Romania, email: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. The full legal address, CUI and Trade Register number will be completed from official company documents before public launch."],
["2. Data processed","Depending on use, FiiViu may process name, email, phone number, participant number, booking date/time, experience, provider, booking ID, meeting point, messages/notes, technical security data, payment/refund information and a partner/referral code. For partner applications, FiiViu may also process company name, contact person and details, requested QR materials and delivery information. For affiliate applications, FiiViu also records the accepted agreement version and language, the acceptance timestamp, IP address and browser user-agent as evidence of acceptance and for establishing or defending legal claims. FiiViu does not store full card numbers or CVC."],
["3. Purposes and legal bases","Data may be processed for pre-contractual steps and contract performance, booking and payment handling, communications, refunds, fraud/abuse prevention, IT security, legal retention/evidence duties and complaints. Depending on the activity, the legal basis is Article 6(1)(b) GDPR (booking and contract), (c) (specific legal duties), (f) (legitimate interests), or (a) (consent). Legitimate interests include secure and reliable platform operation, fraud and abuse prevention, handling enquiries and complaints, and establishing or defending legal claims. An assessment of those interests is made; you may object on grounds relating to your particular situation."],
["4. Experience providers","Data necessary to perform a booking is shared with the relevant provider, such as name, participant number, date/time and relevant notes. The provider may be an independent controller for its own processing and must meet its own data-protection duties."],
["5. Stripe","Payments are processed through Stripe. Stripe may process payment, transaction, device and fraud-prevention data under its applicable terms. FiiViu does not store full card data."],
["6. Cloudflare and infrastructure","The platform uses Cloudflare Workers and Cloudflare D1 for application infrastructure, database and security functions. Technical and booking data may be processed and stored as required to operate the service."],
["7. Email providers","Operational emails may use Resend and/or EmailJS. Only data needed for delivery, particularly email address and message content, is transmitted to the provider actually used. The terms, data-processing agreements and transfer documents for the services actually enabled must be checked and documented internally."],
["8. Partner attribution","A partner code may be processed to attribute a booking to a partner. The referral code is currently read temporarily from the URL and is not persistently stored in the browser. Attribution is used for partner commission accounting and not for behavioral advertising."],
["9. External browser resources","The website uses, among other resources, frontend assets from Tailwind CDN, cdnjs, jsDelivr and npmcdn, as well as images from Pexels and Unsplash; Stripe.js is loaded only when the booking/payment flow starts. Requests to external resources may transmit technical connection data such as IP address and browser information to the relevant provider. The Cookie Policy describes these resources in more detail. Non-essential storage or tracking technologies are not activated without prior consent."],
["10. Retention","Booking and payment data is kept only as long as needed for the booking, fulfilment, refunds, dispute handling and legal duties. Accounting registers and supporting documents falling within Article 25 of Romanian Law No. 82/1991 are generally retained for five years from 1 July of the year following the relevant financial year. Evidence of affiliate agreement acceptance is retained during the contractual relationship and afterwards only for as long as necessary to establish, exercise or defend legal claims or meet legal duties. Other data is erased or anonymised when its purpose ends and no legal duty or necessary preservation for claims applies. Purpose-specific periods apply to technical logs and support enquiries; no blanket five-year period is applied to all personal data."],
["11. Rights","Subject to GDPR conditions, data subjects may request access, rectification, erasure, restriction, portability and objection, and may withdraw consent for future processing where consent is the legal basis. Requests: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>."],
["12. Complaints","A complaint may be lodged with the competent supervisory authority, in Romania in particular ANSPDCP."],
["13. International transfers","Depending on the service and configuration, infrastructure, payment and communications providers may process or access data outside the EEA. Any such transfer must meet Chapter V GDPR requirements, for example an adequacy decision or appropriate safeguards such as Standard Contractual Clauses and, where necessary, supplementary measures. Actual processing locations and transfer safeguards must be checked against the applicable provider agreements and settings."],
["14. Security","FiiViu applies appropriate technical and organisational measures, including encrypted transmission, access controls, session/authentication protection and least-privilege access."],
["15. Changes","This policy is updated when processing activities, providers or legal requirements materially change. The current version is published on the website."]];
content.ro.sections=[
["1. Operatorul","FiiViu S.R.L., București, România, e-mail: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. Adresa juridică completă, CUI și numărul Registrului Comerțului vor fi completate pe baza documentelor oficiale înainte de lansarea publică."],
["2. Date prelucrate","În funcție de utilizare, FiiViu poate prelucra nume, e-mail, număr de telefon, numărul participanților, data/ora rezervării, experiența, furnizorul, ID-ul rezervării, locul întâlnirii, mesaje/observații, date tehnice de securitate, informații privind plata/rambursarea și un cod de partener/recomandare. Pentru solicitările de parteneriat pot fi prelucrate și numele solicitantului, adresa de e-mail, compania, tipul parteneriatului, numărul suporturilor QR solicitate, adresa de livrare și mesajul transmis. Pentru solicitările de afiliere, FiiViu înregistrează și versiunea și limba contractului acceptat, momentul acceptării, adresa IP și identificatorul browserului (user-agent), ca dovadă a acceptării și pentru constatarea, exercitarea sau apărarea unor drepturi. FiiViu nu stochează numere complete de card sau CVC."],
["3. Scopuri și temeiuri","Datele pot fi prelucrate pentru demersuri precontractuale și executarea contractului, evaluarea și gestionarea solicitărilor de parteneriat, administrarea relației cu partenerii și livrarea materialelor QR solicitate, rezervări și plăți, comunicare, rambursări, prevenirea fraudei/abuzului, securitate IT, obligații legale de păstrare/probă și reclamații. În funcție de activitate, temeiul este art. 6 alin. (1) lit. b) GDPR (rezervări și contract), lit. c) (obligații legale concrete), lit. f) (interese legitime) sau lit. a) (consimțământ). Interesele legitime includ funcționarea sigură și stabilă a platformei, prevenirea fraudei și abuzului, gestionarea solicitărilor și reclamațiilor, precum și constatarea, exercitarea sau apărarea drepturilor în justiție. Se efectuează o evaluare a acestor interese; te poți opune din motive legate de situația ta particulară."],
["4. Furnizorii experiențelor","Datele necesare executării rezervării sunt comunicate furnizorului relevant, de exemplu numele, numărul participanților, data/ora și observațiile relevante. Furnizorul poate fi operator independent pentru propriile prelucrări și are propriile obligații de protecție a datelor."],
["5. Stripe","Plățile sunt procesate prin Stripe. Stripe poate prelucra date privind plata, tranzacția, dispozitivul și prevenirea fraudei conform condițiilor sale aplicabile. FiiViu nu stochează date complete ale cardului."],
["6. Cloudflare și infrastructura","Platforma utilizează Cloudflare Workers și Cloudflare D1 pentru infrastructură, baza de date și funcții de securitate. Datele tehnice și datele de rezervare pot fi prelucrate și stocate în măsura necesară operării serviciului."],
["7. Furnizori de e-mail","E-mailurile operaționale pot fi transmise prin Resend și/sau EmailJS. Sunt transmise furnizorului efectiv utilizat doar datele necesare livrării, în special adresa de e-mail și conținutul mesajului. Condițiile furnizorilor, acordurile de prelucrare a datelor și documentele privind transferurile pentru serviciile efectiv activate trebuie verificate și documentate intern."],
["8. Atribuirea partenerilor","Un cod de partener poate fi prelucrat pentru atribuirea unei rezervări unui partener. Codul de recomandare este preluat temporar din URL și nu este stocat persistent în browser. Atribuirea este utilizată pentru calculul comisionului partenerului și nu pentru publicitate comportamentală."],
["9. Resurse externe","Site-ul utilizează, printre altele, resurse frontend de la Tailwind CDN, cdnjs, jsDelivr și npmcdn, precum și imagini de la Pexels și Unsplash; Stripe.js este încărcat numai la începerea fluxului de rezervare/plată. Solicitările către resurse externe pot transmite furnizorului relevant date tehnice de conexiune, precum adresa IP și informații despre browser. Politica privind cookie-urile descrie aceste resurse mai detaliat. Tehnologiile neesențiale de stocare sau urmărire nu sunt activate fără consimțământ prealabil."],
["10. Păstrarea datelor","Datele privind rezervările și plățile sunt păstrate numai atât cât este necesar pentru rezervare, executare, rambursări, soluționarea litigiilor și obligații legale. Registrele contabile și documentele justificative care intră sub incidența art. 25 din Legea română nr. 82/1991 se păstrează, în principiu, timp de cinci ani calculați de la 1 iulie a anului următor exercițiului financiar relevant. Dovezile acceptării contractului de afiliere sunt păstrate pe durata relației contractuale și ulterior numai atât timp cât este necesar pentru constatarea, exercitarea sau apărarea unor drepturi ori pentru îndeplinirea obligațiilor legale. Alte date sunt șterse sau anonimizate când scopul încetează și nu există o obligație legală ori necesitatea păstrării pentru apărarea unor drepturi. Pentru jurnalele tehnice și solicitările de asistență se aplică perioade specifice scopului; nu se aplică o perioadă generală de cinci ani tuturor datelor personale."],
["11. Drepturile persoanelor vizate","În condițiile GDPR, persoanele vizate pot solicita acces, rectificare, ștergere, restricționare, portabilitate și opoziție și pot retrage consimțământul pentru viitor atunci când acesta este temeiul legal. Solicitări: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>."],
["12. Plângeri","O plângere poate fi depusă la autoritatea de supraveghere competentă, în România în special ANSPDCP."],
["13. Transferuri internaționale","În funcție de serviciu și configurație, furnizorii de infrastructură, plăți și comunicații pot prelucra date sau pot avea acces la acestea în afara SEE. Orice astfel de transfer trebuie să respecte capitolul V GDPR, de exemplu printr-o decizie de adecvare sau garanții adecvate precum Clauzele Contractuale Standard și, dacă este necesar, măsuri suplimentare. Locurile efective de prelucrare și garanțiile de transfer trebuie verificate pe baza contractelor și setărilor aplicabile ale furnizorilor."],
["14. Securitate","FiiViu aplică măsuri tehnice și organizatorice adecvate, inclusiv transmitere criptată, controale de acces, protecția sesiunilor/autentificării și acces limitat la ceea ce este necesar."],
["15. Modificări","Politica este actualizată atunci când activitățile de prelucrare, furnizorii sau cerințele legale se modifică în mod relevant. Versiunea actuală este publicată pe site."]];
function setLanguage(lang){const c=content[lang]||content.de;document.documentElement.lang=lang;document.title=c.title+" – FiiViu";document.getElementById("legal-content").innerHTML="<a class='back' href='/?lang="+encodeURIComponent(lang)+"'>"+c.back+"</a><h1>"+c.title+"</h1><p>"+c.intro+"</p>"+c.sections.map(s=>"<h2>"+s[0]+"</h2><p>"+s[1]+"</p>").join("")+"<p><small>"+c.updated+"</small></p>";document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang))}const p=new URLSearchParams(location.search);setLanguage(p.get("lang")||"de");</script><script src="/assets/js/fiiviu-consent.js" defer></script>
