de:{title:"Datenschutzerklärung",back:"← Zurück zu FiiViu",intro:"FiiViu S.R.L., București, Rumänien, E-Mail: info@fiiviu.ro, ist für personenbezogene Daten, die über die Plattform verarbeitet werden, Verantwortlicher, soweit FiiViu Zwecke und Mittel der Verarbeitung festlegt.",
sections:[
["1. Welche Daten wir verarbeiten","<ul><li>Vor- und Nachname;</li><li>E-Mail-Adresse;</li><li>Buchungsdaten: Erlebnis, Anbieter, Datum und Uhrzeit, Teilnehmerzahl, Buchungs-ID;</li><li>Nachrichten und Hinweise des Kunden;</li><li>Technische Daten, die für Betrieb und Sicherheit der Website erforderlich sind;</li><li>Zahlungs- und Erstattungsdaten über den Zahlungsdienstleister. FiiViu fordert keine vollständige Kartennummer oder CVC an und speichert diese nicht;</li><li>Ein Empfehlungs-/Partnercode, wenn dieser zur Zuordnung einer Buchung verwendet wird.</li></ul>"],
["2. Zwecke und Rechtsgrundlagen","<p>Daten werden je nach Fall für den Abschluss und die Durchführung der Buchung, die Abwicklung von Zahlungen und Erstattungen, die Kommunikation mit Kunden, Betrugsprävention, die Sicherheit der Plattform, die Erfüllung gesetzlicher Pflichten und die Bearbeitung von Beschwerden verarbeitet.</p><p>Rechtsgrundlagen können Art. 6 Abs. 1 lit. b DSGVO für die Vertragserfüllung oder vorvertragliche Maßnahmen, lit. c für gesetzliche Pflichten und lit. f für berechtigte Interessen sein, sofern die gesetzlichen Voraussetzungen erfüllt sind. Eine Einwilligung wird nur verwendet, wenn sie als Rechtsgrundlage erforderlich ist.</p>"],
["3. Stripe","<p>Online-Zahlungen werden über Stripe verarbeitet. Im Rahmen der Zahlung können Zahlungs-, Transaktions- und technische Daten verarbeitet werden. FiiViu speichert keine vollständigen Kartendaten. Die Rolle von Stripe kann je nach Verarbeitung und verwendetem Stripe-Dienst unterschiedlich sein. Für die Verarbeitung durch Stripe gelten die einschlägigen Vertragsunterlagen und Datenschutzinformationen von Stripe.</p>"],
["4. Cloudflare und Anwendungsinfrastruktur","<p>Die Plattform läuft auf Cloudflare-Infrastruktur, einschließlich Cloudflare Workers und Cloudflare D1. Technische Daten und für den Betrieb erforderliche Daten können zur Bereitstellung, Absicherung und zum Betrieb des Dienstes verarbeitet werden. Für die Ausführung des Dienstes erforderliche Buchungsdaten werden in der Anwendungsdatenbank, einschließlich Cloudflare D1, gespeichert.</p>"],
["5. Erlebnisanbieter","<p>Da FiiViu als Vermittler tätig ist, können bestimmte für die Durchführung der Buchung erforderliche Daten an den Erlebnisanbieter übermittelt werden, zum Beispiel Name, Teilnehmerzahl, Datum und Uhrzeit der Buchung sowie relevante Hinweise. Der Anbieter kann für eigene Verarbeitungen eigene Informations- und Datenschutzpflichten haben.</p>"],
["6. E-Mails und Dienstleister","<p>Für Bestätigungen und operative E-Mails kann ein spezialisierter E-Mail-Versanddienst genutzt werden. Die für den Versand erforderlichen Daten können an diesen Dienstleister übermittelt werden. Für jeden eingesetzten Dienstleister dokumentiert FiiViu die DSGVO-Rolle, die vertragliche Grundlage, den Verarbeitungsort, den Mechanismus für etwaige internationale Übermittlungen und die maßgebliche Aufbewahrungsdauer.</p>"],
["7. Externe Ressourcen im Browser","<p>Die aktuelle Oberfläche kann Bibliotheken und Ressourcen Dritter laden, darunter Stripe.js, Tailwind CSS, Font Awesome, Flatpickr und von Unsplash gehostete Bilder. Beim Laden können technische Daten wie die IP-Adresse an den Anbieter der Ressource übermittelt werden. Vor dem endgültigen Launch sollte jede externe Ressource erfasst und bewertet werden; nicht erforderliche Ressourcen sollten, soweit sinnvoll, lokal gehostet werden.</p>"],
["8. Empfehlungscodes und lokaler Speicher","<p>Wenn ein Kunde über einen Partnercode auf die Plattform gelangt, kann der Code lokal im Browser gespeichert werden, um eine spätere Buchung zuzuordnen. Diese Funktion darf nicht für verhaltensbezogene Werbung genutzt werden. Der konkrete Mechanismus und die Speicherdauer müssen in der Cookie-/Technologie-Richtlinie dokumentiert werden.</p>"],
["9. Marketing","<p>Marketingnachrichten sind für eine Buchung nicht erforderlich. Wenn FiiViu Newsletter, personalisierte Werbung oder andere Werbemitteilungen einführt, werden diese separat mit geeigneter Rechtsgrundlage und Widerrufsmöglichkeit eingerichtet.</p>"],
["10. Cookies und ähnliche Technologien","<p>Die Website muss unbedingt erforderliche Technologien von optionalen Technologien wie Analyse oder Marketing unterscheiden. Jedes später eingeführte Analyse-, Tracking- oder Werbeinstrument muss vor seiner Aktivierung in der Cookie-Richtlinie und im Einwilligungsmechanismus berücksichtigt werden, sofern eine Einwilligung erforderlich ist.</p>"],
["11. Aufbewahrungsdauer","<p>Daten werden so lange aufbewahrt, wie sie für die Buchung, die Vertragsbeziehung, buchhalterische/steuerliche Pflichten, die Wahrung der Rechte von FiiViu und andere legitime Zwecke erforderlich sind. Die genauen Fristen müssen intern festgelegt und mit den rumänischen Buchhaltungs- und Steuerpflichten abgestimmt werden.</p>"],
["12. Rechte betroffener Personen","<p>Unter den Voraussetzungen der DSGVO können betroffene Personen Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch haben sowie das Recht, eine Einwilligung zu widerrufen, wenn die Verarbeitung darauf beruht. Anfragen können an <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a> gerichtet werden.</p>"],
["13. Beschwerden","<p>Betroffene Personen können eine Beschwerde bei der rumänischen Datenschutzaufsichtsbehörde ANSPDCP einreichen, wenn sie der Ansicht sind, dass die Verarbeitung ihrer Daten gegen geltendes Recht verstößt.</p>"],
["14. Sicherheit","<p>FiiViu setzt geeignete technische und organisatorische Maßnahmen zum Schutz der Daten ein, einschließlich Zugriffskontrollen, sicherer Verbindungen und einer Begrenzung der erhobenen Daten auf das für die angegebenen Zwecke Erforderliche.</p>"],
["15. Internationale Übermittlungen","<p>Einige von der Plattform eingesetzte Technologieanbieter können Daten außerhalb Rumäniens oder des Europäischen Wirtschaftsraums verarbeiten. Für jeden aktiven Anbieter dokumentiert FiiViu den anwendbaren rechtlichen Übermittlungsmechanismus, einschließlich gegebenenfalls Standardvertragsklauseln oder anderer nach DSGVO vorgesehener Garantien.</p>"],
["16. Unternehmensdaten und Aktualisierung","<p>CUI, Handelsregisternummer, vollständige Geschäftsanschrift und gegebenenfalls DPO-Daten werden anhand der offiziellen Unternehmensunterlagen ergänzt. Diese Datenschutzerklärung kann aktualisiert werden, wenn sich Dienste, Anbieter oder die Art der Datenverarbeitung ändern.</p>"]
],updated:"Letzte Aktualisierung: 18. September 2026."},

content.ro.sections=[
["1. Ce date prelucrăm","<ul><li>nume și prenume;</li><li>adresă de e-mail;</li><li>date despre rezervare: experiență, furnizor, data și ora, numărul de participanți, ID-ul rezervării;</li><li>mesajele și observațiile transmise de client;</li><li>date tehnice necesare funcționării și securității site-ului;</li><li>date privind plata și rambursarea, prin intermediul furnizorului de plăți. FiiViu nu solicită și nu stochează numărul complet al cardului sau codul CVC;</li><li>un cod de recomandare/partener, atunci când acesta este folosit pentru atribuirea unei rezervări.</li></ul>"],
["2. Scopuri și temeiuri","<p>Datele sunt prelucrate, după caz, pentru încheierea și executarea rezervării, gestionarea plăților și rambursărilor, comunicarea cu clientul, prevenirea fraudei, securitatea platformei, respectarea obligațiilor legale și soluționarea reclamațiilor.</p><p>Temeiurile pot include art. 6 alin. (1) lit. b) GDPR pentru executarea contractului sau demersuri precontractuale, lit. c) pentru obligații legale și lit. f) pentru interese legitime, atunci când condițiile legale sunt îndeplinite. Consimțământul este utilizat numai atunci când acesta este necesar ca temei juridic.</p>"],
["3. Stripe","<p>Plățile online sunt procesate prin Stripe. În cadrul plății pot fi prelucrate date de plată, date despre tranzacție și date tehnice. FiiViu nu stochează datele complete ale cardului. Rolul Stripe poate depinde de natura prelucrării și de serviciul Stripe utilizat. Pentru detalii se aplică documentația contractuală și politica de confidențialitate Stripe relevante.</p>"],
["4. Cloudflare și infrastructura aplicației","<p>Platforma rulează pe infrastructură Cloudflare, inclusiv Cloudflare Workers și Cloudflare D1. Datele tehnice și datele necesare funcționării aplicației pot fi procesate pentru livrarea, securitatea și operarea serviciului. Datele de rezervare necesare executării serviciului sunt stocate în baza de date a aplicației, inclusiv Cloudflare D1.</p>"],
["5. Furnizorii experiențelor","<p>Întrucât FiiViu este intermediar, anumite date necesare pentru executarea rezervării pot fi comunicate furnizorului experienței, de exemplu numele, numărul de participanți, data și ora rezervării și observațiile relevante. Furnizorul poate avea propriile obligații de informare și protecție a datelor pentru prelucrările pe care le efectuează în calitate proprie.</p>"],
["6. E-mailuri și furnizori de servicii","<p>Pentru confirmări și comunicări operaționale prin e-mail poate fi utilizat un furnizor specializat de transmitere a e-mailurilor. Datele necesare trimiterii mesajului pot fi transmise furnizorului respectiv. Pentru fiecare furnizor activ, FiiViu documentează rolul GDPR, baza contractuală, locația procesării, mecanismul pentru eventualele transferuri internaționale și perioada relevantă de păstrare.</p>"],
["7. Resurse externe încărcate în browser","<p>Interfața actuală poate încărca în browser biblioteci și resurse furnizate de terți, inclusiv Stripe.js, Tailwind CSS, Font Awesome, Flatpickr și imagini găzduite de Unsplash. Încărcarea acestor resurse poate implica transmiterea unor date tehnice, precum adresa IP, către furnizorul resursei. Înainte de lansarea finală, fiecare resursă externă trebuie inventariată și evaluată; resursele care nu sunt necesare ar trebui găzduite local atunci când acest lucru este rezonabil.</p>"],
["8. Coduri de recomandare și stocarea locală","<p>Dacă un client accesează platforma printr-un cod de partener, codul poate fi păstrat local în browser pentru atribuirea ulterioară a rezervării. Această funcție nu trebuie utilizată pentru publicitate comportamentală. Mecanismul concret și durata păstrării trebuie documentate în politica de cookie-uri/tehnologii similare.</p>"],
["9. Marketing","<p>Mesajele de marketing nu sunt necesare pentru efectuarea unei rezervări. Dacă FiiViu introduce newslettere, reclame personalizate sau alte comunicări promoționale, acestea vor fi configurate separat, cu baza legală și mecanismul de retragere a consimțământului corespunzătoare.</p>"],
["10. Cookie-uri și tehnologii similare","<p>Site-ul trebuie să distingă tehnologiile strict necesare de cele opționale, cum ar fi analiza sau marketingul. Orice instrument de analiză, tracking sau publicitate introdus ulterior trebuie adăugat în politica de cookie-uri și în mecanismul de consimțământ înainte de activare, atunci când consimțământul este necesar.</p>"],
["11. Durata păstrării","<p>Datele sunt păstrate atât timp cât sunt necesare pentru rezervare, relația contractuală, obligațiile contabile/fiscale, apărarea drepturilor FiiViu și celelalte scopuri legitime. Perioadele exacte trebuie stabilite într-un tabel intern de retenție și aliniate cu obligațiile contabile și fiscale din România.</p>"],
["12. Drepturile persoanelor vizate","<p>În condițiile GDPR, persoanele vizate pot avea dreptul de acces, rectificare, ștergere, restricționare, portabilitate și opoziție, precum și dreptul de a retrage consimțământul atunci când prelucrarea se bazează pe consimțământ. Cererile se transmit la <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>.</p>"],
["13. Plângeri","<p>Persoana vizată poate formula o plângere către Autoritatea Națională de Supraveghere a Prelucrării Datelor cu Caracter Personal (ANSPDCP), dacă apreciază că prelucrarea datelor sale încalcă legislația aplicabilă.</p>"],
["14. Securitate","<p>FiiViu aplică măsuri tehnice și organizatorice adecvate pentru protejarea datelor, inclusiv controlul accesului, utilizarea conexiunilor securizate și limitarea datelor colectate la ceea ce este necesar pentru scopurile declarate.</p>"],
["15. Transferuri internaționale","<p>Unii furnizori tehnologici utilizați de platformă pot procesa date în afara României sau a Spațiului Economic European. Pentru fiecare furnizor activ, FiiViu va documenta mecanismul legal de transfer aplicabil, inclusiv eventualele Clauze Contractuale Standard sau alte garanții prevăzute de GDPR.</p>"],
["16. Datele societății și actualizarea politicii","<p>CUI, numărul Registrului Comerțului, adresa juridică completă și, dacă este cazul, datele DPO se completează pe baza documentelor oficiale ale societății. Politica poate fi actualizată atunci când se modifică serviciile, furnizorii sau modul de prelucrare a datelor.</p>"]
];
content.en.sections=[
["1. What data we process","<ul><li>first and last name;</li><li>email address;</li><li>booking data: experience, provider, date and time, number of participants, booking ID;</li><li>messages and notes submitted by the customer;</li><li>technical data required for website operation and security;</li><li>payment and refund data processed through the payment provider. FiiViu does not request or store the full card number or CVC;</li><li>a referral/partner code when used to attribute a booking.</li></ul>"],
["2. Purposes and legal bases","<p>Data may be processed for entering into and performing the booking, handling payments and refunds, communicating with customers, fraud prevention, platform security, compliance with legal obligations and handling complaints.</p><p>Legal bases may include Article 6(1)(b) GDPR for contract performance or pre-contractual steps, (c) for legal obligations and (f) for legitimate interests where the legal requirements are met. Consent is used only where it is required as a legal basis.</p>"],
["3. Stripe","<p>Online payments are processed through Stripe. Payment, transaction and technical data may be processed during payment. FiiViu does not store complete card details. Stripe's role may depend on the processing and Stripe service used. Stripe's relevant contractual documentation and privacy policy apply to its processing.</p>"],
["4. Cloudflare and application infrastructure","<p>The platform runs on Cloudflare infrastructure, including Cloudflare Workers and Cloudflare D1. Technical data and data required for operation may be processed to deliver, secure and operate the service. Booking data required to perform the service is stored in the application database, including Cloudflare D1.</p>"],
["5. Experience providers","<p>Because FiiViu acts as an intermediary, certain data required to perform the booking may be shared with the experience provider, such as name, number of participants, booking date and time and relevant notes. The provider may have its own information and data-protection obligations for processing it carries out independently.</p>"],
["6. Emails and service providers","<p>A specialized email delivery provider may be used for confirmations and operational communications. Data required to send the message may be transmitted to that provider. For each active provider, FiiViu documents the GDPR role, contractual basis, processing location, mechanism for any international transfers and relevant retention period.</p>"],
["7. External resources loaded in the browser","<p>The current interface may load third-party libraries and resources, including Stripe.js, Tailwind CSS, Font Awesome, Flatpickr and images hosted by Unsplash. Loading these resources may involve transmitting technical data such as an IP address to the resource provider. Before final launch, each external resource should be inventoried and assessed; resources that are not necessary should be hosted locally where reasonably possible.</p>"],
["8. Referral codes and local storage","<p>If a customer accesses the platform using a partner code, the code may be stored locally in the browser for later booking attribution. This function must not be used for behavioral advertising. The exact mechanism and retention period must be documented in the cookie/similar technologies policy.</p>"],
["9. Marketing","<p>Marketing messages are not required to make a booking. If FiiViu introduces newsletters, personalized advertising or other promotional communications, they will be configured separately with the appropriate legal basis and withdrawal mechanism.</p>"],
["10. Cookies and similar technologies","<p>The website must distinguish strictly necessary technologies from optional technologies such as analytics or marketing. Any analytics, tracking or advertising tool introduced later must be added to the cookie policy and consent mechanism before activation where consent is required.</p>"],
["11. Retention period","<p>Data is retained for as long as necessary for the booking, contractual relationship, accounting/tax obligations, protection of FiiViu's rights and other legitimate purposes. Exact periods must be established internally and aligned with Romanian accounting and tax obligations.</p>"],
["12. Data-subject rights","<p>Subject to GDPR conditions, data subjects may have rights of access, rectification, erasure, restriction, portability and objection, as well as the right to withdraw consent where processing is based on consent. Requests may be sent to <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>.</p>"],
["13. Complaints","<p>A data subject may lodge a complaint with the Romanian National Supervisory Authority for Personal Data Processing (ANSPDCP) if they believe processing of their data breaches applicable law.</p>"],
["14. Security","<p>FiiViu applies appropriate technical and organizational measures to protect data, including access controls, secure connections and limiting collected data to what is necessary for the stated purposes.</p>"],
["15. International transfers","<p>Some technology providers used by the platform may process data outside Romania or the European Economic Area. For each active provider, FiiViu will document the applicable legal transfer mechanism, including Standard Contractual Clauses or other safeguards provided by the GDPR where relevant.</p>"],
["16. Company details and policy updates","<p>The CUI, Trade Register number, full legal address and, where applicable, DPO details will be completed based on the company's official documents. This policy may be updated when services, providers or processing activities change.</p>"]
];
function setLanguage(lang){
const c=content[lang]||content.de;document.documentElement.lang=lang;document.title=c.title+" – FiiViu";
document.getElementById("legal-content").innerHTML="<a class='back' href='/?lang="+encodeURIComponent(lang)+"'>"+c.back+"</a><h1>"+c.title+"</h1><p>"+c.intro+"</p>"+c.sections.map(s=>"<h2>"+s[0]+"</h2>"+s[1]).join("")+"<p><small>"+c.updated+"</small></p>";
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));localStorage.setItem("fiiviu_language",lang);
}
const p=new URLSearchParams(location.search);setLanguage(p.get("lang")||localStorage.getItem("fiiviu_language")||"de");
</script></body></html>
