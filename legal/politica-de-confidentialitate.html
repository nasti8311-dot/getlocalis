<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiiViu – Datenschutz</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:950px;margin:0 auto;padding:32px 20px;line-height:1.65;color:#171717;background:#F8F6F1}main{background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 45px rgba(21,21,21,.08)}h1,h2{line-height:1.2}h2{margin-top:30px}a{color:#c9581d}.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:24px}.lang button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:700}.lang button.active{background:#151515;color:#fff}.back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:700}</style></head><body><div class="lang"><button data-lang="de" onclick="setLanguage('de')">DE</button><button data-lang="en" onclick="setLanguage('en')">EN</button><button data-lang="ro" onclick="setLanguage('ro')">RO</button></div><main id="legal-content"></main><script>
const content={
de:{title:"Datenschutzerklärung",back:"← Zurück zu FiiViu",intro:"FiiViu S.R.L. verarbeitet personenbezogene Daten im Zusammenhang mit der Plattform, soweit FiiViu die Zwecke und Mittel der jeweiligen Verarbeitung bestimmt. Bei bestimmten Verarbeitungen können externe Anbieter oder Erlebnisanbieter eigenständige Verantwortliche sein.",sections:[
["1. Verantwortlicher","FiiViu S.R.L., București, Rumänien, E-Mail: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. Die vollständige juristische Anschrift, CUI und Handelsregisternummer werden vor dem öffentlichen Launch anhand der offiziellen Unternehmensunterlagen ergänzt."],
["2. Welche Daten verarbeitet werden","Je nach Nutzung können Name, E-Mail-Adresse, Telefonnummer, Teilnehmerzahl, Buchungsdatum und -zeit, Erlebnis, Anbieter, Buchungs-ID, Treffpunkt, Nachrichten/Anmerkungen, technische Sicherheitsdaten, Zahlungs-/Erstattungsinformationen und ein Partner-/Empfehlungscode verarbeitet werden. Vollständige Kartennummern und CVC werden nicht von FiiViu gespeichert."],
["3. Zwecke und Rechtsgrundlagen","Daten werden insbesondere für vorvertragliche Maßnahmen und Vertragsdurchführung, Buchungs- und Zahlungsabwicklung, Kommunikation, Erstattungen, Betrugs- und Missbrauchsprävention, IT-Sicherheit, gesetzliche Aufbewahrungs- und Nachweispflichten sowie die Bearbeitung von Beschwerden verarbeitet. Rechtsgrundlagen sind je nach Vorgang Art. 6 Abs. 1 lit. b, c oder f DSGVO; Einwilligung nach lit. a wird eingesetzt, wenn sie erforderlich ist."],
["4. Erlebnisanbieter","Für die Durchführung einer Buchung werden die dafür erforderlichen Daten an den konkreten Anbieter übermittelt, etwa Name, Teilnehmerzahl, Datum/Uhrzeit und relevante Hinweise. Der Anbieter kann für eigene Zwecke eigenständiger Verantwortlicher sein und muss seine eigenen Datenschutzpflichten erfüllen."],
["5. Stripe","Zahlungen werden über Stripe verarbeitet. Stripe kann Zahlungs-, Transaktions-, Geräte- und Betrugspräventionsdaten nach seinen eigenen Bedingungen verarbeiten. FiiViu speichert keine vollständigen Kartendaten. Weitere Informationen sind in den jeweils geltenden Stripe-Datenschutzinformationen enthalten."],
["6. Cloudflare und Infrastruktur","Die Plattform verwendet Cloudflare Workers und Cloudflare D1 für Hosting/Anwendungslogik, Datenbank und Sicherheitsfunktionen. Für den Betrieb können technische Daten und Buchungsdaten verarbeitet und gespeichert werden."],
["7. E-Mail-Dienstleister","Für operative E-Mails können Resend und/oder EmailJS eingesetzt werden. Nur für den Versand erforderliche Daten, insbesondere E-Mail-Adresse und Nachrichtendaten, werden an den jeweils aktiv eingesetzten Dienst übermittelt. Die konkrete Anbieter- und Transferdokumentation ist intern zu führen."],
["8. Partner-Attribution","Ein Partnercode kann zur Zuordnung einer Buchung zu einem Partner verarbeitet werden. Der Referral-Code wird aktuell nur temporär aus der URL übernommen und nicht dauerhaft im Browser gespeichert. Die Zuordnung dient der Abrechnung der Partnerprovision und wird nicht für verhaltensbezogene Werbung verwendet."],
["9. Externe Browser-Ressourcen","Die Website kann Stripe.js, Frontend-Bibliotheken und externe Bild-/Ressourcenanbieter verwenden. Nicht erforderliche externe Ressourcen dürfen nur in einer Weise eingesetzt werden, die die anwendbaren Datenschutz- und ePrivacy-Anforderungen erfüllt. Wo technisch sinnvoll, werden nicht erforderliche Ressourcen lokal bereitgestellt."],
["10. Speicherdauer","Buchungs-, Zahlungs- und Rechnungs-/Nachweisdaten werden nur so lange aufbewahrt, wie dies für Vertragsabwicklung, gesetzliche Pflichten, Verjährungsfristen und die Wahrung berechtigter Interessen erforderlich ist. Konkrete Aufbewahrungsfristen werden intern nach Datenkategorie festgelegt."],
["11. Rechte betroffener Personen","Betroffene Personen können nach den gesetzlichen Voraussetzungen Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch verlangen sowie eine Einwilligung jederzeit mit Wirkung für die Zukunft widerrufen. Anfragen: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>."],
["12. Beschwerden","Eine Beschwerde kann bei der zuständigen Datenschutzaufsichtsbehörde, in Rumänien insbesondere bei der ANSPDCP, eingereicht werden."],
["13. Internationale Übermittlungen","Wenn ein Dienstleister Daten außerhalb des EWR verarbeitet, wird der nach DSGVO erforderliche Transfermechanismus eingesetzt, beispielsweise ein Angemessenheitsbeschluss oder geeignete Garantien wie Standardvertragsklauseln, soweit erforderlich."],
["14. Sicherheit","FiiViu verwendet angemessene technische und organisatorische Maßnahmen, darunter verschlüsselte Übertragung, Zugriffskontrollen, Sitzungs- und Authentifizierungsschutz sowie Beschränkung des Datenzugriffs auf erforderliche Funktionen."],
["15. Änderungen","Diese Datenschutzerklärung wird angepasst, wenn sich Verarbeitungsvorgänge, Dienstleister oder gesetzliche Anforderungen wesentlich ändern. Die jeweils aktuelle Fassung wird auf der Website veröffentlicht."]],updated:"Letzte Aktualisierung: 26. September 2026."},
en:{title:"Privacy Policy",back:"← Back to FiiViu",intro:"FiiViu S.R.L. processes personal data in connection with the platform where FiiViu determines the purposes and means of the relevant processing. Certain processing may be carried out by independent controllers such as experience providers.",sections:[],updated:"Last updated: 26 September 2026."},
ro:{title:"Politica de confidențialitate",back:"← Înapoi la FiiViu",intro:"FiiViu S.R.L. prelucrează date cu caracter personal în legătură cu platforma în măsura în care stabilește scopurile și mijloacele prelucrării respective. Unele prelucrări pot fi efectuate de operatori independenți, precum furnizorii experiențelor.",sections:[],updated:"Ultima actualizare: 26 septembrie 2026."}};
content.en.sections=[
["1. Controller","FiiViu S.R.L., Bucharest, Romania, email: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. The full legal address, CUI and Trade Register number will be completed from official company documents before public launch."],
["2. Data processed","Depending on use, FiiViu may process name, email, phone number, participant number, booking date/time, experience, provider, booking ID, meeting point, messages/notes, technical security data, payment/refund information and a partner/referral code. FiiViu does not store full card numbers or CVC."],
["3. Purposes and legal bases","Data may be processed for pre-contractual steps and contract performance, booking and payment handling, communications, refunds, fraud/abuse prevention, IT security, legal retention/evidence duties and complaints. Depending on the activity, the legal basis may be Article 6(1)(b), (c) or (f) GDPR; consent under (a) is used where required."],
["4. Experience providers","Data necessary to perform a booking is shared with the relevant provider, such as name, participant number, date/time and relevant notes. The provider may be an independent controller for its own processing and must meet its own data-protection duties."],
["5. Stripe","Payments are processed through Stripe. Stripe may process payment, transaction, device and fraud-prevention data under its applicable terms. FiiViu does not store full card data."],
["6. Cloudflare and infrastructure","The platform uses Cloudflare Workers and Cloudflare D1 for application infrastructure, database and security functions. Technical and booking data may be processed and stored as required to operate the service."],
["7. Email providers","Operational emails may use Resend and/or EmailJS. Only data needed for delivery, particularly email address and message content, is transmitted to the provider actually used. Vendor and transfer documentation is maintained internally."],
["8. Partner attribution","A partner code may be processed to attribute a booking to a partner. The referral code is currently read temporarily from the URL and is not persistently stored in the browser. Attribution is used for partner commission accounting and not for behavioral advertising."],
["9. External browser resources","The website may use Stripe.js, frontend libraries and external image/resource providers. Non-essential external resources must only be used in a manner consistent with applicable data-protection and ePrivacy requirements; where reasonably possible, non-essential resources are hosted locally."],
["10. Retention","Booking, payment and accounting/evidence data is retained only as long as necessary for contract performance, legal duties, limitation periods and legitimate interests. Exact retention periods are maintained internally by data category."],
["11. Rights","Subject to GDPR conditions, data subjects may request access, rectification, erasure, restriction, portability and objection, and may withdraw consent for future processing where consent is the legal basis. Requests: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>."],
["12. Complaints","A complaint may be lodged with the competent supervisory authority, in Romania in particular ANSPDCP."],
["13. International transfers","Where a provider processes data outside the EEA, the GDPR-required transfer mechanism is used, such as an adequacy decision or appropriate safeguards including Standard Contractual Clauses where required."],
["14. Security","FiiViu applies appropriate technical and organisational measures, including encrypted transmission, access controls, session/authentication protection and least-privilege access."],
["15. Changes","This policy is updated when processing activities, providers or legal requirements materially change. The current version is published on the website."]];
content.ro.sections=[
["1. Operatorul","FiiViu S.R.L., București, România, e-mail: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. Adresa juridică completă, CUI și numărul Registrului Comerțului vor fi completate pe baza documentelor oficiale înainte de lansarea publică."],
["2. Date prelucrate","În funcție de utilizare, FiiViu poate prelucra nume, e-mail, număr de telefon, numărul participanților, data/ora rezervării, experiența, furnizorul, ID-ul rezervării, locul întâlnirii, mesaje/observații, date tehnice de securitate, informații privind plata/rambursarea și un cod de partener/recomandare. FiiViu nu stochează numere complete de card sau CVC."],
["3. Scopuri și temeiuri","Datele pot fi prelucrate pentru demersuri precontractuale și executarea contractului, rezervări și plăți, comunicare, rambursări, prevenirea fraudei/abuzului, securitate IT, obligații legale de păstrare/probă și reclamații. În funcție de activitate, temeiul poate fi art. 6 alin. (1) lit. b), c) sau f) GDPR; consimțământul de la lit. a) este utilizat atunci când este necesar."],
["4. Furnizorii experiențelor","Datele necesare executării rezervării sunt comunicate furnizorului relevant, de exemplu numele, numărul participanților, data/ora și observațiile relevante. Furnizorul poate fi operator independent pentru propriile prelucrări și are propriile obligații de protecție a datelor."],
["5. Stripe","Plățile sunt procesate prin Stripe. Stripe poate prelucra date privind plata, tranzacția, dispozitivul și prevenirea fraudei conform condițiilor sale aplicabile. FiiViu nu stochează date complete ale cardului."],
["6. Cloudflare și infrastructura","Platforma utilizează Cloudflare Workers și Cloudflare D1 pentru infrastructură, baza de date și funcții de securitate. Datele tehnice și datele de rezervare pot fi prelucrate și stocate în măsura necesară operării serviciului."],
["7. Furnizori de e-mail","E-mailurile operaționale pot fi transmise prin Resend și/sau EmailJS. Sunt transmise furnizorului efectiv utilizat doar datele necesare livrării, în special adresa de e-mail și conținutul mesajului. Documentația internă privind furnizorii și transferurile este menținută de FiiViu."],
["8. Atribuirea partenerilor","Un cod de partener poate fi prelucrat pentru atribuirea unei rezervări unui partener. Codul de recomandare este preluat temporar din URL și nu este stocat persistent în browser. Atribuirea este utilizată pentru calculul comisionului partenerului și nu pentru publicitate comportamentală."],
["9. Resurse externe","Site-ul poate utiliza Stripe.js, biblioteci frontend și furnizori externi de imagini/resurse. Resursele care nu sunt necesare trebuie utilizate numai într-un mod compatibil cu cerințele de protecție a datelor și ePrivacy; atunci când este rezonabil, resursele neesențiale sunt găzduite local."],
["10. Păstrarea datelor","Datele privind rezervările, plățile și evidențele contabile/probatorii sunt păstrate numai atât cât este necesar pentru executarea contractului, obligații legale, termene de prescripție și interese legitime. Perioadele exacte sunt stabilite intern pe categorii de date."],
["11. Drepturile persoanelor vizate","În condițiile GDPR, persoanele vizate pot solicita acces, rectificare, ștergere, restricționare, portabilitate și opoziție și pot retrage consimțământul pentru viitor atunci când acesta este temeiul legal. Solicitări: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>."],
["12. Plângeri","O plângere poate fi depusă la autoritatea de supraveghere competentă, în România în special ANSPDCP."],
["13. Transferuri internaționale","Atunci când un furnizor prelucrează date în afara SEE, se utilizează mecanismul de transfer cerut de GDPR, precum o decizie de adecvare sau garanții adecvate, inclusiv Clauze Contractuale Standard atunci când este necesar."],
["14. Securitate","FiiViu aplică măsuri tehnice și organizatorice adecvate, inclusiv transmitere criptată, controale de acces, protecția sesiunilor/autentificării și acces limitat la ceea ce este necesar."],
["15. Modificări","Politica este actualizată atunci când activitățile de prelucrare, furnizorii sau cerințele legale se modifică în mod relevant. Versiunea actuală este publicată pe site."]];
function setLanguage(lang){const c=content[lang]||content.de;document.documentElement.lang=lang;document.title=c.title+" – FiiViu";document.getElementById("legal-content").innerHTML="<a class='back' href='/?lang="+encodeURIComponent(lang)+"'>"+c.back+"</a><h1>"+c.title+"</h1><p>"+c.intro+"</p>"+c.sections.map(s=>"<h2>"+s[0]+"</h2><p>"+s[1]+"</p>").join("")+"<p><small>"+c.updated+"</small></p>";document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang))}const p=new URLSearchParams(location.search);setLanguage(p.get("lang")||"de");</script></body></html>
