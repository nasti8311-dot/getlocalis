de:{
title:"Affiliate-Partnervertrag",back:"← Zurück zum Affiliate-Programm",intro:"Dieser Vertrag regelt die Teilnahme am Empfehlungsprogramm von FiiViu. Er gilt zwischen dem Betreiber der Plattform FiiViu und der Person bzw. dem Unternehmen, dessen Partnerantrag von FiiViu angenommen wurde.",
notice:"Wichtig: Das Absenden des Partnerantrags ist noch keine Annahme durch FiiViu. Der Vertrag wird erst wirksam, wenn FiiViu den Antrag bestätigt und den Partnerzugang aktiviert. Zwingende gesetzliche Rechte bleiben unberührt.",
sections:[
["1. Vertragsparteien und Rolle","Plattformbetreiber ist FiiViu. Die vollständigen Unternehmensangaben werden vor der endgültigen Vertragsfreigabe anhand der offiziellen Unterlagen ergänzt (siehe Abschnitt 13). Der Affiliate-Partner handelt selbstständig und auf eigene Rechnung. Er ist weder Arbeitnehmer noch Handelsvertreter oder Bevollmächtigter von FiiViu und darf FiiViu nicht rechtsgeschäftlich verpflichten."],
["2. Gegenstand des Programms","FiiViu stellt dem angenommenen Partner einen persönlichen Partner-Code sowie einen Empfehlungslink und QR-Code zur Verfügung. Der Partner kann diese nutzen, um Interessenten auf Erlebnisse und Angebote auf fiiviu.ro aufmerksam zu machen. FiiViu entscheidet über die Annahme eines Antrags und die Aktivierung oder Deaktivierung eines Partnerkontos."],
["3. Provision und Berechnungsgrundlage","Der Partner erhält eine Provision von 5 % des Netto-Buchungswerts für jede qualifizierte, erfolgreich bezahlte Buchung, die im Checkout mit seinem gültigen Partner-Code erfasst wurde. Berechnungsgrundlage ist der gesamte Buchungspreis, nicht nur die von FiiViu online eingezogene 20-%-Anzahlung. Erstattete Beträge werden abgezogen; bei Teilerstattungen wird die Provision anteilig reduziert. Für bloße Klicks, QR-Aufrufe, Anfragen oder nicht erfolgreich bezahlte Buchungen entsteht keine Provision."],
["4. Wann eine Buchung zugeordnet wird","Eine Buchung wird dem Partner nur zugeordnet, wenn sein gültiger Partner-Code beim Checkout übermittelt, von FiiViu geprüft und in der Zahlung gespeichert wird. Ein Scan oder Aufruf des QR-Codes allein begründet keinen Provisionsanspruch. Der Code muss beim Buchungsabschluss noch vorhanden sein. Eine dauerhafte Cookie-Zuordnung, geräteübergreifende Zuordnung oder ein bestimmtes Attributionszeitfenster wird nicht zugesichert. Wird der Code entfernt, nicht übertragen oder durch einen anderen Code ersetzt, kann die Buchung nicht dem Partner gutgeschrieben werden."],
["5. Entstehung und Verfügbarkeit der Provision","Die Provision wird nach erfolgreicher Zahlung der Buchung erfasst. Zum Schutz vor Stornierungen und Rückerstattungen wird sie grundsätzlich erst 14 Tage nach dem geplanten Erlebnisdatum zur Auszahlung verfügbar. Die technische Haltefrist kann von FiiViu konfiguriert werden; maßgeblich ist die im Partner-Dashboard angezeigte Verfügbarkeit. Ist ein Buchungsdatum nicht korrekt hinterlegt, kann die Provision bis zur Klärung zurückgestellt bleiben."],
["6. Stornierungen, Rückerstattungen und No-Shows","Die Provision richtet sich nach dem tatsächlich nicht erstatteten Buchungswert. Bei vollständiger Rückerstattung entfällt die Provision; bei teilweiser Rückerstattung wird sie anteilig gekürzt. Wird eine Rückerstattung erst nach einer bereits erfolgten Auszahlung verbucht, kann ein negativer Provisionssaldo entstehen. FiiViu darf diesen mit künftigen Provisionen verrechnen. Bleibt die Zahlung erfolgreich und wird keine Rückerstattung ausgeführt, bleibt die Buchung nach der aktuellen technischen Abrechnung grundsätzlich provisionsrelevant – auch wenn der Kunde später nicht erscheint oder eine Stornierung ohne Rückzahlung erfolgt."],
["7. Auszahlung","Die Auszahlung erfolgt nicht automatisch durch das Partner-Dashboard. Nach Ablauf der Haltefrist prüft FiiViu den verfügbaren Saldo und veranlasst die Auszahlung manuell auf Grundlage der vom Partner separat mitgeteilten, gültigen Zahlungsdaten. Auszahlungstermine, Zahlungsweg und gegebenenfalls erforderliche Rechnungs- oder Steuerangaben werden mit dem Partner abgestimmt. Es wird keine feste Bearbeitungsfrist zugesichert. Bereits ausgezahlte Beträge werden im Dashboard als bezahlt ausgewiesen."],
["8. Kosten und Werbematerial","Die Teilnahme am Affiliate-Programm, der Partnerzugang sowie die im Programm angebotenen QR-Tischaufsteller im Format 10 × 15 cm sind nach dem derzeitigen Programm kostenlos. Es fallen keine Registrierungs-, Einrichtungs- oder monatlichen Teilnahmegebühren an. Der Partner ist für seine eigenen Marketing- und Betriebskosten verantwortlich, sofern FiiViu diese nicht ausdrücklich schriftlich übernimmt."],
["9. Pflichten des Partners","Der Partner stellt FiiViu und die Angebote wahrheitsgemäß dar, verwendet nur freigegebene Links, QR-Codes und Werbemittel und hält geltendes Wettbewerbs-, Werbe-, Verbraucher- und Datenschutzrecht ein. Unzulässig sind insbesondere irreführende Provisionsversprechen, Spam, unerlaubte Massenwerbung, künstliche Klicks, Selbstempfehlungen zur Provisionsgenerierung sowie Manipulationen der Zuordnung. Der Partner darf keine Buchungen im Namen von Kunden ohne deren Zustimmung vornehmen."],
["10. Marke, Werbemittel und Inhalte","FiiViu gewährt dem Partner für die Vertragsdauer ein einfaches, widerrufliches und nicht übertragbares Recht, den Namen, das Logo und die bereitgestellten Werbemittel ausschließlich zur Bewerbung des FiiViu-Angebots zu verwenden. Änderungen an Logos oder Werbemitteln sowie Aussagen, die über freigegebene Informationen hinausgehen, bedürfen der vorherigen Zustimmung von FiiViu."],
["11. Dashboard und Daten","Der Partner erhält nach Annahme des Antrags einen persönlichen Zugang zum Partner-Dashboard. Dort kann er insbesondere Partner-Link und QR-Code, erfasste Buchungen, Buchungswerte sowie offene, wartende und bereits ausgezahlte Provisionen einsehen. Die angezeigten Informationen hängen von der korrekten Erfassung des Partner-Codes ab. Der Partner erhält keinen allgemeinen Zugriff auf Kundendaten oder Zahlungsdaten."],
["12. Laufzeit, Sperrung und Beendigung","Der Vertrag beginnt mit der Bestätigung und Aktivierung durch FiiViu und läuft auf unbestimmte Zeit. Beide Parteien können ihn mit angemessener Frist in Textform beenden. FiiViu kann den Zugang bei Betrugsverdacht, Manipulation, Rechtsverstößen, Sicherheitsrisiken oder erheblichen Vertragsverletzungen vorläufig sperren oder außerordentlich beenden. Bis zum Beendigungszeitpunkt ordnungsgemäß entstandene Provisionen werden nach den Regeln dieses Vertrags abgerechnet; Rückerstattungen und negative Salden bleiben vorbehalten."],
["13. Unternehmensangaben des Plattformbetreibers","Vollständiger Firmenname: ____________________<br>CUI: ____________________<br>Handelsregisternummer: ____________________<br>Vollständige Geschäftsadresse: ____________________<br>USt-ID (falls vorhanden): ____________________<br>Diese Angaben werden vor der endgültigen rechtlichen Freigabe anhand der offiziellen Unternehmensunterlagen ergänzt."],
["14. Schlussbestimmungen","Änderungen und Ergänzungen bedürfen der Textform. FiiViu informiert den Partner über wesentliche Änderungen; soweit eine erneute Zustimmung erforderlich ist, wird diese ausdrücklich eingeholt. Es gilt rumänisches Recht, soweit zwingendes Recht nichts anderes bestimmt. Gerichtsstände und zwingende Verbraucher- oder Unternehmerschutzrechte richten sich nach den gesetzlichen Vorgaben."]
],

en:{
title:"Affiliate Partner Agreement",back:"← Back to the affiliate programme",intro:"This agreement governs participation in the FiiViu referral programme. It is between the operator of the FiiViu platform and the individual or business whose partner application has been accepted by FiiViu.",
notice:"Important: Submitting an application does not itself mean that FiiViu has accepted it. The agreement becomes effective only when FiiViu confirms the application and activates the partner account. Mandatory statutory rights remain unaffected.",
sections:[
["1. Parties and status","The platform operator is FiiViu. Its complete legal company details will be added from official records before final legal approval (see section 13). The affiliate acts independently and on its own account. The affiliate is not an employee, commercial agent or authorised representative of FiiViu and may not legally bind FiiViu."],
["2. Programme scope","FiiViu provides an accepted partner with a personal partner code, referral link and QR code. The partner may use them to refer interested customers to experiences and offers on fiiviu.ro. FiiViu decides whether to accept an application and activate or deactivate a partner account."],
["3. Commission and calculation","The partner earns a 5% commission on the net booking value of each qualifying, successfully paid booking recorded at checkout with the partner's valid code. The calculation is based on the full booking price, not only the 20% online deposit collected by FiiViu. Refunded amounts are deducted; partial refunds reduce the commission proportionally. No commission is earned for clicks, QR scans, enquiries or bookings that are not successfully paid."],
["4. Referral attribution","A booking is attributed to the partner only if the valid partner code is submitted at checkout, validated by FiiViu and stored with the payment. A QR scan or link visit alone does not create a commission entitlement. The code must still be present when the booking is completed. No permanent cookie attribution, cross-device attribution or fixed attribution window is promised. If the code is removed, not passed through or replaced by another code, the booking may not be credited to the partner."],
["5. Earning and availability of commission","Commission is recorded after successful payment of the booking. To allow for cancellations and refunds, it normally becomes available for payout only 14 days after the scheduled experience date. FiiViu may configure the technical holding period; the availability shown in the partner dashboard is authoritative. If a booking date is missing or invalid, commission may remain pending until clarified."],
["6. Cancellations, refunds and no-shows","Commission is calculated on the booking value that has not actually been refunded. A full refund removes the commission; a partial refund reduces it proportionally. If a refund is recorded after commission has already been paid, a negative commission balance may arise. FiiViu may offset that balance against future commissions. If payment remains successful and no refund is issued, the booking generally remains commission-eligible under the current calculation, even if the customer later does not attend or cancels without receiving a refund."],
["7. Payouts","Payouts are not made automatically by the partner dashboard. After the holding period, FiiViu reviews the available balance and arranges payment manually using valid payment details supplied separately by the partner. Payout dates, payment method and any required invoice or tax information are agreed with the partner. No fixed processing deadline is promised. Paid amounts are shown as paid in the dashboard."],
["8. Fees and promotional materials","Under the current programme, participation, the partner account and the QR table stands offered by the programme (10 × 15 cm) are free of charge. There are no registration, setup or monthly participation fees. The partner bears its own marketing and operating costs unless FiiViu expressly agrees otherwise in writing."],
["9. Partner obligations","The partner must represent FiiViu and its offers truthfully, use only approved links, QR codes and promotional materials, and comply with applicable advertising, competition, consumer and data protection laws. Misleading commission claims, spam, unsolicited bulk marketing, artificial clicks, self-referrals intended to generate commission and attribution manipulation are prohibited. The partner must not make bookings on behalf of customers without their consent."],
["10. Brand, materials and content","For the term of this agreement, FiiViu grants the partner a limited, revocable and non-transferable right to use the FiiViu name, logo and supplied promotional materials solely to promote FiiViu. Changes to logos or materials and claims beyond approved information require FiiViu's prior consent."],
["11. Dashboard and data","After acceptance, the partner receives personal access to the partner dashboard. It can show the partner link and QR code, recorded bookings, booking values and pending, available and paid commissions. The information depends on correct recording of the partner code. The partner does not receive general access to customer personal data or payment details."],
["12. Term, suspension and termination","The agreement starts when FiiViu confirms the application and activates the account and continues until terminated. Either party may terminate it on reasonable notice in text form. FiiViu may temporarily suspend access or terminate immediately in cases of suspected fraud, manipulation, legal violations, security risks or material breach. Properly accrued commissions up to termination will be settled under this agreement, subject to refunds and negative balances."],
["13. Platform operator details","Full legal company name: ____________________<br>CUI: ____________________<br>Trade Register number: ____________________<br>Full registered business address: ____________________<br>VAT ID (if applicable): ____________________<br>These details will be completed from official company documents before final legal approval."],
["14. Final provisions","Amendments must be made in text form. FiiViu will notify the partner of material changes; where renewed consent is required, it will be obtained expressly. Romanian law applies unless mandatory law provides otherwise. Jurisdiction and mandatory legal protections are determined by applicable law."]
],

ro:{
title:"Contract de parteneriat afiliat",back:"← Înapoi la programul de afiliere",intro:"Prezentul contract reglementează participarea la programul de recomandare FiiViu. Contractul se încheie între operatorul platformei FiiViu și persoana fizică sau juridică a cărei solicitare de parteneriat a fost acceptată de FiiViu.",
notice:"Important: Trimiterea solicitării nu înseamnă automat acceptarea acesteia de către FiiViu. Contractul intră în vigoare numai după confirmarea solicitării de către FiiViu și activarea contului de partener. Drepturile legale obligatorii rămân neafectate.",
sections:[
["1. Părțile și statutul partenerului","Operatorul platformei este FiiViu. Datele complete de identificare ale societății vor fi completate pe baza documentelor oficiale înainte de aprobarea juridică finală (a se vedea secțiunea 13). Partenerul afiliat acționează independent și pe cont propriu. Acesta nu este angajat, agent comercial sau reprezentant autorizat al FiiViu și nu poate angaja juridic FiiViu."],
["2. Obiectul programului","FiiViu pune la dispoziția partenerului acceptat un cod personal, un link de recomandare și un cod QR. Partenerul le poate folosi pentru a îndruma persoanele interesate către experiențele și ofertele de pe fiiviu.ro. FiiViu decide acceptarea solicitării și activarea sau dezactivarea contului de partener."],
["3. Comisionul și baza de calcul","Partenerul primește un comision de 5% din valoarea netă a rezervării pentru fiecare rezervare eligibilă, plătită cu succes și înregistrată la finalizarea comenzii cu codul valid al partenerului. Calculul se face la valoarea totală a rezervării, nu doar la avansul online de 20% încasat de FiiViu. Sumele rambursate se scad; rambursările parțiale reduc comisionul proporțional. Nu se acordă comision pentru simple accesări, scanări QR, solicitări sau rezervări care nu au fost plătite cu succes."],
["4. Atribuirea recomandării","O rezervare este atribuită partenerului numai dacă acel cod valid este transmis la finalizarea comenzii, verificat de FiiViu și salvat împreună cu plata. Simpla scanare a codului QR sau accesarea linkului nu creează dreptul la comision. Codul trebuie să fie prezent la finalizarea rezervării. Nu se garantează atribuirea permanentă prin cookie, atribuirea între dispozitive sau o anumită perioadă de atribuire. Dacă utilizatorul elimină codul, acesta nu este transmis sau este înlocuit cu alt cod, rezervarea poate să nu fie atribuită partenerului."],
["5. Dobândirea și disponibilitatea comisionului","Comisionul este înregistrat după plata cu succes a rezervării. Pentru a permite gestionarea anulărilor și rambursărilor, comisionul devine, în mod normal, disponibil pentru plată numai după 14 zile de la data programată a experienței. FiiViu poate configura perioada tehnică de reținere; disponibilitatea afișată în panoul partenerului este cea relevantă. Dacă data rezervării lipsește sau este incorectă, comisionul poate rămâne în așteptare până la clarificare."],
["6. Anulări, rambursări și neprezentare","Comisionul se calculează la valoarea rezervării care nu a fost efectiv rambursată. Rambursarea integrală elimină comisionul; rambursarea parțială îl reduce proporțional. Dacă o rambursare este înregistrată după ce comisionul a fost deja plătit, poate apărea un sold negativ al comisionului. FiiViu poate compensa acest sold din comisioanele viitoare. Dacă plata rămâne reușită și nu se efectuează nicio rambursare, rezervarea rămâne, în general, eligibilă pentru comision potrivit calculului tehnic actual, chiar dacă ulterior clientul nu se prezintă sau anulează fără rambursare."],
["7. Plăți","Plățile nu sunt efectuate automat prin panoul partenerului. După expirarea perioadei de reținere, FiiViu verifică soldul disponibil și efectuează plata manual, folosind datele de plată valide comunicate separat de partener. Data plății, metoda de plată și eventualele documente fiscale sau facturi necesare se stabilesc împreună cu partenerul. Nu este promis un termen fix de procesare. Sumele plătite sunt afișate ca achitate în panoul partenerului."],
["8. Costuri și materiale promoționale","În cadrul programului actual, participarea, contul de partener și suporturile de masă cu cod QR oferite prin program (10 × 15 cm) sunt gratuite. Nu există taxe de înregistrare, configurare sau taxe lunare de participare. Partenerul își suportă propriile costuri de marketing și operare, cu excepția cazului în care FiiViu acceptă în mod expres altfel, în scris."],
["9. Obligațiile partenerului","Partenerul trebuie să prezinte în mod corect FiiViu și ofertele sale, să utilizeze numai linkuri, coduri QR și materiale aprobate și să respecte legislația aplicabilă privind publicitatea, concurența, protecția consumatorilor și protecția datelor. Sunt interzise afirmațiile înșelătoare despre comisioane, spamul, publicitatea în masă nesolicitată, accesările artificiale, recomandările proprii făcute pentru generarea de comisioane și manipularea atribuirii. Partenerul nu poate efectua rezervări în numele clienților fără acordul acestora."],
["10. Marcă, materiale și conținut","Pe durata contractului, FiiViu acordă partenerului un drept limitat, revocabil și netransmisibil de a utiliza numele, sigla și materialele promoționale furnizate de FiiViu exclusiv pentru promovarea platformei. Modificarea siglelor sau a materialelor și afirmațiile care depășesc informațiile aprobate necesită acordul prealabil al FiiViu."],
["11. Panoul partenerului și datele","După acceptarea solicitării, partenerul primește acces personal la panoul de partener. Acesta poate afișa linkul și codul QR, rezervările înregistrate, valorile rezervărilor și comisioanele în așteptare, disponibile sau deja plătite. Informațiile depind de înregistrarea corectă a codului partenerului. Partenerul nu primește acces general la datele personale ale clienților sau la datele de plată."],
["12. Durată, suspendare și încetare","Contractul începe când FiiViu confirmă solicitarea și activează contul și este încheiat pe durată nedeterminată. Oricare parte îl poate înceta cu un preaviz rezonabil, în formă text. FiiViu poate suspenda temporar accesul sau poate înceta imediat contractul în caz de suspiciune de fraudă, manipulare, încălcări legale, riscuri de securitate sau încălcări contractuale grave. Comisioanele acumulate în mod corect până la încetare se decontează conform prezentului contract, sub rezerva rambursărilor și a soldurilor negative."],
["13. Datele operatorului platformei","Denumirea completă a societății: ____________________<br>CUI: ____________________<br>Numărul de înregistrare la Registrul Comerțului: ____________________<br>Adresa completă a sediului social: ____________________<br>Cod de TVA (dacă există): ____________________<br>Aceste date vor fi completate pe baza documentelor oficiale ale societății înainte de aprobarea juridică finală."],
["14. Dispoziții finale","Modificările și completările se fac în formă text. FiiViu va informa partenerul cu privire la modificările importante; atunci când este necesar un nou acord, acesta va fi solicitat în mod expres. Se aplică legea română, cu excepția cazului în care dispozițiile legale imperative prevăd altfel. Competența instanțelor și protecțiile legale obligatorii se stabilesc potrivit legii aplicabile."]
],
updated:"Versiune: 7 noiembrie 2026"
}

let lang=new URLSearchParams(location.search).get("lang")||"ro";if(!content[lang])lang="ro";
const root=document.getElementById("content");
function render(){const c=content[lang];root.innerHTML='<nav class="lang" aria-label="Language"><button data-lang="de" class="'+(lang==="de"?"active":"")+'">DE</button><button data-lang="en" class="'+(lang==="en"?"active":"")+'">EN</button><button data-lang="ro" class="'+(lang==="ro"?"active":"")+'">RO</button></nav><a class="back" href="/partner-werden.html?lang='+lang+'">'+c.back+'</a><h1>'+c.title+'</h1><p>'+c.intro+'</p><div class="notice">'+c.notice+'</div>'+c.sections.map(x=>'<section><h2>'+x[0]+'</h2><p>'+x[1]+'</p></section>').join('')+'<p class="muted">'+c.updated+'</p>';}
root.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;history.replaceState(null,"","?lang="+lang);render();});
render();
</script>
