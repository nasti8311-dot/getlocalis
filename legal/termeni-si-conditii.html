de:{title:"AGB & Buchungsbedingungen",back:"← Zurück zu FiiViu",intro:"FiiViu S.R.L., București, Rumänien, E-Mail: info@fiiviu.ro.",important:"Wichtig: FiiViu handelt als Vermittler für die auf der Plattform dargestellten Leistungen. Der in der konkreten Anzeige genannte Anbieter ist für die Durchführung der gebuchten Leistung verantwortlich. Soweit die Anzeige oder zwingendes Recht etwas anderes bestimmt, gehen diese Bedingungen vor.",sections:[
["1. Geltungsbereich","Diese Bedingungen gelten für die Nutzung der FiiViu-Plattform und für Online-Buchungen durch Verbraucher. FiiViu erbringt die gebuchte Leistung grundsätzlich nicht im eigenen Namen, sofern die Anzeige nicht ausdrücklich etwas anderes bestimmt."],
["2. Rolle von FiiViu","FiiViu erleichtert die Suche, Buchung und Zahlung für Leistungen unabhängiger Anbieter. Der Anbieter ist im Rahmen des geltenden Rechts und der dem Kunden bereitgestellten Informationen für Verfügbarkeit, Teilnahmebedingungen, Betriebssicherheit und tatsächliche Durchführung der Leistung verantwortlich.<br><br>Mit einer Buchung begründet der Kunde, soweit die Anzeige kein anderes Vertragsmodell vorsieht, das Vertragsverhältnis über die konkrete Leistung mit dem in der Anzeige genannten Anbieter."],
["3. Angebotene Leistungen","In der aktuellen Version bietet FiiViu unter anderem Stadttouren, Fahrraderlebnisse, Wellness, Abendaktivitäten, Karting und Limousinenerlebnisse zur Buchung an. Das Angebot kann jederzeit geändert oder erweitert werden.<br><br>Eine FiiViu-Buchung betrifft grundsätzlich ein einzelnes Erlebnis bzw. eine einzelne Leistung eines einzelnen Anbieters, sofern die Anzeige nicht ausdrücklich etwas anderes vorsieht. Die Plattform stellt nicht automatisch kombinierte Pauschalreisen dar."],
["4. Informationen zum Erlebnis","Vor der Zahlung müssen mindestens die Leistung, der Anbieter, das Datum bzw. der Zeitraum, die Uhrzeit, die Teilnehmerzahl, der Gesamtpreis und die besonderen Stornobedingungen einsehbar sein. Die für das jeweilige Erlebnis angezeigten besonderen Bedingungen sind Bestandteil der Buchung."],
["5. Buchung und Zahlung","Die Buchung wird zum Zeitpunkt der Reservierung vollständig über Stripe bezahlt. Der Preis wird vor Beginn der Zahlung in der ausgewählten Währung EUR oder RON angezeigt.<br><br>Der abschließende Bestellbutton muss klar darauf hinweisen, dass die Bestellung eine Zahlungsverpflichtung auslöst. Die Buchungsbestätigung und Vertragsinformationen werden per E-Mail oder auf einem anderen dauerhaften Datenträger übermittelt."],
["6. Stornierung durch den Kunden","In der aktuellen Version der Plattform können bestätigte und bezahlte Buchungen gemäß der bei der Buchung angezeigten Bedingung mindestens 24 Stunden vor dem Datum und der Uhrzeit der Buchung storniert werden. Nach Ablauf dieser Frist sind Stornierung und Erstattung nicht garantiert.<br><br>Wenn für ein bestimmtes Erlebnis besondere Stornobedingungen angezeigt werden, müssen diese vor der Zahlung geprüft werden und gelten, soweit sie nicht gegen zwingende Verbraucherrechte verstoßen.<br><br>Bei Nichterscheinen (No-Show) wird der gezahlte Betrag grundsätzlich nicht erstattet, sofern gesetzliche Vorschriften oder die besonderen Bedingungen des Erlebnisses nichts anderes vorsehen."],
["7. Widerrufsrecht","Bei Leistungen, für die das Gesetz eine Ausnahme vom Widerrufsrecht vorsieht, einschließlich bestimmter Freizeitdienstleistungen zu einem bestimmten Datum oder in einem bestimmten Zeitraum, besteht kein gesetzliches Widerrufsrecht, soweit die gesetzlichen Voraussetzungen erfüllt sind.<br><br>Bei Freizeitdienstleistungen zu einem bestimmten Datum oder Zeitraum kann die gesetzliche Ausnahme vom Widerrufsrecht für Fernabsatzverträge gelten. Ob die Ausnahme greift, hängt von der konkreten Leistung und den gesetzlichen Voraussetzungen ab; diese Bedingungen schließen keine gesetzlich zwingenden Verbraucherrechte aus."],
["8. Stornierung durch den Anbieter","Wenn der Anbieter die Leistung storniert und sie nicht zu den gebuchten Bedingungen erbracht werden kann, wird dem Kunden je nach Fall eine zumutbare Umbuchung oder eine vollständige Erstattung des für die betroffene Leistung gezahlten Betrags angeboten."],
["9. Schlechtes Wetter","Bei wetterabhängigen Aktivitäten entscheidet der Anbieter unter Beachtung des geltenden Rechts und der veröffentlichten Erlebnisbedingungen, ob die Leistung sicher durchgeführt werden kann. Wenn der Anbieter die Leistung wegen des Wetters absagt und keine Umbuchung akzeptiert wird, gilt die nach den Leistungsbedingungen und dem Gesetz vorgesehene Erstattung."],
["10. Höhere Gewalt und unvermeidbare außergewöhnliche Umstände","Bei Ereignissen, die nicht vernünftigerweise verhindert oder beseitigt werden können und die Durchführung der Leistung verhindern, kann der Anbieter die Leistung im Rahmen des geltenden Rechts aussetzen oder stornieren. FiiViu informiert den Kunden und unterstützt gegebenenfalls bei Umbuchung oder Erstattung."],
["11. Verspätungen und No-Show","Der Kunde ist dafür verantwortlich, die mitgeteilte Uhrzeit und den Treffpunkt einzuhalten. Eine Verspätung verpflichtet den Anbieter nicht, die Dauer der Leistung zu verlängern, und kann als No-Show behandelt werden, wenn dies für das jeweilige Erlebnis vorgesehen ist."],
["12. Haftung","Der Anbieter haftet im Rahmen des geltenden Rechts für die tatsächliche Erbringung der Leistung. Diese Bedingungen schränken keine zwingenden Verbraucherrechte oder eine gesetzlich nicht ausschließbare Haftung ein."],
["13. Beschwerden und alternative Streitbeilegung","Der Kunde kann FiiViu unter <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a> kontaktieren. FiiViu leitet Beschwerden, soweit erforderlich, an den verantwortlichen Anbieter weiter und unterstützt bei der Lösung.<br><br>Verbraucher können die in Rumänien verfügbaren Verfahren der alternativen Streitbeilegung (SAL) nach den geltenden gesetzlichen Bestimmungen nutzen. Offizielle Informationen sind bei ANPC verfügbar:<ul><li><a href='https://reclamatiisal.anpc.ro/' target='_blank' rel='noopener noreferrer'>ANPC SAL-Portal</a></li><li><a href='https://anpc.ro/sal/' target='_blank' rel='noopener noreferrer'>ANPC – Informationen zu SAL</a></li><li><a href='https://anpc.ro/' target='_blank' rel='noopener noreferrer'>ANPC</a></li></ul>Das Recht des Verbrauchers, sich an zuständige Behörden oder Gerichte zu wenden, bleibt unberührt."],
["14. Anwendbares Recht","Die Rechtsbeziehungen von FiiViu unterliegen rumänischem Recht, ohne die zwingenden Verbraucherschutzrechte zu beeinträchtigen, die unabhängig von einer Rechtswahl gelten."],
["15. Unternehmensdaten","CUI, Handelsregisternummer und vollständige Geschäftsanschrift müssen vor der endgültigen Veröffentlichung ergänzt werden."]
],updated:"Letzte Aktualisierung: 18. September 2026. Diese Bedingungen schränken keine zwingenden Verbraucherrechte nach geltendem Recht ein."},

content.ro.sections=[
["1. Domeniu","Acești termeni se aplică utilizării platformei FiiViu și rezervărilor efectuate online de consumatori. FiiViu nu oferă, în nume propriu, experiența rezervată, cu excepția situației în care oferta indică expres contrariul."],
["2. Rolul FiiViu","FiiViu facilitează identificarea, rezervarea și plata serviciilor oferite de furnizori independenți. Furnizorul este responsabil pentru disponibilitate, condițiile de participare, siguranța operațională și executarea efectivă a serviciului, în limitele legii și ale informațiilor prezentate clientului.<br><br>Prin efectuarea unei rezervări, clientul încheie relația contractuală privind serviciul concret cu furnizorul identificat în ofertă, în măsura în care oferta nu prevede în mod expres un alt model contractual."],
["3. Serviciile oferite","În versiunea actuală, FiiViu oferă spre rezervare experiențe precum tururi ale orașului, experiențe cu bicicleta, wellness, activități de seară, karting și experiențe cu limuzină. Oferta poate fi modificată sau extinsă în timp.<br><br>O rezervare FiiViu reprezintă o singură experiență sau un singur serviciu al unui singur furnizor, dacă oferta nu indică expres altfel. Platforma nu prezintă în mod implicit pachete turistice combinate."],
["4. Informațiile despre experiență","Înainte de plată, clientul trebuie să poată vedea cel puțin serviciul, furnizorul, data/perioada, ora, numărul de participanți, prețul total și condițiile specifice de anulare. Condițiile specifice afișate pentru experiența respectivă fac parte din condițiile rezervării."],
["5. Rezervarea și plata","Rezervarea se plătește integral la momentul rezervării prin Stripe. Prețul este afișat în moneda selectată, EUR sau RON, înainte de inițierea plății.<br><br>Butonul final de comandă trebuie să indice în mod clar că efectuarea comenzii implică o obligație de plată. Confirmarea rezervării și informațiile contractuale vor fi transmise clientului prin e-mail sau alt suport durabil."],
["6. Anularea de către client","În versiunea actuală a platformei, rezervările confirmate și plătite pot fi anulate de client cu cel puțin 24 de ore înainte de data și ora rezervării, conform condiției afișate la rezervare. După expirarea acestui termen, anularea și rambursarea nu sunt garantate.<br><br>Dacă pentru o anumită experiență sunt afișate condiții speciale de anulare, acestea trebuie consultate înainte de plată și se aplică în măsura în care nu contravin drepturilor obligatorii ale consumatorului.<br><br>În cazul neprezentării la ora și locul comunicate (no-show), suma plătită nu se rambursează, cu excepția cazurilor în care legea sau condițiile specifice ale experienței prevăd altfel."],
["7. Dreptul de retragere","În cazul serviciilor pentru care legea prevede o excepție de la dreptul de retragere, inclusiv anumite servicii de agrement prestate la o dată sau într-o perioadă specifică, clientul nu beneficiază de dreptul legal de retragere în măsura în care sunt îndeplinite condițiile legale.<br><br>În cazul serviciilor de agrement prestate la o dată sau într-o perioadă specifică, poate fi aplicabilă excepția legală de la dreptul de retragere prevăzută de legislația privind contractele la distanță. Aplicarea excepției se apreciază în funcție de serviciul concret și de condițiile legale aplicabile; nimic din acești termeni nu exclude drepturile consumatorului care nu pot fi excluse prin lege."],
["8. Anularea de către furnizor","Dacă furnizorul anulează serviciul și acesta nu poate fi furnizat în condițiile rezervate, clientului i se va oferi, după caz, o reprogramare acceptabilă sau rambursarea integrală a sumei plătite pentru serviciul afectat."],
["9. Vreme nefavorabilă","Pentru activitățile afectate de condițiile meteorologice, furnizorul stabilește dacă serviciul poate fi prestat în siguranță, cu respectarea legii și a condițiilor publicate pentru experiență. Dacă furnizorul anulează serviciul din cauza vremii și nu este acceptată o reprogramare, se aplică rambursarea prevăzută de condițiile serviciului și de lege."],
["10. Forță majoră și circumstanțe inevitabile și extraordinare","În cazul unor evenimente care nu pot fi prevenite sau înlăturate în mod rezonabil și care împiedică executarea serviciului, furnizorul poate suspenda sau anula serviciul în condițiile legii. FiiViu va informa clientul și va facilita, după caz, reprogramarea sau rambursarea aplicabilă."],
["11. Întârzieri și no-show","Clientul este responsabil să respecte ora și locul de întâlnire comunicate. Întârzierea clientului nu obligă furnizorul să prelungească durata serviciului și poate fi tratată ca no-show dacă această regulă este prevăzută pentru experiența respectivă."],
["12. Răspundere","Furnizorul răspunde pentru prestarea efectivă a serviciului, în limitele legii. Nimic din acești termeni nu limitează drepturile obligatorii ale consumatorului sau răspunderea care nu poate fi exclusă ori limitată prin lege."],
["13. Reclamații și soluționarea alternativă a litigiilor","Clientul poate contacta FiiViu la <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. FiiViu va transmite, atunci când este necesar, reclamația către furnizorul responsabil și va sprijini soluționarea acesteia.<br><br>Consumatorii pot utiliza mecanismele de soluționare alternativă a litigiilor (SAL) disponibile în România, în condițiile legislației aplicabile. Informațiile oficiale și portalul electronic sunt disponibile prin ANPC:<ul><li><a href='https://reclamatiisal.anpc.ro/' target='_blank' rel='noopener noreferrer'>Portal SAL ANPC</a></li><li><a href='https://anpc.ro/sal/' target='_blank' rel='noopener noreferrer'>Informații ANPC privind SAL</a></li><li><a href='https://anpc.ro/' target='_blank' rel='noopener noreferrer'>ANPC</a></li></ul>Dreptul consumatorului de a se adresa autorităților competente sau instanțelor rămâne neafectat."],
["14. Legea aplicabilă","Raporturile juridice ale FiiViu sunt guvernate de dreptul român, fără a aduce atingere drepturilor obligatorii de protecție a consumatorului care se aplică indiferent de alegerea legii."],
["15. Datele societății","CUI, numărul de ordine din Registrul Comerțului și adresa juridică completă trebuie completate înainte de publicarea finală."]
];
content.en.sections=[
["1. Scope","These terms apply to use of the FiiViu platform and online bookings made by consumers. FiiViu does not provide the booked experience in its own name unless the listing expressly states otherwise."],
["2. Role of FiiViu","FiiViu facilitates discovery, booking and payment for services provided by independent providers. The provider is responsible, within the law and the information presented to the customer, for availability, participation requirements, operational safety and actual performance.<br><br>By making a booking, the customer enters into the contractual relationship for the specific service with the provider identified in the listing, unless the listing expressly provides another contractual model."],
["3. Services offered","In its current version, FiiViu offers experiences such as city tours, bicycle experiences, wellness, evening activities, karting and limousine experiences. The offer may change or expand over time.<br><br>A FiiViu booking represents one experience or one service of one provider unless the listing expressly states otherwise. The platform does not automatically present combined package travel."],
["4. Experience information","Before payment, the customer must be able to see at least the service, provider, date/period, time, number of participants, total price and specific cancellation conditions. The specific conditions displayed for the experience form part of the booking conditions."],
["5. Booking and payment","The booking is paid in full at the time of reservation through Stripe. The price is displayed in the selected currency, EUR or RON, before payment is initiated.<br><br>The final order button must clearly indicate that placing the order creates an obligation to pay. Booking confirmation and contractual information will be sent by email or another durable medium."],
["6. Cancellation by the customer","In the current version of the platform, confirmed and paid bookings may be cancelled by the customer at least 24 hours before the booking date and time, according to the condition displayed at booking. After this period expires, cancellation and refund are not guaranteed.<br><br>If special cancellation conditions are displayed for a particular experience, they must be reviewed before payment and apply insofar as they do not conflict with mandatory consumer rights.<br><br>In the event of no-show at the communicated time and place, the amount paid will generally not be refunded unless the law or the specific experience conditions provide otherwise."],
["7. Right of withdrawal","For services for which the law provides an exception to the right of withdrawal, including certain leisure services supplied on a specific date or during a specific period, the customer does not have a statutory right of withdrawal insofar as the legal requirements are met.<br><br>For leisure services supplied on a specific date or during a specific period, the statutory exception to the right of withdrawal for distance contracts may apply. Whether the exception applies depends on the specific service and legal requirements; nothing in these terms excludes consumer rights that cannot legally be excluded."],
["8. Cancellation by the provider","If the provider cancels the service and it cannot be supplied under the booked conditions, the customer will, as applicable, be offered an acceptable rescheduling or a full refund of the amount paid for the affected service."],
["9. Adverse weather","For activities affected by weather conditions, the provider determines whether the service can be performed safely, subject to law and the published experience conditions. If the provider cancels due to weather and rescheduling is not accepted, the refund provided by the service conditions and applicable law applies."],
["10. Force majeure and unavoidable extraordinary circumstances","If events that cannot reasonably be prevented or overcome prevent performance of the service, the provider may suspend or cancel the service in accordance with the law. FiiViu will inform the customer and, where applicable, facilitate rescheduling or the applicable refund."],
["11. Delays and no-show","The customer is responsible for observing the communicated time and meeting point. A customer delay does not require the provider to extend the service duration and may be treated as a no-show where this rule applies to the experience."],
["12. Liability","The provider is responsible for the actual performance of the service within the limits of applicable law. Nothing in these terms limits mandatory consumer rights or liability that cannot legally be excluded or limited."],
["13. Complaints and alternative dispute resolution","The customer may contact FiiViu at <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. Where necessary, FiiViu will forward the complaint to the responsible provider and support its resolution.<br><br>Consumers may use alternative dispute resolution (ADR/SAL) mechanisms available in Romania under applicable law. Official information is available from ANPC:<ul><li><a href='https://reclamatiisal.anpc.ro/' target='_blank' rel='noopener noreferrer'>ANPC ADR portal</a></li><li><a href='https://anpc.ro/sal/' target='_blank' rel='noopener noreferrer'>ANPC information on ADR</a></li><li><a href='https://anpc.ro/' target='_blank' rel='noopener noreferrer'>ANPC</a></li></ul>The consumer's right to contact competent authorities or courts remains unaffected."],
["14. Applicable law","FiiViu's legal relationships are governed by Romanian law without prejudice to mandatory consumer protection rights that apply regardless of the choice of law."],
["15. Company details","The CUI, Trade Register number and full legal address must be completed before final publication."]
];
function setLanguage(lang){
const c=content[lang]||content.de;document.documentElement.lang=lang;document.title=c.title+" – FiiViu";
document.getElementById("legal-content").innerHTML="<a class='back' href='/?lang="+encodeURIComponent(lang)+"'>"+c.back+"</a><h1>"+c.title+"</h1><p><strong>"+(lang==="ro"?"Important":lang==="de"?"Wichtig":"Important")+"</strong>: "+c.important.replace(/^.*?: /,"")+"</p>"+c.sections.map(s=>"<h2>"+s[0]+"</h2><p>"+s[1]+"</p>").join("")+"<p><small>"+c.updated+"</small></p>";
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));localStorage.setItem("fiiviu_language",lang);
}
const p=new URLSearchParams(location.search);setLanguage(p.get("lang")||localStorage.getItem("fiiviu_language")||"de");
</script></body></html>
