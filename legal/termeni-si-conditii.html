<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiiViu – AGB</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:950px;margin:0 auto;padding:32px 20px;line-height:1.65;color:#171717;background:#F8F6F1}main{background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 45px rgba(21,21,21,.08)}h1,h2{line-height:1.2}h2{margin-top:30px}a{color:#c9581d}.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:24px}.lang button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:700}.lang button.active{background:#151515;color:#fff}.back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:700}.notice{padding:14px 16px;background:#f5efe8;border-radius:12px}</style></head><body><div class="lang"><button data-lang="de" onclick="setLanguage('de')">DE</button><button data-lang="en" onclick="setLanguage('en')">EN</button><button data-lang="ro" onclick="setLanguage('ro')">RO</button></div><main id="legal-content"></main><script>
const common={
de:{title:"AGB & Buchungsbedingungen",back:"← Zurück zu FiiViu",intro:"FiiViu S.R.L. betreibt eine Online-Vermittlungsplattform. FiiViu vermittelt Verträge zwischen Kunden und den in der jeweiligen Anzeige genannten Anbietern, soweit die Anzeige nicht ausdrücklich ein anderes Vertragsmodell vorsieht.",notice:"Wichtig: Diese Bedingungen ersetzen keine zwingenden gesetzlichen Verbraucherrechte. Für jede Buchung gelten zusätzlich die vor Zahlung angezeigten konkreten Leistungs-, Preis-, Verfügbarkeits- und Stornobedingungen.",sections:[
["1. Plattformrolle und Vertragspartner","FiiViu stellt die technische Plattform für Suche, Buchung und Zahlungsabwicklung bereit. Der konkrete Anbieter ist auf der jeweiligen Erlebnis-/Angebotsseite zu identifizieren. Soweit FiiViu nur vermittelt, wird der Vertrag über die konkrete Leistung zwischen Kunde und Anbieter geschlossen. FiiViu ist nicht der Leistungserbringer, sofern die Anzeige nichts anderes sagt."],
["2. Anbieterinformationen","Bei Angeboten von Unternehmern werden die gesetzlich erforderlichen Anbieterinformationen bereitgestellt. Anbieter müssen FiiViu vor der Freischaltung die für die Identifizierung und gesetzlich erforderliche Nachverfolgbarkeit notwendigen Angaben und Nachweise bereitstellen. FiiViu kann Angebote zurückhalten, deaktivieren oder entfernen, wenn erforderliche Angaben fehlen oder Zweifel an der Rechtmäßigkeit bestehen."],
["3. Angebot und Rangfolge","Die Darstellung von Erlebnissen kann nach Kategorie, Verfügbarkeit, Relevanz, Aktualität, Preis, Nachfrage und weiteren sachlichen Kriterien erfolgen. Bezahlte Platzierungen oder kommerzielle Hervorhebungen werden, soweit eingesetzt, als solche kenntlich gemacht. Die wesentlichen Parameter der Rangfolge werden in verständlicher Form offengelegt; eine bestimmte Platzierung oder Sichtbarkeit wird nicht garantiert."],
["4. Vertragsschluss und Zahlung","Vor Abgabe der zahlungspflichtigen Bestellung werden die wesentlichen Merkmale der Leistung, Anbieter, Datum/Zeitraum, Uhrzeit, Teilnehmerzahl, Gesamtpreis, Zahlungsart und die für die konkrete Leistung geltenden Bedingungen angezeigt. Der finale Bestellschritt weist auf die Zahlungspflicht hin. Die Zahlung erfolgt über Stripe. Die Buchung gilt nach erfolgreicher Zahlungsbestätigung und Bestätigung durch FiiViu als angenommen, sofern die konkrete Anzeige nichts anderes bestimmt."],
["5. Preis und Steuern","Der vor Abschluss angezeigte Gesamtpreis enthält die nach den anwendbaren Vorschriften auszuweisenden Preisbestandteile. Der jeweilige Anbieter ist für die ihm obliegenden steuerlichen Pflichten verantwortlich. FiiViu weist Preise und gegebenenfalls den TVA-/Mehrwertsteuerstatus nach den tatsächlich hinterlegten Anbieter- und Unternehmensdaten aus."],
["6. Durchführung der Leistung","Der Anbieter ist für Verfügbarkeit, Organisation, Sicherheit und tatsächliche Durchführung der gebuchten Leistung verantwortlich, soweit zwingendes Recht oder die Anzeige nichts anderes bestimmt. Kunden müssen die angegebenen Teilnahmevoraussetzungen, Treffpunkte und Zeiten beachten."],
["7. Stornierung durch den Kunden","Für die konkrete Buchung gilt die vor Zahlung angezeigte Stornierungsregel. Die technische Standardfunktion der Plattform kann eine Stornierung bis mindestens 24 Stunden vor Beginn vorsehen; maßgeblich sind jedoch die konkret angezeigten Bedingungen, soweit diese rechtmäßig sind. Gesetzliche Rücktritts-, Widerrufs- oder Erstattungsrechte bleiben unberührt."],
["8. Gesetzliches Widerrufsrecht","Bei Fernabsatzverträgen besteht grundsätzlich ein gesetzliches Widerrufsrecht, soweit keine gesetzliche Ausnahme greift. Für Dienstleistungen im Zusammenhang mit Freizeitbetätigungen kann die gesetzliche Ausnahme greifen, wenn eine spezifische Ausführungszeit oder ein spezifischer Zeitraum vereinbart ist. Die Ausnahme wird nicht pauschal auf alle FiiViu-Angebote angewendet; sie ist anhand der konkreten Leistung und der gesetzlichen Voraussetzungen zu bestimmen."],
["9. Beginn der Leistung vor Ablauf der Widerrufsfrist","Wenn eine Leistung vor Ablauf einer grundsätzlich bestehenden Widerrufsfrist beginnen soll, werden die gesetzlich erforderlichen ausdrücklichen Erklärungen und Hinweise eingeholt. Eine vollständige Leistungserbringung kann unter den gesetzlichen Voraussetzungen zum Erlöschen des Widerrufsrechts führen."],
["10. Erstattung","Soweit eine Erstattung geschuldet ist, erfolgt sie nach den gesetzlichen Vorgaben und grundsätzlich über dasselbe Zahlungsmittel, das für die ursprüngliche Zahlung verwendet wurde, sofern keine zulässige andere Vereinbarung getroffen wurde. Bei einer Stornierung durch den Anbieter wegen Nichtdurchführbarkeit wird, soweit geschuldet, der für die betroffene Leistung gezahlte Betrag erstattet oder eine zulässige Umbuchung angeboten."],
["11. Wetter, höhere Gewalt und außergewöhnliche Umstände","Bei wetterabhängigen oder sicherheitsrelevanten Leistungen entscheidet der Anbieter unter Beachtung der veröffentlichten Bedingungen und des geltenden Rechts über die Durchführung. Bei unvermeidbaren außergewöhnlichen Umständen können gesetzlich zulässige Umbuchungs-, Aussetzungs- oder Erstattungsregeln gelten."],
["12. Beschwerden und Verbraucherstreitigkeiten","Kunden können Beschwerden an <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a> richten. FiiViu unterstützt bei Beschwerden über die Plattform und leitet sie, soweit erforderlich, an den verantwortlichen Anbieter weiter. Das Recht, sich an zuständige Behörden oder Gerichte zu wenden, bleibt unberührt. Informationen zu den in Rumänien verfügbaren Verbraucherschutz- und SAL-Verfahren werden über die offiziellen ANPC-Kanäle bereitgestellt."],
["13. Haftung","FiiViu haftet nach den gesetzlichen Vorschriften für eigene Pflichtverletzungen. Für die tatsächliche Durchführung einer vermittelten Leistung ist grundsätzlich der jeweilige Anbieter verantwortlich. Keine Bestimmung dieser Bedingungen schließt eine Haftung oder ein Verbraucherrecht aus, soweit dies gesetzlich unzulässig wäre."],
["14. Sperrung und Entfernung von Angeboten","FiiViu kann Konten, Angebote oder Inhalte vorübergehend beschränken oder entfernen, wenn dies aufgrund Gesetzes, behördlicher Anordnung, Sicherheitsrisiken, fehlender Pflichtangaben, erheblicher Vertragsverletzungen oder Verstößen gegen diese Bedingungen erforderlich oder angemessen ist. Soweit gesetzlich erforderlich, werden Gründe und verfügbare Rechtsbehelfe mitgeteilt."],
["15. Datenschutz","Die Verarbeitung personenbezogener Daten erfolgt nach der gesonderten <a href='/legal/politica-de-confidentialitate.html'>Datenschutzerklärung</a>. Zahlungsdaten werden über Stripe verarbeitet; vollständige Kartendaten werden von FiiViu nicht gespeichert."],
["16. Änderungen der Bedingungen","Änderungen werden für künftige Buchungen veröffentlicht. Wesentliche Änderungen werden Nutzern in geeigneter Weise mitgeteilt, soweit dies gesetzlich erforderlich ist. Für bereits geschlossene Verträge gelten die bei Vertragsschluss maßgeblichen Bedingungen, soweit zwingendes Recht nichts anderes verlangt."],
["17. Anwendbares Recht und Gerichtsstand","Es gilt rumänisches Recht, ohne dass Verbrauchern dadurch der Schutz zwingender Vorschriften entzogen wird, die nach dem anwendbaren Recht gelten. Gerichtsstand ist, soweit gesetzlich zulässig, der gesetzlich zuständige Gerichtsstand."],
["18. Unternehmensangaben","CUI, vollständige juristische Anschrift, Handelsregisternummer und gegebenenfalls TVA-/USt.-Identifikationsnummer müssen vor dem öffentlichen Launch anhand der offiziellen Unternehmensunterlagen ergänzt werden."]],updated:"Letzte Aktualisierung: 26. September 2026."},
en:{title:"Terms & Booking Conditions",back:"← Back to FiiViu",intro:"FiiViu S.R.L. operates an online intermediation platform. FiiViu facilitates contracts between customers and the providers identified in each listing unless the listing expressly states another contractual model.",notice:"Important: These terms do not limit mandatory consumer rights. Each booking is also governed by the concrete service, price, availability and cancellation conditions shown before payment.",sections:[] ,updated:"Last updated: 26 September 2026."},
ro:{title:"Termeni și condiții de rezervare",back:"← Înapoi la FiiViu",intro:"FiiViu S.R.L. operează o platformă online de intermediere. FiiViu facilitează contractele dintre clienți și furnizorii identificați în fiecare ofertă, cu excepția cazului în care oferta indică expres un alt model contractual.",notice:"Important: Acești termeni nu limitează drepturile obligatorii ale consumatorilor. Pentru fiecare rezervare se aplică și condițiile concrete privind serviciul, prețul, disponibilitatea și anularea afișate înainte de plată.",sections:[],updated:"Ultima actualizare: 26 septembrie 2026."}};
common.en.sections=[
["1. Platform role and contracting party","FiiViu provides the technical platform for discovery, booking and payment processing. The concrete provider is identified on the relevant experience/listing page. Where FiiViu acts only as an intermediary, the contract for the service is between the customer and the provider. FiiViu is not the service provider unless the listing states otherwise."],
["2. Provider information","For trader offers, legally required provider information is made available. Providers must submit the information and evidence needed for identification and legally required traceability before being listed. FiiViu may withhold, deactivate or remove offers where required information is missing or legality is reasonably in doubt."],
["3. Offers and ranking","Experiences may be displayed based on category, availability, relevance, freshness, price, demand and other objective criteria. Paid placements or commercial prominence, if used, will be identified as such. No particular ranking or visibility is guaranteed."],
["4. Contract and payment","Before a binding paid order, the customer is shown the main characteristics, provider, date/period, time, participant number, total price, payment method and applicable conditions. The final order step indicates the payment obligation. Payment is processed through Stripe. A booking is accepted after successful payment confirmation and FiiViu confirmation unless the listing states otherwise."],
["5. Price and taxes","The total price shown before conclusion includes the price components required by applicable law. Each provider remains responsible for its own tax obligations. VAT/tax status is displayed according to the actual provider and company data available to FiiViu."],
["6. Performance","The provider is responsible for availability, organisation, safety and actual performance of the booked service unless mandatory law or the listing provides otherwise. Customers must comply with stated participation requirements, meeting points and times."],
["7. Customer cancellation","The cancellation rule shown before payment applies to the booking. The platform may provide a technical standard allowing cancellation at least 24 hours before the start; however, the concrete displayed terms govern where lawful. Mandatory statutory rights remain unaffected."],
["8. Statutory withdrawal right","Distance contracts generally carry a statutory withdrawal right unless a legal exception applies. For leisure activities, an exception may apply where a specific date or period is agreed. The exception is not applied to all FiiViu offers automatically; it is assessed by reference to the concrete service and legal requirements."],
["9. Performance during the withdrawal period","If performance is requested before the end of a statutory withdrawal period, the legally required express statements and notices will be obtained. Full performance may cause the withdrawal right to expire where the statutory conditions are met."],
["10. Refunds","Where a refund is legally due, it is made under applicable law and generally using the same payment method as the original transaction unless a lawful alternative is agreed. If a provider cancels because the service cannot be performed, the customer will, where due, receive a refund or a lawful rescheduling option."],
["11. Weather and extraordinary circumstances","For weather-dependent or safety-sensitive services, the provider decides whether the service can safely proceed in accordance with the published conditions and applicable law. Legally permitted rescheduling, suspension or refund rules may apply to unavoidable extraordinary circumstances."],
["12. Complaints and consumer disputes","Customers may contact <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. FiiViu supports platform complaints and, where necessary, forwards them to the responsible provider. The right to contact competent authorities or courts remains unaffected."],
["13. Liability","FiiViu is liable under applicable law for its own breaches. The relevant provider is generally responsible for actual performance of an intermediary service. Nothing excludes liability or consumer rights where exclusion is unlawful."],
["14. Suspension and removal","FiiViu may restrict accounts, offers or content where required or appropriate due to law, authority orders, security risks, missing mandatory information, material contractual breaches or violations of these terms. Reasons and available remedies will be provided where legally required."],
["15. Data protection","Personal data is processed under the separate <a href='/legal/politica-de-confidentialitate.html'>Privacy Policy</a>. Payment data is processed through Stripe; FiiViu does not store full card details."],
["16. Changes","Changes apply to future bookings. Material changes will be communicated appropriately where required by law. For contracts already concluded, the terms applicable at conclusion remain relevant unless mandatory law requires otherwise."],
["17. Governing law","Romanian law applies without depriving consumers of mandatory protections applicable under the relevant law. Jurisdiction is determined by mandatory applicable rules."],
["18. Company information","The CUI, full legal address, Trade Register number and, where applicable, VAT identification must be completed from official company documents before public launch."]];
common.ro.sections=[
["1. Rolul platformei și partea contractantă","FiiViu oferă platforma tehnică pentru descoperire, rezervare și procesarea plăților. Furnizorul concret este identificat în oferta relevantă. Atunci când FiiViu acționează doar ca intermediar, contractul pentru serviciu se încheie între client și furnizor. FiiViu nu este furnizorul serviciului decât dacă oferta indică expres contrariul."],
["2. Informațiile despre furnizori","Pentru ofertele furnizorilor profesioniști sunt puse la dispoziție informațiile cerute de lege. Furnizorii trebuie să transmită înainte de listare datele și dovezile necesare identificării și trasabilității legale. FiiViu poate refuza, dezactiva sau elimina o ofertă dacă lipsesc date obligatorii sau există îndoieli rezonabile privind legalitatea."],
["3. Oferte și ordonarea rezultatelor","Experiențele pot fi afișate în funcție de categorie, disponibilitate, relevanță, actualitate, preț, cerere și alte criterii obiective. Poziționările plătite sau evidențierile comerciale, dacă sunt utilizate, vor fi marcate corespunzător. Nu este garantată o anumită poziție sau vizibilitate."],
["4. Încheierea contractului și plata","Înaintea unei comenzi obligatorii și plătite, clientului îi sunt afișate caracteristicile principale, furnizorul, data/perioada, ora, numărul de participanți, prețul total, metoda de plată și condițiile aplicabile. Pasul final indică obligația de plată. Plata este procesată prin Stripe. Rezervarea este acceptată după confirmarea plății și confirmarea FiiViu, dacă oferta nu prevede altfel."],
["5. Preț și taxe","Prețul total afișat înainte de încheiere include componentele impuse de legislația aplicabilă. Fiecare furnizor răspunde pentru propriile obligații fiscale. Statutul TVA este afișat conform datelor reale ale furnizorului și ale societății disponibile FiiViu."],
["6. Prestarea serviciului","Furnizorul răspunde pentru disponibilitatea, organizarea, siguranța și executarea efectivă a serviciului, cu excepția cazului în care legea imperativă sau oferta prevăd altfel. Clienții trebuie să respecte condițiile de participare, locul și ora comunicate."],
["7. Anularea de către client","Se aplică regula de anulare afișată înainte de plată. Platforma poate oferi tehnic posibilitatea anulării cu cel puțin 24 de ore înainte de începere; condițiile concrete afișate prevalează, în măsura în care sunt legale. Drepturile obligatorii ale consumatorului rămân neafectate."],
["8. Dreptul legal de retragere","Contractele la distanță beneficiază, în principiu, de drept de retragere, cu excepția cazurilor prevăzute de lege. Pentru servicii privind activități de agrement poate exista o excepție atunci când este stabilită o dată sau o perioadă specifică. Excepția nu se aplică automat tuturor ofertelor FiiViu, ci se analizează în funcție de serviciul concret și condițiile legale."],
["9. Executarea în perioada de retragere","Dacă executarea este solicitată înainte de expirarea perioadei legale de retragere, vor fi obținute declarațiile și informările exprese cerute de lege. Prestarea integrală poate determina pierderea dreptului de retragere atunci când sunt îndeplinite condițiile legale."],
["10. Rambursări","Atunci când rambursarea este datorată, aceasta se efectuează conform legii și, în principiu, prin aceeași metodă de plată folosită inițial, dacă nu este convenită legal o altă metodă. Dacă furnizorul anulează deoarece serviciul nu poate fi prestat, clientul primește, după caz, rambursarea datorată sau o reprogramare permisă de lege."],
["11. Vreme și circumstanțe extraordinare","Pentru servicii dependente de vreme sau de siguranță, furnizorul decide dacă serviciul poate fi prestat în siguranță, conform condițiilor publicate și legii. În cazul unor circumstanțe extraordinare inevitabile pot fi aplicabile reguli legale de reprogramare, suspendare sau rambursare."],
["12. Reclamații și litigii de consum","Clienții pot contacta <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. FiiViu sprijină reclamațiile privind platforma și, când este necesar, le transmite furnizorului responsabil. Dreptul de a contacta autoritățile competente sau instanțele rămâne neafectat."],
["13. Răspundere","FiiViu răspunde potrivit legii pentru propriile încălcări. Furnizorul relevant răspunde, în principiu, pentru executarea efectivă a serviciului intermediat. Nicio prevedere nu exclude o răspundere sau un drept al consumatorului atunci când excluderea ar fi ilegală."],
["14. Suspendare și eliminare","FiiViu poate restricționa conturi, oferte sau conținut atunci când acest lucru este necesar sau adecvat din cauza legii, a ordinelor autorităților, a riscurilor de securitate, a lipsei datelor obligatorii, a încălcărilor contractuale semnificative sau a încălcării acestor termeni. Motivele și căile disponibile vor fi comunicate atunci când legea o impune."],
["15. Protecția datelor","Datele cu caracter personal sunt prelucrate conform <a href='/legal/politica-de-confidentialitate.html'>Politicii de confidențialitate</a>. Datele de plată sunt procesate prin Stripe; FiiViu nu stochează date complete ale cardului."],
["16. Modificări","Modificările se aplică rezervărilor viitoare. Modificările importante vor fi comunicate în mod adecvat atunci când legea o impune. Pentru contractele deja încheiate rămân aplicabile condițiile valabile la încheiere, cu excepția cazului în care legea imperativă impune altfel."],
["17. Legea aplicabilă","Se aplică dreptul român, fără a priva consumatorii de protecția obligatorie aplicabilă potrivit legii relevante. Competența instanțelor este determinată de normele imperative aplicabile."],
["18. Datele societății","CUI, adresa juridică completă, numărul Registrului Comerțului și, dacă este cazul, identificarea TVA trebuie completate pe baza documentelor oficiale înainte de lansarea publică."]];
function setLanguage(lang){const c=common[lang]||common.de;document.documentElement.lang=lang;document.title=c.title+" – FiiViu";document.getElementById("legal-content").innerHTML="<a class='back' href='/?lang="+encodeURIComponent(lang)+"'>"+c.back+"</a><h1>"+c.title+"</h1><p>"+c.intro+"</p><div class='notice'>"+c.notice+"</div>"+c.sections.map(s=>"<h2>"+s[0]+"</h2><p>"+s[1]+"</p>").join("")+"<p><small>"+c.updated+"</small></p>";document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));localStorage.setItem("fiiviu_language",lang)}const p=new URLSearchParams(location.search);setLanguage(p.get("lang")||localStorage.getItem("fiiviu_language")||"de");</script></body></html>
