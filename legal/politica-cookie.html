<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookie-uri și stocare în browser – FiiViu</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:900px;margin:0 auto;padding:32px 20px;line-height:1.65;color:#171717;background:#F8F6F1}
main{background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 45px rgba(21,21,21,.08)}
h1,h2{line-height:1.2}h2{margin-top:28px}a{color:#c9581d}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:20px}
.lang button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:700}
.lang button.active{background:#151515;color:#fff}
.notice{padding:14px 16px;border-radius:12px;background:#fff3cd}
</style>
</head>
<body>
<div class="lang" aria-label="Language"><button type="button" data-lang="de" onclick="setLanguage('de')">DE</button><button type="button" data-lang="en" onclick="setLanguage('en')">EN</button><button type="button" data-lang="ro" onclick="setLanguage('ro')">RO</button></div>
<main id="content"></main>
<script>
const content={
ro:{title:"Politica privind cookie-urile și stocarea pe dispozitiv",back:"← Înapoi la FiiViu",updated:"Actualizată la 28 octombrie 2026",intro:"Această pagină descrie utilizarea cookie-urilor și a tehnologiilor similare de către FiiViu. Lista de mai jos reflectă verificările efectuate în codul depozitului și trebuie verificată din nou în producție, inclusiv prin inspectarea cookie-urilor și a stocării create de serviciile terțe.",sections:[
["1. Stocare locală a preferinței de limbă","Pagina juridică «Date despre societate» salvează limba selectată în localStorage sub cheia fiiviu_language. Această valoare persistă în browser. Site-ul principal poate utiliza propriile mecanisme de limbă; inventarul complet al tuturor paginilor și serviciilor terțe trebuie verificat în browserul de producție. Nu folosim această preferință pentru publicitate comportamentală."],
["2. Coduri de recomandare","Codul ref dintr-un link de partener este citit din URL și folosit pentru atribuirea unei rezervări. Codul nu trebuie descris ca nefiind stocat în browser fără o verificare tehnică completă a tuturor paginilor și fluxurilor. În codul curent al paginii juridice, preferința de limbă este stocată separat în localStorage."],
["3. Servicii externe","Site-ul încarcă resurse de la Stripe (plăți), Cloudflare (infrastructură) și biblioteci/fonturi sau alte resurse externe, inclusiv Tailwind CDN, Font Awesome CDN și Flatpickr CDN. Încărcarea acestora poate transmite date tehnice, precum adresa IP și informații despre browser, furnizorilor respectivi. Cookie-urile sau stocarea folosite direct de acești furnizori trebuie inventariate în producție."],
["4. Tehnologii strict necesare și consimțământ","Înainte de lansarea oricărui instrument de analiză, publicitate, remarketing sau altă tehnologie neesențială care stochează informații pe dispozitiv ori accesează informații deja stocate, FiiViu trebuie să obțină consimțământul prealabil atunci când legea îl cere. Refuzul și retragerea consimțământului trebuie să fie la fel de ușor de folosit ca acordarea lui. Nu pretindem că există un banner de consimțământ funcțional până când acesta nu este implementat și testat."],
["5. Cum puteți controla stocarea","Puteți șterge sau bloca datele din browser prin setările acestuia; unele funcții ale site-ului pot să nu funcționeze corect. Ștergerea localStorage poate elimina preferința de limbă salvată."],
["6. Contact","Întrebări: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. Datele juridice complete ale societății trebuie completate din documentele oficiale înainte de operarea comercială."]],
en:{title:"Cookies and Device Storage Policy",back:"← Back to FiiViu",updated:"Updated 28 October 2026",intro:"This page describes FiiViu's use of cookies and similar technologies. The information below reflects checks of the repository code and must be re-verified in production, including cookies and storage created by third-party services.",sections:[
["1. Local language preference","The legal company-information page stores the selected language in localStorage under the key fiiviu_language. This value persists in the browser. The main site may use its own language mechanisms; a complete inventory of all pages and third-party services must be verified in the production browser. This preference is not used for behavioural advertising."],
["2. Referral codes","A ref code in a partner link is read from the URL and used to attribute a booking. We should not claim that no browser storage is used without a complete technical check of all pages and flows. The current legal page separately stores the language preference in localStorage."],
["3. Third-party services","The site loads resources from Stripe (payments), Cloudflare (infrastructure), and external libraries/assets including Tailwind CDN, Font Awesome CDN and Flatpickr CDN. Loading these may transmit technical data such as IP address and browser information to those providers. Any cookies or storage used directly by those services must be inventoried in production."],
["4. Strictly necessary technologies and consent","Before enabling analytics, advertising, remarketing or other non-essential technology that stores information on a device or accesses information already stored, FiiViu must obtain prior consent where required by law. Refusing or withdrawing consent must be as easy as giving it. We do not claim a functioning consent banner exists unless it has been implemented and tested."],
["5. Browser controls","You can delete or block browser data through your browser settings; some site functions may not work properly. Deleting localStorage may remove the saved language preference."],
["6. Contact","Questions: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. Complete company legal details must be added from official records before commercial operation."]]},
de:{title:"Cookie- und Browser-Speicherrichtlinie",back:"← Zurück zu FiiViu",updated:"Aktualisiert am 28. Oktober 2026",intro:"Diese Seite beschreibt die Nutzung von Cookies und ähnlichen Technologien durch FiiViu. Die Angaben beruhen auf Prüfungen des Repository-Codes und müssen in der Produktionsumgebung erneut überprüft werden, einschließlich der durch Drittanbieter erzeugten Cookies und Speicherwerte.",sections:[
["1. Gespeicherte Spracheinstellung","Die rechtliche Unternehmensinformationsseite speichert die ausgewählte Sprache unter dem Schlüssel fiiviu_language in localStorage. Dieser Wert bleibt im Browser gespeichert. Die Hauptwebsite kann eigene Sprachmechanismen verwenden; das vollständige Inventar aller Seiten und Drittanbieter muss im Produktionsbrowser geprüft werden. Die Spracheinstellung wird nicht für verhaltensbezogene Werbung verwendet."],
["2. Empfehlungs-Codes","Ein ref-Code in einem Partnerlink wird aus der URL gelesen und zur Zuordnung einer Buchung verwendet. Ohne vollständige technische Prüfung aller Seiten und Abläufe sollte nicht behauptet werden, dass keinerlei Browser-Speicherung stattfindet. Die rechtliche Seite speichert die Spracheinstellung separat in localStorage."],
["3. Externe Dienste","Die Website lädt Ressourcen von Stripe (Zahlungen), Cloudflare (Infrastruktur) und externen Bibliotheken/Ressourcen, darunter Tailwind CDN, Font Awesome CDN und Flatpickr CDN. Dabei können technische Daten wie IP-Adresse und Browserinformationen an diese Anbieter übermittelt werden. Von diesen Diensten gesetzte Cookies oder Speicherwerte müssen in Produktion inventarisiert werden."],
["4. Notwendige Technologien und Einwilligung","Analyse-, Werbe-, Remarketing- oder sonstige nicht notwendige Technologien, die Informationen auf dem Endgerät speichern oder auf gespeicherte Informationen zugreifen, dürfen erst aktiviert werden, nachdem die gesetzlich erforderliche vorherige Einwilligung eingeholt wurde. Ablehnung und Widerruf müssen ebenso einfach sein wie die Erteilung. Ein funktionierender Consent-Banner wird nicht behauptet, solange er nicht implementiert und getestet ist."],
["5. Browser-Einstellungen","Sie können Browserdaten in den Einstellungen löschen oder blockieren; dadurch können einzelne Funktionen beeinträchtigt werden. Beim Löschen von localStorage kann die gespeicherte Spracheinstellung verloren gehen."],
["6. Kontakt","Fragen: <a href='mailto:info@fiiviu.ro'>info@fiiviu.ro</a>. Die vollständigen Unternehmensdaten müssen vor dem kommerziellen Betrieb anhand offizieller Unterlagen ergänzt werden."]]}
};
function setLanguage(lang){const c=content[lang]||content.ro;document.documentElement.lang=lang;document.title=c.title+" – FiiViu";document.getElementById("content").innerHTML="<p><a href='/?lang="+encodeURIComponent(lang)+"'>"+c.back+"</a></p><h1>"+c.title+"</h1><p><strong>"+c.updated+"</strong></p><p class='notice'>"+c.intro+"</p>"+c.sections.map(s=>"<h2>"+s[0]+"</h2><p>"+s[1]+"</p>").join("");document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));}
const requested=new URLSearchParams(location.search).get("lang");const saved=(()=>{try{return localStorage.getItem("fiiviu_language")}catch(_){return null}})();setLanguage(["ro","de","en"].includes(requested)?requested:(["ro","de","en"].includes(saved)?saved:"ro"));
</script>
</body>
</html>
