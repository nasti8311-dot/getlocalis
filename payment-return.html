<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#E7D9C5">
  <title>Zahlungsstatus – FiiViu</title>
  <link rel="stylesheet" href="/assets/css/fiiviu-design-system.css">
  <link rel="stylesheet" href="/assets/css/fiiviu-pages.css">
  <style>
    body{font-family:Arial,sans-serif;background:#E7D9C5;color:#222;max-width:680px;margin:40px auto;padding:0 18px}
    main{background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px}
    .muted{color:#666}.error{color:#b42318}.ok{color:#278a4b;font-weight:700}
  </style>
</head>
<body>
  <main><div id="status" aria-live="polite">Zahlung wird überprüft …</div></main>
  <script>
    (async function () {
      const status = document.getElementById("status");
      const params = new URLSearchParams(window.location.search);
      const paymentIntentId = String(params.get("payment_intent") || "").trim();
      const clientSecret = String(params.get("payment_intent_client_secret") || "").trim();
      const redirectStatus = String(params.get("redirect_status") || "").trim();
      window.history.replaceState({}, document.title, "/payment-return.html");

      function showError(message) {
        status.innerHTML = '<h1 class="error">Zahlung noch nicht bestätigt</h1><p>' +
          message + '</p><p class="muted">Bitte prüfe deine E-Mail auf eine Buchungsbestätigung. Falls keine Bestätigung eintrifft, kontaktiere bitte den Support.</p><p><a href="/">Zurück zu FiiViu</a></p>';
      }
      if (!paymentIntentId || !clientSecret) {
        showError("Die Rückmeldung des Zahlungsanbieters ist unvollständig. Bitte starte keine weitere Zahlung, bevor du deinen Zahlungsstatus geprüft hast.");
        return;
      }
      if (redirectStatus && redirectStatus !== "succeeded") {
        showError("Der Zahlungsanbieter hat die Zahlung nicht als erfolgreich bestätigt. Es wurde keine Buchungsbestätigung durch diese Rückleitung ausgelöst.");
        return;
      }
      try {
        const response = await fetch("/api/finalize-booking", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentIntentId, clientSecret }),
          credentials: "omit"
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) {
          showError(data.error || "Stripe hat die Zahlung zurückgeleitet, aber die Buchung konnte noch nicht bestätigt werden.");
          return;
        }
        status.innerHTML = '<h1 class="ok">✓ Zahlung erfolgreich</h1><p>Deine Buchung wurde bestätigt.</p><p><strong>Buchungsnummer:</strong> ' +
          String(data.booking_id || "").replace(/[&<>"']/g, "") +
          '</p><p class="muted">Die Buchungsdetails und dein sicherer Buchungslink werden an die bei der Buchung angegebene E-Mail-Adresse gesendet.</p><p><a href="/">Zurück zu FiiViu</a></p>';
      } catch (error) {
        showError("Der Buchungsstatus konnte gerade nicht abgerufen werden. Bitte prüfe deine E-Mail, bevor du eine weitere Zahlung versuchst.");
      }
    })();
  </script>
</body>
</html>
