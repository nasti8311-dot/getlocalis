<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiiViu – Provider Bookings</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50 text-gray-900"><main class="max-w-6xl mx-auto p-6"><div class="flex items-center justify-between gap-4 mb-6"><div><p class="text-xs font-black tracking-widest text-orange-500 uppercase">FiiViu Provider</p><h1 class="text-3xl font-black">Bookings</h1></div><a href="/provider.html" class="font-bold text-orange-500">← Experiences</a></div><section class="bg-white rounded-2xl p-5 shadow-sm mb-6"><div class="grid md:grid-cols-2 gap-3"><input id="key" type="password" placeholder="Provider-Schlüssel" autocomplete="off" class="border rounded-xl px-4 py-3"><button id="load" class="rounded-xl bg-black text-white font-bold px-5 py-3">Bookings laden</button></div><p class="text-sm text-gray-500 mt-3">Das Stripe-Connect-Konto wird serverseitig aus dem Provider-Schlüssel bestimmt.</p><p id="error" class="text-red-600 text-sm mt-3"></p></section><section id="summary" class="grid md:grid-cols-3 gap-4 mb-6"></section><section id="list" class="space-y-3"></section></main><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));}function money(b){return (Number(b.amount_cents||0)/100).toFixed(2)+' '+String(b.currency||'EUR').toUpperCase()}function dateText(v){if(!v)return '—';const d=new Date(v+'T00:00:00');return isNaN(d)?esc(v):d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});}async function load(){const key=$('key').value.trim();$('error').textContent='';if(!key){$('error').textContent='Provider-Schlüssel ist erforderlich.';return}try{const r=await fetch('/api/provider/bookings',{headers:{Authorization:'Bearer '+key}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Fehler');const rows=data.bookings||[];$('summary').innerHTML='<div class="bg-white rounded-2xl p-5"><div class="text-sm text-gray-500">Bookings</div><div class="text-2xl font-black">'+rows.length+'</div></div><div class="bg-white rounded-2xl p-5"><div class="text-sm text-gray-500">Guests</div><div class="text-2xl font-black">'+rows.reduce((n,b)=>n+Number(b.guests||0),0)+'</div></div><div class="bg-white rounded-2xl p-5"><div class="text-sm text-gray-500">Booking value</div><div class="text-2xl font-black">'+rows.reduce((n,b)=>n+Number(b.amount_cents||0),0)/100+' EUR</div></div>';if(!rows.length){$('list').innerHTML='<div class="bg-white rounded-2xl p-8 text-gray-500">Noch keine Bookings für diesen Provider.</div>';return}$('list').innerHTML=rows.map(b=>{const address=[b.meeting_address,b.meeting_city,b.meeting_country].filter(Boolean).join(', ');return '<article class="bg-white rounded-2xl p-5 shadow-sm"><div class="flex flex-wrap justify-between gap-3"><div><div class="text-xs font-bold text-gray-400">'+esc(b.booking_id)+'</div><h2 class="text-xl font-black mt-1">'+esc(b.experience_name)+'</h2></div><span class="px-3 py-1 rounded-full bg-green-50 text-green-700 text-sm font-bold">'+esc(b.status)+'</span></div><div class="grid md:grid-cols-4 gap-4 mt-4 text-sm"><div><b>Datum</b><br>'+dateText(b.booking_date)+'</div><div><b>Zeit</b><br>'+esc(b.booking_time||'—')+'</div><div><b>Gäste</b><br>'+esc(b.guests)+'</div><div><b>Betrag</b><br>'+money(b)+'</div></div><div class="mt-4 pt-4 border-t grid md:grid-cols-2 gap-4 text-sm"><div><b>Kunde</b><br>'+esc(b.customer_name)+' · '+esc(b.customer_email)+'</div><div><b>Treffpunkt</b><br>'+esc(b.meeting_point_name||'—')+(address?'<br><span class="text-gray-500">'+esc(address)+'</span>':'')+(b.meeting_instructions?'<br><span class="text-gray-500">'+esc(b.meeting_instructions)+'</span>':'')+'</div></div></article>'}).join('')}catch(e){$('error').textContent=e.message||'Fehler beim Laden.'}}$('load').addEventListener('click',load);</script></body></html>
