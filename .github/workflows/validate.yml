name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run
