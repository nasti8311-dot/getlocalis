name: Deploy production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

      - name: Validate Wrangler bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Wait for public Pages deployment of this commit
        shell: bash
        run: |
          set -euo pipefail
          expected_html_sha="$(sha256sum index.html | awk '{print $1}')"
          for attempt in $(seq 1 60); do
            actual_html_sha="$(curl --fail --silent --show-error --location --max-time 20 https://fiiviu.ro/ | sha256sum | awk '{print $1}')"
            headers="$(curl --silent --show-error --location --max-time 20 -D - -o /dev/null https://fiiviu.ro/ | tr -d '\r')"
            if [ "$actual_html_sha" = "$expected_html_sha" ] &&
               printf '%s\n' "$headers" | grep -Fqi 'Strict-Transport-Security: max-age=31536000; includeSubDomains' &&
               printf '%s\n' "$headers" | grep -Fqi 'X-Frame-Options: DENY' &&
               printf '%s\n' "$headers" | grep -Fqi 'X-Content-Type-Options: nosniff' &&
               printf '%s\n' "$headers" | grep -Fqi 'Referrer-Policy: strict-origin-when-cross-origin' &&
               printf '%s\n' "$headers" | grep -Fqi 'Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(self)'; then
              echo "Public site matches the current index.html and serves the expected baseline security headers."
              exit 0
            fi
            echo "Waiting for current Pages deployment (attempt $attempt/60)..."
            sleep 5
          done
          echo "Public site did not match the current index.html and security-header baseline within 5 minutes."
          exit 1

      - name: Wait for public Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            headers="$(curl --silent --show-error --location --max-time 20 -D - -o /dev/null https://fiiviu.ro/ | tr -d '\r')"
            if printf '%s\n' "$headers" | grep -Fqi 'Strict-Transport-Security: max-age=31536000; includeSubDomains' &&
               printf '%s\n' "$headers" | grep -Fqi 'X-Frame-Options: DENY' &&
               printf '%s\n' "$headers" | grep -Fqi 'X-Content-Type-Options: nosniff' &&
               printf '%s\n' "$headers" | grep -Fqi 'Referrer-Policy: strict-origin-when-cross-origin' &&
               printf '%s\n' "$headers" | grep -Fqi 'Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(self)'; then
              echo "Public Pages deployment is serving the expected baseline security headers."
              exit 0
            fi
            echo "Waiting for public Pages deployment to expose baseline security headers (attempt $attempt/30)..."
            sleep 10
          done
          echo "Public Pages deployment did not expose the expected baseline security headers within 5 minutes."
          exit 1

      - name: Verify production endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20               --header 'Accept: application/json'               https://fiiviu.ro/api/offers               --output /tmp/offers.json; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/offers.json","utf8")); if(!Array.isArray(d.offers)) throw new Error("Catalog response has no offers array"); for(const o of d.offers){ if(!Object.prototype.hasOwnProperty.call(o,"duration")) throw new Error("Production API is missing duration"); if(!Object.prototype.hasOwnProperty.call(o,"guide_language")) throw new Error("Production API is missing guide_language"); }'
              exit 0
            fi
            sleep 10
          done
          echo "Production catalog did not become healthy after deployment."
          exit 1
