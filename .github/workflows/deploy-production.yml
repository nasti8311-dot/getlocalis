name: Deploy production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

      - name: Validate Wrangler bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run

      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply fiiviu-payouts --remote

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20               --header 'Accept: application/json'               https://fiiviu.ro/api/offers               --output /tmp/offers.json; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/offers.json","utf8")); if(!Array.isArray(d.offers)) throw new Error("Catalog response has no offers array"); for(const o of d.offers){ if(!Object.prototype.hasOwnProperty.call(o,"duration")) throw new Error("Production API is missing duration"); if(!Object.prototype.hasOwnProperty.call(o,"guide_language")) throw new Error("Production API is missing guide_language"); }'
              exit 0
            fi
            sleep 10
          done
          echo "Production catalog did not become healthy after deployment."
          exit 1
