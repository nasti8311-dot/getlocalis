name: Deploy production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

      - name: Validate Wrangler bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run

      - name: Repair production D1 schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          add_column_if_missing() {
            local table="$1"
            local column="$2"
            local definition="$3"
            local output
            if output="$(npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "ALTER TABLE $table ADD COLUMN $column $definition" 2>&1)"; then
              echo "Added $table.$column"
              return 0
            fi
            if printf '%s' "$output" | grep -qi "duplicate column name: $column"; then
              echo "$table.$column already exists."
              return 0
            fi
            printf '%s\\n' "$output"
            return 1
          }

          add_column_if_missing "offers" "capacity" "INTEGER"
          add_column_if_missing "offers" "duration" "TEXT"
          add_column_if_missing "offers" "availability_rules" "TEXT"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE INDEX IF NOT EXISTS idx_offers_capacity ON offers(capacity)"

          # Provider self-registration fields and accepted-contract evidence.
          add_column_if_missing "providers" "company_name" "TEXT"
          add_column_if_missing "providers" "cui" "TEXT"
          add_column_if_missing "providers" "representative_name" "TEXT"
          add_column_if_missing "offers" "pay_on_site_cash" "INTEGER NOT NULL DEFAULT 1"
          add_column_if_missing "offers" "pay_on_site_card" "INTEGER NOT NULL DEFAULT 1"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_providers_cui ON providers(cui) WHERE cui IS NOT NULL"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE TABLE IF NOT EXISTS vendor_contract_logs (id TEXT PRIMARY KEY, provider_ref TEXT NOT NULL REFERENCES providers(provider_ref), accepted_at TEXT NOT NULL, ip_address TEXT NOT NULL, user_agent TEXT NOT NULL, contract_version TEXT NOT NULL, contract_sha256 TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP)"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE INDEX IF NOT EXISTS idx_vendor_contract_logs_provider_ref ON vendor_contract_logs(provider_ref)"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE INDEX IF NOT EXISTS idx_vendor_contract_logs_accepted_at ON vendor_contract_logs(accepted_at)"

          add_column_if_missing "bookings" "offer_id" "INTEGER"
          add_column_if_missing "bookings" "proof_token" "TEXT"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_bookings_proof_token ON bookings(proof_token) WHERE proof_token IS NOT NULL"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE INDEX IF NOT EXISTS idx_bookings_offer_slot ON bookings(offer_id,booking_date,booking_time,status,payment_status)"

          # Backward-compatible fields for the FiiViu 20/80 payment model.
          # Existing rows keep their old amount_cents semantics and default to legacy_connect.
          add_column_if_missing "bookings" "total_amount_cents" "INTEGER"
          add_column_if_missing "bookings" "fiiviu_fee_cents" "INTEGER"
          add_column_if_missing "bookings" "provider_due_cents" "INTEGER"
          add_column_if_missing "bookings" "payment_model" "TEXT NOT NULL DEFAULT 'legacy_connect'"
          add_column_if_missing "bookings" "cancellation_reason" "TEXT"
          add_column_if_missing "bookings" "provider_ref" "TEXT"

          # These localized experience fields were historically added by request-time schema evolution.
          # Ensure them before deploying the strict migration-owned schema check.
          add_column_if_missing "experiences" "title_en" "TEXT"
          add_column_if_missing "experiences" "title_ro" "TEXT"
          add_column_if_missing "experiences" "description_en" "TEXT"
          add_column_if_missing "experiences" "description_ro" "TEXT"
          add_column_if_missing "experiences" "meeting_point_name_en" "TEXT"
          add_column_if_missing "experiences" "meeting_point_name_ro" "TEXT"
          add_column_if_missing "experiences" "meeting_instructions_en" "TEXT"
          add_column_if_missing "experiences" "meeting_instructions_ro" "TEXT"

          echo "Production D1 schema repair completed."

      - name: Upload changed static assets
        id: assets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const root = process.cwd();
          const ignored = fs.readFileSync(".assetsignore", "utf8").split(/\r?\n/).map(x => x.trim()).filter(x => x && !x.startsWith("#"));
          const skip = (rel) => ignored.some(pattern => {
            if (pattern.endsWith("/")) return rel.startsWith(pattern);
            if (pattern.startsWith("*.")) return rel.endsWith(pattern.slice(1));
            if (pattern.includes("*")) return false;
            return rel === pattern || rel.startsWith(pattern + "/");
          });
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              const rel = path.relative(root, full).split(path.sep).join("/");
              if (skip(rel)) continue;
              if (entry.isDirectory() && [".git", ".github", "node_modules", ".wrangler", "tests", "docs"].includes(entry.name)) continue;
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile()) files.push({ rel, full, bytes: fs.readFileSync(full) });
            }
          }
          walk(root);
          if (!files.length) throw new Error("No static assets were found.");
          const manifest = {};
          const byHash = new Map();
          for (const file of files) {
            const ext = path.extname(file.rel).slice(1);
            const hash = crypto.createHash("sha256").update(file.bytes.toString("base64") + ext).digest("hex").slice(0, 32);
            manifest["/" + file.rel] = { hash, size: file.bytes.length };
            byHash.set(hash, file);
          }
          const base = "https://api.cloudflare.com/client/v4/accounts/" + process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN };
          async function api(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const data = await response.json();
            if (!response.ok || data.success === false) throw new Error("Cloudflare asset API failed (" + response.status + "): " + JSON.stringify(data.errors || data));
            return data.result || data;
          }
          (async () => {
            const session = await api(base + "/workers/scripts/getlocalis/assets-upload-session", {
              method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ manifest })
            });
            if (!session.jwt || !Array.isArray(session.buckets)) throw new Error("Cloudflare did not return an asset upload session.");
            let completionJwt = session.jwt;
            for (let i = 0; i < session.buckets.length; i++) {
              const payload = {};
              for (const hash of session.buckets[i]) {
                const file = byHash.get(hash);
                if (!file) throw new Error("Cloudflare requested unknown asset hash " + hash);
                payload[hash] = file.bytes.toString("base64");
              }
              const form = new FormData();
              const mimeByExtension = { html: "text/html", htm: "text/html", js: "application/javascript", css: "text/css", svg: "image/svg+xml", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", json: "application/json", txt: "text/plain", xml: "application/xml", ico: "image/x-icon", webmanifest: "application/manifest+json" };
              for (const [hash, encoded] of Object.entries(payload)) {
                const file = byHash.get(hash);
                const ext = path.extname(file.rel).slice(1).toLowerCase();
                form.append(hash, new Blob([encoded], { type: mimeByExtension[ext] || "application/octet-stream" }));
              }
              const response = await fetch(base + "/workers/assets/upload?base64=true", {
                method: "POST", headers: { Authorization: "Bearer " + session.jwt }, body: form
              });
              const data = await response.json();
              if (!response.ok || data.success === false) throw new Error("Cloudflare asset batch " + (i + 1) + " failed (HTTP " + response.status + "): " + JSON.stringify(data));
              if (data.result?.jwt) completionJwt = data.result.jwt;
            }
            if (session.buckets.length && completionJwt === session.jwt) throw new Error("Cloudflare did not return the final asset completion token.");
            fs.appendFileSync(process.env.GITHUB_ENV, "ASSET_COMPLETION_JWT=" + completionJwt + "\n");
            console.log("Static asset manifest prepared (" + files.length + " files); uploaded " + session.buckets.length + " changed batch(es).");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Set production rollback target
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          versions_response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/getlocalis/versions?per_page=1")"
          known_good="$(printf '%s' "$versions_response" | jq -r 'if (.result | type) == "array" then .result[0].id // empty elif (.result.versions | type) == "array" then .result.versions[0].id // empty else empty end')"
          if [ -n "$known_good" ]; then
            echo "Captured current production version $known_good for rollback."
          else
            echo "No prior production version returned; automatic rollback will be skipped if needed."
          fi
          printf 'KNOWN_GOOD_VERSION_ID=%s\n' "$known_good" >> "$GITHUB_ENV"

      - name: Upload and deploy Worker with secrets while reusing existing assets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PAYOUT_KEY: ${{ secrets.ADMIN_PAYOUT_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${ASSET_COMPLETION_JWT:-}" ]; then
            echo "Static asset upload did not return a completion token."
            exit 1
          fi
          if [ -z "${ADMIN_PAYOUT_KEY:-}" ]; then
            echo "Required GitHub Actions secret ADMIN_PAYOUT_KEY is missing; refusing Worker upload."
            exit 1
          fi

          if [ -z "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            echo "Required GitHub Actions secret STRIPE_WEBHOOK_SECRET is missing; refusing Worker upload."
            exit 1
          fi

          # Build output already exists from the dry-run validation step. Use the
          # documented Script Upload API keep_assets option to bypass the broken
          # assets-upload-session endpoint and retain the currently deployed assets.
          bundle_file="$(find .wrangler-dry-run -maxdepth 1 -type f -name '*.js' ! -name '*.map' -print -quit)"
          if [ -z "$bundle_file" ]; then
            echo "Could not find the bundled Worker JavaScript in .wrangler-dry-run."
            find .wrangler-dry-run -maxdepth 2 -type f -print || true
            exit 1
          fi
          main_module="$(basename "$bundle_file")"

          node - "$main_module" "$GITHUB_SHA" > /tmp/worker-metadata.json <<'NODE'
          const fs = require("node:fs");
          const [mainModule, sha] = process.argv.slice(2);
          const adminPayoutKey = process.env.ADMIN_PAYOUT_KEY;
          const stripeWebhookSecret = process.env.STRIPE_WEBHOOK_SECRET;
          if (!adminPayoutKey) {
            console.error("Required GitHub Actions secret ADMIN_PAYOUT_KEY is missing; refusing Worker upload.");
            process.exit(1);
          }
          if (!stripeWebhookSecret) {
            console.error("Required GitHub Actions secret STRIPE_WEBHOOK_SECRET is missing; refusing Worker upload.");
            process.exit(1);
          }
          const bindings = [
            { type: "assets", name: "ASSETS" },
            { type: "d1", name: "DB", id: "c445e0ff-8013-4e20-988b-71b019c41db7" },
            { type: "r2_bucket", name: "PROVIDER_IMAGES", bucket_name: "fiiviu-provider-images" },
            { type: "send_email", name: "EMAIL", allowed_sender_addresses: ["noreply@fiiviu.ro"] },
            { type: "secret_text", name: "ADMIN_PAYOUT_KEY", text: adminPayoutKey },
            { type: "secret_text", name: "STRIPE_WEBHOOK_SECRET", text: stripeWebhookSecret },
          ];
          console.log("STRIPE_WEBHOOK_SECRET supplied to Worker version.");
          const metadata = {
            main_module: mainModule,
            compatibility_date: "2026-09-14",
            assets: { jwt: process.env.ASSET_COMPLETION_JWT },
            keep_bindings: ["plain_text", "secret_text"],
            annotations: { "workers/message": "GitHub Actions " + sha },
            bindings
          };
          fs.writeFileSync("/tmp/worker-metadata.json", JSON.stringify(metadata));
          NODE

          response_file=/tmp/worker-upload-response.json
          if ! curl --silent --show-error --fail-with-body \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --form "metadata=@/tmp/worker-metadata.json;type=application/json" \
            --form "$main_module=@$bundle_file;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/getlocalis" \
            --output "$response_file"; then
            echo "Direct Worker script upload failed:"
            cat "$response_file" || true
            exit 1
          fi

          cat "$response_file" | jq .

      - name: Verify production endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --show-error --location --max-time 20 -o /tmp/offers-response -w '%{http_code}' \
              --header 'Accept: application/json' https://fiiviu.ro/api/offers)"
            if [ "$status" = "200" ]; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/offers-response","utf8")); if(!Array.isArray(d.offers)) throw new Error("Catalog response has no offers array"); for(const o of d.offers){ if(!Object.prototype.hasOwnProperty.call(o,"duration")) throw new Error("Production API is missing duration"); if(!Object.prototype.hasOwnProperty.call(o,"guide_language")) throw new Error("Production API is missing guide_language"); }'
              admin_status="$(curl --silent --show-error --max-time 20 -D /tmp/admin.headers -o /tmp/admin.html -w '%{http_code}' https://fiiviu.ro/admin)"
              admin_title="$(grep -o '<title>[^<]*</title>' /tmp/admin.html | head -n 1 || true)"
              echo "ADMIN /admin status=$admin_status title=$admin_title"
              if [ "$admin_status" != "200" ] || [ "$admin_title" != "<title>FiiViu – Admin</title>" ]; then
                echo "--- /admin headers ---"
                cat /tmp/admin.headers
                echo "--- /admin body (first 80 lines) ---"
                sed -n '1,80p' /tmp/admin.html
                exit 1
              fi
              admin_slash_status="$(curl --silent --show-error --max-time 20 -D /tmp/admin-slash.headers -o /tmp/admin-slash.html -w '%{http_code}' https://fiiviu.ro/admin/)"
              admin_slash_title="$(grep -o '<title>[^<]*</title>' /tmp/admin-slash.html | head -n 1 || true)"
              echo "ADMIN /admin/ status=$admin_slash_status title=$admin_slash_title"
              if [ "$admin_slash_status" != "200" ] || [ "$admin_slash_title" != "<title>FiiViu – Admin</title>" ]; then
                echo "--- /admin/ headers ---"
                cat /tmp/admin-slash.headers
                echo "--- /admin/ body (first 80 lines) ---"
                sed -n '1,80p' /tmp/admin-slash.html
                exit 1
              fi
              provider_register_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/provider-register.html -w '%{http_code}' https://fiiviu.ro/anbieter/register)"
              if [ "$provider_register_status" != "200" ] || ! grep -q "accept_contract" /tmp/provider-register.html || ! grep -q "contractul de parteneriat" /tmp/provider-register.html; then
                echo "Provider registration page is unavailable or missing required contract acceptance (HTTP $provider_register_status)."
                exit 1
              fi
              provider_login_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/provider-login.html -w '%{http_code}' https://fiiviu.ro/anbieter/login)"
              if [ "$provider_login_status" != "200" ] || ! grep -q "providerLoginForm" /tmp/provider-login.html; then
                echo "Provider login page is unavailable (HTTP $provider_login_status)."
                exit 1
              fi
              provider_terms_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/provider-terms.html -w '%{http_code}' https://fiiviu.ro/legal/anbieter-bedingungen.html)"
              if [ "$provider_terms_status" != "200" ] || ! grep -q "20/80" /tmp/provider-terms.html; then
                echo "Provider terms page is unavailable or missing 20/80 terms (HTTP $provider_terms_status)."
                exit 1
              fi
              echo "Provider registration, login, and contract terms pages are reachable."
              proof_page_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/booking-verification.html -w '%{http_code}' https://fiiviu.ro/booking-verification.html)"
              if [ "$proof_page_status" != "200" ] || ! grep -qi "payment proof\|Zahlungsnachweis" /tmp/booking-verification.html; then
                echo "Booking deposit verification page is unavailable (HTTP $proof_page_status)."
                exit 1
              fi
              qr_script_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/qrcode.min.js -w '%{http_code}' https://fiiviu.ro/qrcode.min.js)"
              if [ "$qr_script_status" != "200" ] || ! grep -q "QRCode" /tmp/qrcode.min.js; then
                echo "Locally hosted QR generator is unavailable (HTTP $qr_script_status)."
                exit 1
              fi
              booking_page_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/booking.html -w '%{http_code}' https://fiiviu.ro/booking.html)"
              if [ "$booking_page_status" != "200" ] || ! grep -q "depositQr" /tmp/booking.html; then
                echo "Customer booking page is missing the deposit QR section (HTTP $booking_page_status)."
                exit 1
              fi
              echo "Customer QR proof page, local QR library, and booking page are live."
              admin_api_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/admin.json -w '%{http_code}' https://fiiviu.ro/api/admin/partners)"
              echo "ADMIN /api/admin/partners HTTP $admin_api_status"
              if [ "$admin_api_status" != "401" ]; then
                echo "Admin endpoint did not return the expected unauthorized status."
                exit 1
              fi
              stats_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/stats.json -w '%{http_code}' 'https://fiiviu.ro/api/partner-stats?ref=TEST')"
              echo "PARTNER STATS HTTP $stats_status"
              if [ "$stats_status" != "401" ]; then
                echo "Partner stats endpoint did not return the expected unauthorized status."
                exit 1
              fi
              exit 0
            fi

            # The repository intentionally ships with UNDER_CONSTRUCTION=true.
            # In that mode the Worker returns its branded 503 page for the public
            # catalog. Treat that known gate as expected, but still verify the
            # protected API routes remain behind authentication.
            if [ "$status" = "503" ] && grep -qi "Coming Soon" /tmp/offers-response; then
              echo "Worker is deployed. Public catalog remains gated by UNDER_CONSTRUCTION=true (expected 503); checkout is not publicly available yet."
              admin_api_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/admin.json -w '%{http_code}' https://fiiviu.ro/api/admin/partners)"
              echo "ADMIN /api/admin/partners HTTP $admin_api_status"
              if [ "$admin_api_status" != "401" ]; then
                echo "Admin endpoint did not return the expected unauthorized status."
                exit 1
              fi
              stats_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/stats.json -w '%{http_code}' 'https://fiiviu.ro/api/partner-stats?ref=TEST')"
              echo "PARTNER STATS HTTP $stats_status"
              if [ "$stats_status" != "401" ]; then
                echo "Partner stats endpoint did not return the expected unauthorized status."
                exit 1
              fi
              exit 0
            fi
            echo "Unexpected production catalog response: HTTP $status (attempt $attempt/5)."
            sleep 10
          done
          echo "Production catalog did not become healthy after deployment."
          exit 1
      - name: Roll back if production verification fails
        if: failure()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KNOWN_GOOD_VERSION_ID:-}" ]; then
            echo "No known-good rollback version was recorded; leaving deployment unchanged."
            exit 0
          fi
          echo "Verification failed; restoring last known-good version $KNOWN_GOOD_VERSION_ID."
          npx --yes wrangler@4 versions deploy "${KNOWN_GOOD_VERSION_ID}@100%" --yes

