name: Deploy production Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

      - name: Validate Wrangler bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=.wrangler-dry-run

      - name: Upload Worker version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4 versions upload --message "GitHub Actions \$GITHUB_SHA")"
          printf '%s\n' "$output"
          version_id="$(printf '%s\n' "$output" | sed -nE 's/.*Version ID[^0-9a-f]*([0-9a-f-]{36}).*/\1/p' | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Could not determine uploaded Worker version ID."
            exit 1
          fi
          printf 'WORKER_VERSION_ID=%s\n' "$version_id" >> "$GITHUB_ENV"

      - name: Deploy Worker version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy "${WORKER_VERSION_ID}@100%" --yes

      - name: Verify production endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 \
              --header 'Accept: application/json' \
              https://fiiviu.ro/api/offers \
              --output /tmp/offers.json; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/offers.json","utf8")); if(!Array.isArray(d.offers)) throw new Error("Catalog response has no offers array"); for(const o of d.offers){ if(!Object.prototype.hasOwnProperty.call(o,"duration")) throw new Error("Production API is missing duration"); if(!Object.prototype.hasOwnProperty.call(o,"guide_language")) throw new Error("Production API is missing guide_language"); }'
              exit 0
            fi
            sleep 10
          done
          echo "Production catalog did not become healthy after deployment."
          exit 1

          admin_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/admin.json -w '%{http_code}' https://fiiviu.ro/api/admin/partners)"
          test "$admin_status" = "401"

          stats_status="$(curl --silent --show-error --location --max-time 20 -o /tmp/stats.json -w '%{http_code}' https://fiiviu.ro/api/partner-stats?ref=TEST)"
          test "$stats_status" = "401"
