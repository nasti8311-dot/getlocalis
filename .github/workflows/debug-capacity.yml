name: Temporary capacity diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect paid booking aggregates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== 2026-10-04 18:00 BOOKINGS ==="
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "SELECT offer_id, booking_date, booking_time, guests, experience_name, provider_name, status, payment_status FROM bookings WHERE booking_date IN ('2026-10-04','04.10.2026','10/04/2026') AND (booking_time LIKE '18:00%' OR booking_time LIKE '18.00%') ORDER BY id"
