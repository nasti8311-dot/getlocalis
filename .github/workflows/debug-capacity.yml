name: Temporary capacity diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check production availability
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://fiiviu.ro/api/offer-availability?offerId=5&date=2026-10-04&time=18:00"
