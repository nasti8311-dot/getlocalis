name: Fix footer legal links

on:
  push:
    paths:
      - '.footer-links-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace footer buttons with links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '''<button\n                        href="/legal/impressum.html"\n                        class="block hover:text-white"\n                        data-i18n="imprint">\n                        Impressum\n                    </button>''': '''<a\n                        href="/legal/impressum.html"\n                        class="block hover:text-white"\n                        data-i18n="imprint">\n                        Impressum\n                    </a>''',
              '''<button\n                        href="/legal/politica-de-confidentialitate.html"\n                        class="block hover:text-white"\n                        data-i18n="privacy">\n                        Datenschutz\n                    </button>''': '''<a\n                        href="/legal/politica-de-confidentialitate.html"\n                        class="block hover:text-white"\n                        data-i18n="privacy">\n                        Datenschutz\n                    </a>''',
              '''<button\n    href="/legal/termeni-si-conditii.html"\n    class="block hover:text-white"\n    data-i18n="terms">\n    AGB & Buchungsbedingungen\n</button>''': '''<a\n    href="/legal/termeni-si-conditii.html"\n    class="block hover:text-white"\n    data-i18n="terms">\n    AGB & Buchungsbedingungen\n</a>'''
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected footer block not found: {old[:60]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .footer-links-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .footer-links-fix-trigger .github/workflows/fix-footer-links.yml
          git commit -m "Fix legal footer links"
          git push
          rm -f .github/workflows/fix-footer-links.yml
          git add -u .github/workflows/fix-footer-links.yml
          git commit -m "Remove temporary footer fix workflow"
          git push
