name: Deploy FiiViu Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Syntax check Worker modules
        run: |
          node --check secure-entry.js
          node --check marketplace-entry.js
          node --check worker-entry.js
          node --check worker-entry-v2.js
          node --check worker.js
          node --check stripe-webhook.js
          node --check provider-auth.js

      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Set provider admin secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PAYOUT_KEY: ${{ secrets.ADMIN_PAYOUT_KEY }}
        run: |
          test -n "$ADMIN_PAYOUT_KEY"
          printf '%s' "$ADMIN_PAYOUT_KEY" | npx wrangler secret put ADMIN_PAYOUT_KEY --config wrangler.jsonc
