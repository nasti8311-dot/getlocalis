name: Launch production smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy production Worker"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions: {}

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public homepage
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' --output /tmp/home.html --write-out '%{http_code}' https://fiiviu.ro/)"
          if [ "$status" = "200" ]; then
            grep -q 'FiiViu' /tmp/home.html
          elif [ "$status" = "503" ] && grep -qi 'Coming Soon' /tmp/home.html; then
            echo "Public homepage is intentionally gated by UNDER_CONSTRUCTION=true."
          else
            echo "Unexpected homepage status: $status"
            exit 1
          fi

      - name: Check baseline security headers
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20 --dump-header /tmp/home.headers --output /dev/null --write-out '%{http_code}' https://fiiviu.ro/)"
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "Unexpected homepage status while checking security headers: $status"
            exit 1
          fi
          grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' /tmp/home.headers
          grep -qi '^x-frame-options: DENY' /tmp/home.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/home.headers
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/home.headers
          grep -Fqi 'permissions-policy: camera=(), microphone=(), geolocation=(), payment=(self)' /tmp/home.headers

      - name: Check first-party API CORS and no-store
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --header 'Origin: https://fiiviu.ro'             --output /tmp/provider-session-cors.json             --dump-header /tmp/provider-session.headers             --write-out '%{http_code}'             https://fiiviu.ro/api/provider-session)"
          test "$status" = "401"
          grep -qi '^access-control-allow-origin: https://fiiviu.ro' /tmp/provider-session.headers
          grep -qi '^cache-control: no-store' /tmp/provider-session.headers
          grep -qi '^vary: Origin' /tmp/provider-session.headers
          if grep -Eqi '^access-control-allow-origin:[[:space:]]*\*[[:space:]]*$' /tmp/provider-session.headers; then exit 1; fi
      - name: Check launch-critical static surfaces
        run: |
          set -euo pipefail
          for path in /robots.txt /sitemap.xml /manifest.json /icons/icon-192.svg /icons/icon-512.svg; do
            name="$(echo "$path" | tr '/' '_')"
            status="$(curl --silent --show-error --location --max-time 20 --output "/tmp/static${name}" --write-out '%{http_code}' "https://fiiviu.ro${path}")"
            test "$status" = "200"
          done
          grep -q 'Sitemap: https://fiiviu.ro/sitemap.xml' /tmp/static_robots.txt
          grep -q 'https://fiiviu.ro/' /tmp/static_sitemap.xml
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("/tmp/static_manifest.json","utf8")); if(m.start_url!=="/" || m.scope!=="/") throw new Error("PWA manifest scope/start_url mismatch"); if(!Array.isArray(m.icons) || m.icons.length<2) throw new Error("PWA manifest icons missing");'
          grep -qi '<svg' /tmp/static_icons_icon-192.svg
          grep -qi '<svg' /tmp/static_icons_icon-512.svg

      - name: Check public catalog
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20 --header 'Accept: application/json' --output /tmp/offers.json --write-out '%{http_code}' https://fiiviu.ro/api/offers)"
          if [ "$status" = "200" ]; then
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/offers.json","utf8")); if(!Array.isArray(d.offers)) throw new Error("Catalog response has no offers array");'
          elif [ "$status" = "503" ] && grep -qi 'Coming Soon' /tmp/offers.json; then
            echo "Public catalog is intentionally gated by UNDER_CONSTRUCTION=true."
          else
            echo "Unexpected public catalog status: $status"
            cat /tmp/offers.json
            exit 1
          fi

      - name: Check provider registration, login, and legal terms
        run: |
          set -euo pipefail
          register_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/provider-register.html --write-out '%{http_code}' https://fiiviu.ro/anbieter/register)"
          test "$register_status" = "200"
          grep -q 'accept_contract' /tmp/provider-register.html
          grep -q 'Partnervertrag' /tmp/provider-register.html
          login_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/provider-login.html --write-out '%{http_code}' https://fiiviu.ro/anbieter/login)"
          test "$login_status" = "200"
          grep -q 'providerLoginForm' /tmp/provider-login.html
          terms_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/provider-terms.html --write-out '%{http_code}' https://fiiviu.ro/legal/anbieter-bedingungen.html)"
          test "$terms_status" = "200"
          grep -q '20/80' /tmp/provider-terms.html

      - name: Check protected provider session
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --output /tmp/provider-session.json             --write-out '%{http_code}'             https://fiiviu.ro/api/provider-session)"
          test "$status" = "401"
          node -e 'const fs=require("fs"); JSON.parse(fs.readFileSync("/tmp/provider-session.json","utf8"));'

      - name: Check protected admin surface
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --output /tmp/admin-offers.json             --write-out '%{http_code}'             https://fiiviu.ro/api/admin/offers)"
          test "$status" = "401"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/admin-offers.json","utf8")); '

      - name: Check private booking view rejects missing token
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --output /tmp/booking-view.json             --write-out '%{http_code}'             'https://fiiviu.ro/api/booking?id=FV-INVALID')"
          test "$status" = "403"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/booking-view.json","utf8")); '

      - name: Check cancellation rejects missing token
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --request POST             --header 'Content-Type: application/json'             --data '{"bookingId":"FV-INVALID"}'             --output /tmp/cancel.json             --write-out '%{http_code}'             https://fiiviu.ro/api/cancel-booking)"
          test "$status" = "400" -o "$status" = "403"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/cancel.json","utf8")); '

      - name: Check Stripe webhook rejects unsigned requests
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --request POST             --header 'Content-Type: application/json'             --data '{}'             --output /tmp/webhook.json             --write-out '%{http_code}'             https://fiiviu.ro/api/stripe/webhook)"
          test "$status" = "400"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/webhook.json","utf8")); '

      - name: Check admin preflight is first-party restricted
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --request OPTIONS             --header 'Origin: https://fiiviu.ro'             --header 'Access-Control-Request-Method: GET'             --output /tmp/admin-options.txt             --dump-header /tmp/admin-options.headers             --write-out '%{http_code}'             https://fiiviu.ro/api/admin/offers)"
          test "$status" = "204"
          grep -qi '^access-control-allow-origin: https://fiiviu.ro' /tmp/admin-options.headers
          grep -qi '^access-control-allow-methods: GET, POST, PATCH, DELETE, OPTIONS' /tmp/admin-options.headers
          if grep -Eqi '^access-control-allow-origin:[[:space:]]*\*[[:space:]]*$' /tmp/admin-options.headers; then exit 1; fi

      - name: Check admin settlement status rejects missing key
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --output /tmp/settlement-status.json             --write-out '%{http_code}'             'https://fiiviu.ro/api/admin/settlement-status?booking_id=FV-INVALID')"
          test "$status" = "401"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/settlement-status.json","utf8")); '

      - name: Check admin settlement run rejects missing key
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --request POST             --header 'Content-Type: application/json'             --data '{}'             --output /tmp/settlement-run.json             --write-out '%{http_code}'             https://fiiviu.ro/api/admin/settlement-run)"
          test "$status" = "401"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/settlement-run.json","utf8")); '

      - name: Check checkout rejects malformed input before Stripe
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --request POST             --header 'Content-Type: application/json'             --data '{"guests":0}'             --output /tmp/payment-intent.json             --write-out '%{http_code}'             https://fiiviu.ro/api/create-payment-intent)"
          test "$status" = "400"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/payment-intent.json","utf8")); '

      - name: Check provider test booking rejects missing session
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --request POST             --header 'Content-Type: application/json'             --data '{"customerEmail":"smoke@example.com"}'             --output /tmp/provider-test-booking.json             --write-out '%{http_code}'             https://fiiviu.ro/api/provider-test-booking)"
          test "$status" = "401"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/provider-test-booking.json","utf8")); '

      - name: Check provider Connect endpoints reject missing session
        run: |
          set -euo pipefail
          for path in connect-status connect-onboarding; do
            status="$(curl --silent --show-error --location --max-time 20               --request GET               --output "/tmp/provider-${path}.json"               --write-out '%{http_code}'               "https://fiiviu.ro/api/provider/${path}")"
            test "$status" = "401"
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); ' "/tmp/provider-${path}.json"
          done

      - name: Check admin provider-password rejects missing key
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 20             --request POST             --header 'Content-Type: application/json'             --data '{"providerRef":"INVALID","email":"smoke@example.com"}'             --output /tmp/provider-password.json             --write-out '%{http_code}'             https://fiiviu.ro/api/admin/provider-password)"
          test "$status" = "401"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/provider-password.json","utf8")); '
