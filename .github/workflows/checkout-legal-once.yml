name: apply checkout legal hardening
on:
  push:
    branches: [main]
    paths:
      - .checkout-legal-trigger
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('''                    <p class="text-[11px] text-gray-400 mt-2"\n                       data-i18n="payment_note">\n                        Die Zahlungsabwicklung erfolgt sicher über Stripe.\n                    </p>\n\n                </div>''','''                    <p class="text-[11px] text-gray-400 mt-2"\n                       data-i18n="payment_note">\n                        Die Zahlungsabwicklung erfolgt sicher über Stripe.\n                    </p>\n\n                    <label class="mt-4 flex items-start gap-3 text-xs text-gray-600 leading-relaxed">\n                        <input type="checkbox" id="legal-acceptance" required class="mt-0.5 h-4 w-4 rounded border-gray-300 text-fii-orange focus:ring-fii-orange">\n                        <span data-i18n="legal_acceptance">\n                            Ich akzeptiere die AGB & Buchungsbedingungen und die für dieses Erlebnis geltenden Storno- und Rückerstattungsbedingungen. Ich habe die Datenschutzerklärung gelesen.\n                        </span>\n                    </label>\n\n                </div>''',1)
          s=s.replace('''<span data-i18n="pay_book">\n                        Sicher buchen\n                    </span>''','''<span data-i18n="pay_book">\n                        Zahlungspflichtig buchen\n                    </span>''',1)
          s=s.replace('''        pay_book: "Sicher buchen",''','''        pay_book: "Zahlungspflichtig buchen",\n        legal_acceptance: "Ich akzeptiere die AGB & Buchungsbedingungen und die für dieses Erlebnis geltenden Storno- und Rückerstattungsbedingungen. Ich habe die Datenschutzerklärung gelesen.",\n        provider_notice: "Die Leistung wird vom jeweiligen Erlebnisanbieter erbracht. FiiViu vermittelt die Buchung.",\n        cancellation_notice: "Storno- und Rückerstattungsbedingungen sind erlebnisspezifisch und vor der Zahlung einzusehen.",\n        terms_link: "AGB & Buchungsbedingungen",\n        refund_link: "Storno & Rückerstattung",\n        privacy_link: "Datenschutz",\n        legal_required: "Bitte bestätige vor der Zahlung die Buchungsbedingungen.",''',1)
          s=s.replace('''        pay_book: "Book securely",''','''        pay_book: "Book and pay",\n        legal_acceptance: "I accept the Terms & Booking Conditions and the cancellation and refund conditions applicable to this experience. I have read the Privacy Policy.",\n        provider_notice: "The service is provided by the respective experience provider. FiiViu acts as intermediary for the booking.",\n        cancellation_notice: "Cancellation and refund conditions are specific to the experience and are shown before payment.",\n        terms_link: "Terms & Booking Conditions",\n        refund_link: "Cancellation & Refunds",\n        privacy_link: "Privacy Policy",\n        legal_required: "Please confirm the booking conditions before payment.",''',1)
          s=s.replace('''        pay_book: "Rezervă în siguranță",''','''        pay_book: "Plătește și rezervă",\n        legal_acceptance: "Accept Termenii și condițiile de rezervare și condițiile de anulare și rambursare aplicabile acestei experiențe. Am citit Politica de confidențialitate.",\n        provider_notice: "Serviciul este furnizat de operatorul experienței. FiiViu acționează ca intermediar al rezervării.",\n        cancellation_notice: "Condițiile de anulare și rambursare sunt specifice experienței și sunt afișate înainte de plată.",\n        terms_link: "Termeni și condiții",\n        refund_link: "Anulare și rambursare",\n        privacy_link: "Politica de confidențialitate",\n        legal_required: "Confirmă condițiile de rezervare înainte de plată.",''',1)
          needle='''    const notes =\n        document.getElementById("customer-notes").value.trim();\n\n    const tourName ='''
          repl='''    const notes =\n        document.getElementById("customer-notes").value.trim();\n\n    const legalAcceptance = document.getElementById("legal-acceptance");\n    if (!legalAcceptance || !legalAcceptance.checked) {\n        cardErrors.textContent = translations[currentLang].legal_required || "Bitte bestätige vor der Zahlung die Buchungsbedingungen.";\n        submitButton.disabled = false;\n        return;\n    }\n\n    const tourName ='''
          assert needle in s
          s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
      - name: Replace footer legal modals with legal pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace("onclick=\"openModal('impressum-modal')\"", "href=\"/legal/impressum.html\"")
          s=s.replace("onclick=\"openModal('privacy-modal')\"", "href=\"/legal/politica-de-confidentialitate.html\"")
          s=s.replace("onclick=\"openModal('terms-modal')\"", "href=\"/legal/termeni-si-conditii.html\"")
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .checkout-legal-trigger .github/workflows/checkout-legal-once.yml
          git add index.html .checkout-legal-trigger .github/workflows/checkout-legal-once.yml
          git commit -m "Harden checkout legal flow"
          git push
