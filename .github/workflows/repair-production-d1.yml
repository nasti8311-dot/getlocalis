name: Repair production D1 schema (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_SCHEMA_REPAIR to add the known capacity fields/indexes"
        required: true
        type: choice
        options:
          - CANCEL
          - APPLY_SCHEMA_REPAIR

permissions:
  contents: read

concurrency:
  group: production-d1-schema-maintenance
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ inputs.confirm == 'APPLY_SCHEMA_REPAIR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Apply explicit idempotent schema repair
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          add_column_if_missing() {
            local table="$1"
            local column="$2"
            local definition="$3"
            local output
            if output="$(npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "ALTER TABLE $table ADD COLUMN $column $definition" 2>&1)"; then
              echo "Added $table.$column"
              return 0
            fi
            if printf '%s' "$output" | grep -qi "duplicate column name: $column"; then
              echo "$table.$column already exists."
              return 0
            fi
            printf '%s\n' "$output"
            return 1
          }

          add_column_if_missing "offers" "capacity" "INTEGER"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE INDEX IF NOT EXISTS idx_offers_capacity ON offers(capacity)"

          add_column_if_missing "bookings" "offer_id" "INTEGER"
          npx --yes wrangler@4 d1 execute fiiviu-payouts --remote --command "CREATE INDEX IF NOT EXISTS idx_bookings_offer_slot ON bookings(offer_id,booking_date,booking_time,status,payment_status)"

          echo "Production D1 schema repair completed."
