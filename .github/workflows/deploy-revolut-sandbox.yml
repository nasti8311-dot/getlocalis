name: Deploy isolated Revolut Sandbox Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revolut-sandbox-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy getlocalis-preview only
    runs-on: ubuntu-latest
    environment: revolut-sandbox
    steps:
      - name: Checkout isolated sandbox branch
        uses: actions/checkout@v4
        with:
          ref: sandbox/revolut-preview-isolation

      - name: Validate required isolated deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::STRIPE_SECRET_KEY must be a Stripe test-mode secret (sk_test_...)"; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate isolated Wrangler configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.preview.sandbox.jsonc

      - name: Deploy isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.preview.sandbox.jsonc

      - name: Set Stripe Sandbox secret on isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: printf '%s' "$STRIPE_SECRET_KEY" | npx --yes wrangler@4 secret put STRIPE_SECRET_KEY --config wrangler.preview.sandbox.jsonc
