name: apply-checkout-legal-update
on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout and legal links
        run: |
          cat > /tmp/patch.py <<'PYEOF'
from pathlib import Path
p=Path('index.html')
s=p.read_text()
old='''                    <p class="text-[11px] text-gray-400 mt-2"\n                       data-i18n="payment_note">\n                        Die Zahlungsabwicklung erfolgt sicher über Stripe.\n                    </p>\n\n                </div>\n\n\n                <button\n                    type="submit"\n                    id="submit-btn"'''
new='''                    <p class="text-[11px] text-gray-400 mt-2"\n                       data-i18n="payment_note">\n                        Die Zahlungsabwicklung erfolgt sicher über Stripe.\n                    </p>\n\n                    <label class="mt-4 flex items-start gap-3 text-xs text-gray-600 leading-relaxed">\n                        <input type="checkbox" id="legal-acceptance" required class="mt-0.5 h-4 w-4 rounded border-gray-300 text-fii-orange focus:ring-fii-orange">\n                        <span data-i18n="legal_acceptance">\n                            Ich akzeptiere die AGB & Buchungsbedingungen und die für dieses Erlebnis geltenden Storno- und Rückerstattungsbedingungen. Ich habe die Datenschutzerklärung gelesen.\n                        </span>\n                    </label>\n\n                </div>\n\n\n                <button\n                    type="submit"\n                    id="submit-btn"'''
assert old in s
s=s.replace(old,new,1)
s=s.replace('''                    <span data-i18n="pay_book">\n                        Sicher buchen\n                    </span>''','''                    <span data-i18n="pay_book">\n                        Zahlungspflichtig buchen\n                    </span>''',1)
old='''                <div class="mt-7 space-y-3 text-xs text-white/50">\n\n                    <div>\n                        <i class="fa-solid fa-check text-fii-orange mr-2"></i>\n                        <span data-i18n="secure">\n                            Sichere Zahlung\n                        </span>\n                    </div>\n\n                    <div>\n                        <i class="fa-solid fa-check text-fii-orange mr-2"></i>\n                        <span data-i18n="confirmation">\n                            Buchungsbestätigung per E-Mail\n                        </span>\n                    </div>\n\n                </div>'''
new='''                <div class="mt-7 space-y-3 text-xs text-white/50">\n\n                    <div>\n                        <i class="fa-solid fa-check text-fii-orange mr-2"></i>\n                        <span data-i18n="secure">\n                            Sichere Zahlung\n                        </span>\n                    </div>\n\n                    <div>\n                        <i class="fa-solid fa-check text-fii-orange mr-2"></i>\n                        <span data-i18n="confirmation">\n                            Buchungsbestätigung per E-Mail\n                        </span>\n                    </div>\n\n                    <div>\n                        <i class="fa-solid fa-user-tie text-fii-orange mr-2"></i>\n                        <span data-i18n="provider_notice">\n                            Die Leistung wird vom jeweiligen Erlebnisanbieter erbracht. FiiViu vermittelt die Buchung.\n                        </span>\n                    </div>\n\n                    <div>\n                        <i class="fa-solid fa-rotate-left text-fii-orange mr-2"></i>\n                        <span data-i18n="cancellation_notice">\n                            Storno- und Rückerstattungsbedingungen sind erlebnisspezifisch und vor der Zahlung einzusehen.\n                        </span>\n                    </div>\n\n                    <div class="pt-2 border-t border-white/10 flex flex-wrap gap-x-3 gap-y-1">\n                        <a href="/legal/termeni-si-conditii.html" target="_blank" rel="noopener" class="underline hover:text-white" data-i18n="terms_link">AGB & Buchungsbedingungen</a>\n                        <a href="/legal/anulare-si-rambursare.html" target="_blank" rel="noopener" class="underline hover:text-white" data-i18n="refund_link">Storno & Rückerstattung</a>\n                        <a href="/legal/politica-de-confidentialitate.html" target="_blank" rel="noopener" class="underline hover:text-white" data-i18n="privacy_link">Datenschutz</a>\n                    </div>\n\n                </div>'''
assert old in s
s=s.replace(old,new,1)
s=s.replace('''                    <button\n                        onclick="openModal('impressum-modal')"\n                        class="block hover:text-white"\n                        data-i18n="imprint">\n                        Impressum\n                    </button>''','''                    <a href="/legal/impressum.html"\n                       class="block hover:text-white"\n                       data-i18n="imprint">\n                        Impressum\n                    </a>''',1)
s=s.replace('''                    <button\n                        onclick="openModal('privacy-modal')"\n                        class="block hover:text-white"\n                        data-i18n="privacy">\n                        Datenschutz\n                    </button>''','''                    <a href="/legal/politica-de-confidentialitate.html"\n                       class="block hover:text-white"\n                       data-i18n="privacy">\n                        Datenschutz\n                    </a>''',1)
s=s.replace('''<button\n    onclick="openModal('terms-modal')"\n    class="block hover:text-white"\n    data-i18n="terms">\n    AGB & Buchungsbedingungen\n</button>''','''                    <a href="/legal/termeni-si-conditii.html"\n                       class="block hover:text-white"\n                       data-i18n="terms">\n                        AGB & Buchungsbedingungen\n                    </a>''',1)
s=s.replace('''        pay_book: "Sicher buchen",\n\n        summary:''','''        pay_book: "Zahlungspflichtig buchen",\n        legal_acceptance: "Ich akzeptiere die AGB & Buchungsbedingungen und die für dieses Erlebnis geltenden Storno- und Rückerstattungsbedingungen. Ich habe die Datenschutzerklärung gelesen.",\n        provider_notice: "Die Leistung wird vom jeweiligen Erlebnisanbieter erbracht. FiiViu vermittelt die Buchung.",\n        cancellation_notice: "Storno- und Rückerstattungsbedingungen sind erlebnisspezifisch und vor der Zahlung einzusehen.",\n        terms_link: "AGB & Buchungsbedingungen",\n        refund_link: "Storno & Rückerstattung",\n        privacy_link: "Datenschutz",\n        legal_required: "Bitte bestätige vor der Zahlung die Buchungsbedingungen.",\n\n        summary:''',1)
s=s.replace('''        pay_book: "Book securely",\n\n        summary:''','''        pay_book: "Book and pay",\n        legal_acceptance: "I accept the Terms & Booking Conditions and the cancellation and refund conditions applicable to this experience. I have read the Privacy Policy.",\n        provider_notice: "The service is provided by the respective experience provider. FiiViu acts as intermediary for the booking.",\n        cancellation_notice: "Cancellation and refund conditions are specific to the experience and are shown before payment.",\n        terms_link: "Terms & Booking Conditions",\n        refund_link: "Cancellation & Refunds",\n        privacy_link: "Privacy Policy",\n        legal_required: "Please confirm the booking conditions before payment.",\n\n        summary:''',1)
s=s.replace('''        pay_book: "Rezervă în siguranță",\n\n        summary:''','''        pay_book: "Plătește și rezervă",\n        legal_acceptance: "Accept Termenii și condițiile de rezervare și condițiile de anulare și rambursare aplicabile acestei experiențe. Am citit Politica de confidențialitate.",\n        provider_notice: "Serviciul este furnizat de operatorul experienței. FiiViu acționează ca intermediar al rezervării.",\n        cancellation_notice: "Condițiile de anulare și rambursare sunt specifice experienței și sunt afișate înainte de plată.",\n        terms_link: "Termeni și condiții",\n        refund_link: "Anulare și rambursare",\n        privacy_link: "Politica de confidențialitate",\n        legal_required: "Confirmă condițiile de rezervare înainte de plată.",\n\n        summary:''',1)
import re
s=re.sub(r'<!-- ========================================================= -->\n<!-- TERMS & BOOKING CONDITIONS MODAL -->\n<!-- ========================================================= -->\n\n<div id="terms-modal".*?</div>\n\n</div>', '', s, count=2, flags=re.S)
needle='''    const notes =\n        document.getElementById("customer-notes").value.trim();\n\n    const tourName ='''
repl='''    const notes =\n        document.getElementById("customer-notes").value.trim();\n\n    const legalAcceptance =\n        document.getElementById("legal-acceptance");\n\n    if (!legalAcceptance || !legalAcceptance.checked) {\n        cardErrors.textContent =\n            translations[currentLang].legal_required ||\n            "Bitte bestätige vor der Zahlung die Buchungsbedingungen.";\n        submitButton.disabled = false;\n        submitButton.innerHTML = `\n            <i class="fa-solid fa-lock mr-2"></i>\n            <span data-i18n="pay_book">\n                Zahlungspflichtig buchen\n            </span>\n        `;\n        return;\n    }\n\n    const tourName ='''
assert needle in s
s=s.replace(needle,repl,1)
p.write_text(s)
print('patched',len(s))
PYEOF
          python /tmp/patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Harden checkout legal flow"
          git push
