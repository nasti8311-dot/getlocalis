<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buchung verwalten – FiiViu</title>
<style>body{margin:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033}.wrap{max-width:620px;margin:0 auto;padding:28px 16px}.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 8px 30px rgba(20,30,50,.08)}.brand{font-size:24px;font-weight:800}.muted{color:#687286;line-height:1.55}.box{border:1px solid #e5e9f0;border-radius:14px;padding:18px;margin:20px 0}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef1f5}.row:last-child{border-bottom:0}.btn{display:inline-block;border:0;border-radius:9px;padding:13px 18px;font-weight:700;cursor:pointer;background:#111827;color:#fff}.danger{background:#b42318}.hidden{display:none}.error{color:#b42318}.success{color:#087443}</style>
<link rel="stylesheet" href="/assets/css/fiiviu-design-system.css">
<link rel="stylesheet" href="/assets/css/fiiviu-pages.css">
</head>
<body><div class="wrap"><div class="card"><div class="brand">FiiViu</div><h1 id="heading">Buchung verwalten</h1><div id="loading" class="muted">Buchung wird geladen …</div><div id="content" class="hidden"><div class="box"><h2 id="tour"></h2><div class="row"><span id="label-date">Datum</span><strong id="date"></strong></div><div class="row"><span id="label-time">Beginn</span><strong id="time"></strong></div><div class="row"><span id="label-guests">Personen</span><strong id="guests"></strong></div><div class="row"><span id="label-price">Gesamtpreis</span><strong id="price"></strong></div><div class="row hidden" id="online-row"><span id="label-online">Online an FiiViu (20 %)</span><strong id="online"></strong></div><div class="row hidden" id="provider-row"><span id="label-provider">Vor Ort an Anbieter (80 %)</span><strong id="provider-due"></strong></div><div class="row"><span id="label-id">Buchungs-ID</span><strong id="id"></strong></div></div><p id="policy" class="muted"></p><button id="cancel" class="btn danger">Buchung stornieren</button></div><div id="result" class="hidden"></div></div></div>
<script>
(function(){
const token=new URLSearchParams(location.search).get('token');
const loading=document.getElementById('loading'),content=document.getElementById('content'),result=document.getElementById('result'),cancel=document.getElementById('cancel');
let lang='de', direct=false, allowed=false, canCancel=false;
const T={
de:{title:'Buchung verwalten',loading:'Buchung wird geladen …',date:'Datum',time:'Beginn',guests:'Personen',price:'Gesamtpreis',online:'Online an FiiViu (20 %)',provider:'Vor Ort an Anbieter (80 %)',id:'Buchungs-ID',cancel:'Buchung stornieren',already:'Bereits storniert',started:'Erlebnis hat bereits begonnen',noRefund:'Stornieren (keine Erstattung)',working:'Stornierung wird verarbeitet …',invalid:'Ungültiger Stornierungslink.',notFound:'Buchung nicht gefunden.',confirm:'Möchtest du diese Buchung wirklich stornieren?',failed:'Stornierung fehlgeschlagen.',refunded:'Deine Buchung wurde storniert. Die Onlinegebühr wird vollständig zurückerstattet.',notRefunded:'Deine Buchung wurde storniert. Da die Stornierung weniger als 24 Stunden vor Beginn erfolgt, bleibt die Onlinegebühr bei FiiViu.',directFree:'Wenn du mindestens 24 Stunden vor Beginn stornierst, wird die online bezahlte Gebühr von 20 % vollständig erstattet. Bei späterer Stornierung bleibt sie bei FiiViu.',directLate:'Du kannst noch stornieren, aber bei weniger als 24 Stunden vor Beginn wird die online bezahlte Gebühr von 20 % nicht erstattet.',legacyFree:'Kostenlose Stornierung bis 24 Stunden vor Beginn.',legacyLate:'Die kostenlose Stornierungsfrist ist abgelaufen.',startedPolicy:'Das Erlebnis hat bereits begonnen; eine Online-Stornierung ist nicht mehr möglich.',genericError:'Etwas ist schiefgelaufen. Bitte versuche es erneut.'},
en:{title:'Manage booking',loading:'Loading booking …',date:'Date',time:'Start time',guests:'Guests',price:'Total price',online:'Paid online to FiiViu (20%)',provider:'Pay on site to provider (80%)',id:'Booking ID',cancel:'Cancel booking',already:'Already cancelled',started:'Experience has already started',noRefund:'Cancel (no refund)',working:'Processing cancellation …',invalid:'Invalid cancellation link.',notFound:'Booking not found.',confirm:'Are you sure you want to cancel this booking?',failed:'Cancellation failed.',refunded:'Your booking has been cancelled. The online fee will be fully refunded.',notRefunded:'Your booking has been cancelled. As the cancellation is less than 24 hours before the start, the online fee remains with FiiViu.',directFree:'If you cancel at least 24 hours before the start, the 20% online fee will be fully refunded. For later cancellations, it remains with FiiViu.',directLate:'You can still cancel, but the 20% online fee will not be refunded if you cancel less than 24 hours before the start.',legacyFree:'Free cancellation up to 24 hours before the start.',legacyLate:'The free-cancellation period has expired.',startedPolicy:'The experience has already started; online cancellation is no longer possible.',genericError:'Something went wrong. Please try again.'},
ro:{title:'Gestionează rezervarea',loading:'Se încarcă rezervarea …',date:'Data',time:'Ora începerii',guests:'Persoane',price:'Preț total',online:'Plătit online către FiiViu (20%)',provider:'De plătit la fața locului furnizorului (80%)',id:'ID rezervare',cancel:'Anulează rezervarea',already:'Deja anulată',started:'Experiența a început deja',noRefund:'Anulează (fără rambursare)',working:'Anularea se procesează …',invalid:'Link de anulare invalid.',notFound:'Rezervarea nu a fost găsită.',confirm:'Sigur dorești să anulezi această rezervare?',failed:'Anularea a eșuat.',refunded:'Rezervarea a fost anulată. Taxa online va fi rambursată integral.',notRefunded:'Rezervarea a fost anulată. Deoarece anularea are loc cu mai puțin de 24 de ore înainte de începere, taxa online rămâne la FiiViu.',directFree:'Dacă anulezi cu cel puțin 24 de ore înainte de începere, taxa online de 20% va fi rambursată integral. Pentru anulările ulterioare, aceasta rămâne la FiiViu.',directLate:'Poți anula în continuare, dar taxa online de 20% nu va fi rambursată dacă anulezi cu mai puțin de 24 de ore înainte de începere.',legacyFree:'Anulare gratuită cu până la 24 de ore înainte de începere.',legacyLate:'Perioada de anulare gratuită a expirat.',startedPolicy:'Experiența a început deja; anularea online nu mai este posibilă.',genericError:'A apărut o eroare. Te rugăm să încerci din nou.'}
};
function tr(k){return T[lang][k]||T.de[k]||k}
function showResult(text,cls){content.classList.add('hidden');loading.classList.add('hidden');result.className=cls||'';result.textContent=text;result.classList.remove('hidden')}
function setLanguage(d){
 lang=['de','en','ro'].includes(String(d.language||'').slice(0,2).toLowerCase())?String(d.language).slice(0,2).toLowerCase():'de';
 document.documentElement.lang=lang;document.title=tr('title')+' – FiiViu';
 document.getElementById('heading').textContent=tr('title');loading.textContent=tr('loading');
 const labels={date:'label-date',time:'label-time',guests:'label-guests',price:'label-price',online:'label-online',provider:'label-provider',id:'label-id'};
 Object.keys(labels).forEach(k=>document.getElementById(labels[k]).textContent=tr(k));
 cancel.textContent=tr('cancel');
}
async function load(){
 if(!token){showResult(T.de.invalid,'error');return}
 try{
 const r=await fetch('/api/cancel-booking?token='+encodeURIComponent(token));const d=await r.json();
 if(!r.ok)throw new Error(d.error||'notFound');
 setLanguage(d);direct=d.payment_model==='fiiviu_fee_20_direct_80';allowed=Boolean(d.allowed);canCancel=Boolean(d.can_cancel);
 document.getElementById('tour').textContent=d.tour_title;document.getElementById('date').textContent=d.booking_date;document.getElementById('time').textContent=(d.booking_time||'')+(lang==='de'?' Uhr':'');document.getElementById('guests').textContent=d.guests;document.getElementById('price').textContent=d.total_price;document.getElementById('id').textContent=d.booking_id;
 document.getElementById('policy').textContent=!canCancel?tr('startedPolicy'):direct?(allowed?tr('directFree'):tr('directLate')):(allowed?tr('legacyFree'):tr('legacyLate'));
 if(direct){document.getElementById('online').textContent=d.paid_online;document.getElementById('provider-due').textContent=d.due_to_provider;document.getElementById('online-row').classList.remove('hidden');document.getElementById('provider-row').classList.remove('hidden')}
 loading.classList.add('hidden');content.classList.remove('hidden');
 if(!canCancel||d.status==='cancelled'){cancel.disabled=true;cancel.style.opacity='.5';cancel.textContent=d.status==='cancelled'?tr('already'):tr('started')}
 else if(direct&&!allowed)cancel.textContent=tr('noRefund');
 }catch(e){showResult(e.message==='Buchung nicht gefunden.'?tr('notFound'):e.message==='Ungültiger Stornierungslink.'?tr('invalid'):tr('genericError'),'error')}
}
cancel.addEventListener('click',async()=>{
 if(!confirm(tr('confirm')))return;cancel.disabled=true;cancel.textContent=tr('working');
 try{
 const r=await fetch('/api/cancel-booking?token='+encodeURIComponent(token),{method:'POST'});const d=await r.json();
 if(!r.ok)throw new Error(d.error||tr('failed'));
 showResult(d.refunded?tr('refunded'):tr('notRefunded'),'success');
 }catch(e){cancel.disabled=false;cancel.textContent=tr('cancel');alert(tr('genericError'))}
});
load();
})();
</script><script src="/assets/js/fiiviu-consent.js" defer></script>
</body></html>
